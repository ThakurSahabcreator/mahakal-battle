<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Aviator Game</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
  body { background: #0b0f19; color: #fff; font-family: Arial; text-align: center; padding: 10px; }
  .box { background: #121824; max-width: 380px; margin: auto; padding: 15px; border-radius: 8px; border: 2px solid #ff4757; }
  button { background: #2ed573; color: #000; border: none; padding: 10px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 5px; margin-top: 10px; }
  input { width: 90%; padding: 8px; margin-top: 5px; background: #0b0f19; color: #fff; border: 1px solid #444; border-radius: 4px; text-align: center; }
  .live-box { background: #161f2e; margin-top: 15px; padding: 10px; border-radius: 6px; text-align: left; font-size: 12px; }
</style>
</head>
<body>

<div class="box">
  <!-- Title par click karke admin password dalna hai -->
  <h2 onclick="openAdmin()" style="cursor: pointer; color: #ff4757;">Aviator Game</h2>
  <p>Balance: ₹<span id="bal">90398</span></p>

  <div>
    <input type="number" id="bet-amt" value="100">
    <button onclick="placeBet()">BET LAGAYEN</button>
  </div>

  <div class="live-box">
    <b>🟢 Live Players:</b>
    <div id="players-list" style="margin-top: 5px;"></div>
  </div>
</div>

<script>
  const firebaseConfig = { databaseURL: "https://aviatorapp-9b1a6-default-rtdb.firebaseio.com/" };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let isAdmin = false;

  // Jab aap title par click karke password dalenge, tabhi aapke phone mein real mode on hoga
  function openAdmin() {
    let p = prompt("Admin Password Dalein:");
    if(p === "78699") {
      isAdmin = true;
      alert("Admin Mode On: Ab aapko real users dikhenge!");
    }
  }

  // User jab bhi bet lagayega, data server par save ho jayega
  function placeBet() {
    let amt = document.getElementById('bet-amt').value;
    let userId = "User_" + Math.floor(Math.random() * 1000);
    
    db.ref('realBets/' + userId).set({
      name: userId,
      amt: amt,
      status: "Playing ⏳"
    });
    alert("Bet lag gayi!");
  }

  // Yeh check karega ki kiska phone hai
  db.ref('realBets').on('value', (snapshot) => {
    let data = snapshot.val();
    let listEl = document.getElementById('players-list');
    listEl.innerHTML = "";

    // Agar Yeh AAPKA phone hai (Yaani password dal chuke hain) toh hi REAL dikhega[span_1](start_span)[span_1](end_span)
    if (isAdmin && data) {
      Object.values(data).forEach(u => {
        listEl.innerHTML += `<div style="color: #ff5252;">[REAL] ${u.name} - ₹${u.amt} (${u.status})</div>`;
      });
    } 
    else {
      // Aur agar yeh kisi AMM USER ka phone hai, toh use hamesha FAKE/nakli list hi dikhegi[span_2](start_span)[span_2](end_span)
      listEl.innerHTML += `
        <div>Rahul_99 - ₹500 (Playing)</div>
        <div>Amit_Vip - ₹1000 (Won ₹2100)</div>
        <div>Vikash_77 - ₹250 (Playing)</div>
        <div>Deepak_King - ₹2000 (Crash)</div>
      `;
    }
  });
</script>

</body>
</html>
