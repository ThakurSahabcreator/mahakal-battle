<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aviator Game - Thakur Sahab</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
  body { background: #0b0f19; color: #fff; font-family: Arial; text-align: center; padding: 10px; user-select: none; }
  .box { background: #121824; max-width: 380px; margin: auto; padding: 15px; border-radius: 8px; border: 2px solid #ff4757; }
  button { background: #2ed573; color: #000; border: none; padding: 10px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 5px; margin-top: 10px; }
  input { width: 90%; padding: 8px; margin-top: 5px; background: #0b0f19; color: #fff; border: 1px solid #444; border-radius: 4px; text-align: center; }
  .live-box { background: #161f2e; margin-top: 15px; padding: 10px; border-radius: 6px; text-align: left; font-size: 12px; }
</style>
</head>
<body>

<div class="box">
  <!-- Title par click karke admin password dalna hai -->
  <h2 onclick="openAdmin()" style="cursor: pointer; color: #ff4757;">Aviator Game</h2>
  <p>📱 <span id="user-phone-view" style="color: #00e676; font-size: 12px;">Loading...</span></p>
  <p>Balance: ₹<span id="bal">19</span></p>

  <div>
    <input type="number" id="bet-amt" value="100">
    <button onclick="placeBet()">BET LAGAYEN</button>
  </div>

  <button onclick="window.location.href='index.html'" style="background: #555; color: #fff; font-size: 11px; padding: 6px; margin-top: 8px;">🏠 Dashboard Par Wapas Jayein</button>

  <div class="live-box">
    <b>🟢 Live Players:</b>
    <div id="players-list" style="margin-top: 5px;"></div>
  </div>
</div>

<script>
  const firebaseConfig = { databaseURL: "https://aviatorapp-9b1a6-default-rtdb.firebaseio.com/" };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let isAdmin = false;

  function getCurrentUserPhone() {
      return localStorage.getItem('active_session_phone') || localStorage.getItem('logged_in_phone') || 'Guest_User';
  }

  function getWalletBalance() {
      let user = getCurrentUserPhone();
      if(!user || user === 'Guest_User') return 19;
      let bal = localStorage.getItem('user_bal_' + user);
      if(bal === null) {
          bal = '19';
          localStorage.setItem('user_bal_' + user, bal);
      }
      return parseFloat(bal);
  }

  function setWalletBalance(amount) {
      let user = getCurrentUserPhone();
      if(user && user !== 'Guest_User') {
          localStorage.setItem('user_bal_' + user, amount);
          updateUI();
      }
  }

  function updateUI() {
      let bal = getWalletBalance();
      document.getElementById('bal').innerText = bal;
      document.getElementById('user-phone-view').innerText = "Logged in: " + getCurrentUserPhone();
  }

  window.onload = function() {
      updateUI();
  };

  function openAdmin() {
    let p = prompt("Admin Password Dalein:");
    if(p === "78699") {
      isAdmin = true;
      alert("Admin Mode On: Ab aapko real users dikhenge!");
    }
  }

  function placeBet() {
    let amt = parseFloat(document.getElementById('bet-amt').value);
    let currentBal = getWalletBalance();
    let currentUser = getCurrentUserPhone();

    if(isNaN(amt) || amt <= 0) {
        alert("Sahi bet amount dalein!");
        return;
    }

    if(currentBal < amt) {
        alert("Wallet mein paryapt balance nahi hai!");
        return;
    }

    setWalletBalance(currentBal - amt);

    db.ref('realBets/' + currentUser).set({
      name: currentUser,
      amt: amt,
      status: "Playing ⏳"
    });
    alert("Bet safal-purvak lag gayi!");
  }

  db.ref('realBets').on('value', (snapshot) => {
    let data = snapshot.val();
    let listEl = document.getElementById('players-list');
    listEl.innerHTML = "";

    if (isAdmin && data) {
      Object.values(data).forEach(u => {
        listEl.innerHTML += `<div style="color: #ff5252;">[REAL] ${u.name} - ₹${u.amt} (${u.status})</div>`;
      });
    } 
    else {
      listEl.innerHTML += `
        <div>Rahul_99 - ₹500 (Playing)</div>
        <div>Amit_Vip - ₹1000 (Won ₹2100)</div>
        <div>Vikash_77 - ₹250 (Playing)</div>
        <div>Deepak_King - ₹2000 (Crash)</div>
      `;
    }
  });
</script>

</body>
</html>
