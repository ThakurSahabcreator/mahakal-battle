<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murga Road Cross - Mahakal Edition</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: linear-gradient(135deg, #1a1a1a, #2c3e50);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h2 { margin: 5px 0; color: #ffeb3b; font-size: 22px; text-shadow: 1px 1px 3px #000; }
        #scoreboard {
            font-size: 18px;
            margin-bottom: 8px;
            background: rgba(0, 0, 0, 0.4);
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid #ffeb3b;
        }
        #game-container {
            position: relative;
            width: 340px;
            height: 460px;
            background: #444;
            border: 4px solid #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }
        .road {
            position: absolute;
            width: 100%;
            height: 70px;
            background: #2b2b2b;
            border-top: 2px dashed #ffeb3b;
            border-bottom: 2px dashed #ffeb3b;
        }
        .safe-zone {
            position: absolute;
            width: 100%;
            height: 60px;
            background: #2e7d32;
        }
        #chicken {
            position: absolute;
            bottom: 10px;
            left: 150px;
            width: 35px;
            height: 35px;
            background: #ff9800;
            border-radius: 50%;
            text-align: center;
            line-height: 35px;
            font-size: 20px;
            z-index: 10;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            transition: left 0.1s ease;
        }
        .car {
            position: absolute;
            width: 55px;
            height: 28px;
            background: #e74c3c;
            border-radius: 6px;
            font-size: 12px;
            text-align: center;
            line-height: 28px;
            color: white;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }
        .controls {
            margin-top: 12px;
            display: flex;
            gap: 10px;
        }
        .btn {
            padding: 10px 18px;
            background: #27ae60;
            color: white;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-danger { background: #c0392b; }
        .btn-side { background: #2980b9; padding: 10px 14px; }
    </style>
</head>
<body>

    <h2>🐔 मुर्गा रोड क्रॉस गेम 🚗</h2>
    <div id="scoreboard">पॉइंट्स / कमाई: ₹<span id="score">0</span></div>

    <div id="game-container">
        <!-- सुरक्षित जोन (शुरुआत और फिनिश) -->
        <div class="safe-zone" style="bottom: 0;"></div>
        <div class="safe-zone" style="top: 0;"></div>

        <!-- सड़कें -->
        <div class="road" style="top: 120px;"></div>
        <div class="road" style="top: 250px;"></div>
        
        <!-- गाड़ियाँ (Obstacles) -->
        <div class="car" id="car1" style="top: 140px; left: -70px;">🚗 कार</div>
        <div class="car" id="car2" style="top: 270px; left: 340px; background: #2980b9;">🚙 जीप</div>

        <!-- मुर्गा कैरेक्टर -->
        <div id="chicken">🐔</div>
    </div>

    <!-- कंट्रोल बटन (मोबाइल और पीसी दोनों के लिए) -->
    <div class="controls">
        <button class="btn btn-side" onclick="moveLeft()">◀️ बाएं</button>
        <button class="btn" onclick="moveChicken()">आगे कूदो ⬆️</button>
        <button class="btn btn-side" onclick="moveRight()">दाएं ▶️</button>
    </div>
    <button class="btn btn-danger" style="margin-top: 8px; padding: 6px 12px; font-size: 14px;" onclick="resetGame()">रीस्टार्ट गेम 🔄</button>

    <script>
        let chicken = document.getElementById("chicken");
        let car1 = document.getElementById("car1");
        let car2 = document.getElementById("car2");
        let scoreDisplay = document.getElementById("score");

        let chickenY = 410; // नीचे से शुरू
        let chickenX = 150;
        let score = 0;
        let isAlive = true;

        let car1X = -70;
        let car2X = 340;

        // मुर्गे को बाएं ले जाने के लिए
        function moveLeft() {
            if (!isAlive) return;
            if (chickenX > 10) chickenX -= 20;
            chicken.style.left = chickenX + "px";
        }

        // मुर्गे को दाएं ले जाने के लिए
        function moveRight() {
            if (!isAlive) return;
            if (chickenX < 290) chickenX += 20;
            chicken.style.left = chickenX + "px";
        }

        // मुर्गे को आगे (ऊपर) कूदने के लिए
        function moveChicken() {
            if (!isAlive) return;
            chickenY -= 50; 
            if (chickenY < 20) {
                score += 10; // रोड पार करने पर ₹10 मिल गए
                scoreDisplay.innerText = score;
                alert("शानदार! मुर्गा सुरक्षित पार हो गया! +₹10 जीत गए 🎉");
                resetChicken();
            }
        }

        function resetChicken() {
            chickenY = 410;
            chickenX = 150;
            chicken.style.left = chickenX + "px";
        }

        function resetGame() {
            score = 0;
            scoreDisplay.innerText = score;
            isAlive = true;
            resetChicken();
        }

        // गाड़ियों की रफ़्तार और टक्कर का लूप
        function gameLoop() {
            if (!isAlive) return;

            // कार 1 की गति (बाएं से दाएं)
            car1X += 5;
            if (car1X > 340) car1X = -70;
            car1.style.left = car1X + "px";

            // कार 2 की गति (दाएं से बाएं)
            car2X -= 6;
            if (car2X < -60) car2X = 340;
            car2.style.left = car2X + "px";

            // टक्कर की जाँच (Collision Check)
            // मुर्गे की स्क्रीन पोजीशन निकालें
            let cLeft = chickenX;
            let cRight = chickenX + 35;
            let cTop = chickenY;
            let cBottom = chickenY + 35;

            // कार 1 की पोजीशन
            let car1Left = car1X;
            let car1Right = car1X + 55;
            let car1Top = 140;
            let car1Bottom = 168;

            // कार 2 की पोजीशन
            let car2Left = car2X;
            let car2Right = car2X + 55;
            let car2Top = 270;
            let car2Bottom = 298;

            // टक्कर होने पर चेक करें
            if (cTop < car1Bottom && cBottom > car1Top && cRight > car1Left && cLeft < car1Right) {
                gameOver();
            }

            if (cTop < car2Bottom && cBottom > car2Top && cRight > car2Left && cLeft < car2Right) {
                gameOver();
            }
        }

        function gameOver() {
            isAlive = false;
            alert("धड़ाम! 💥 मुर्गा गाड़ी के नीचे आ गया और मर गया! सारे पैसे/पॉइंट्स खत्म ❌");
            resetGame();
        }

        // गेम की स्पीड और मूवमेंट रन करने के लिए
        setInterval(gameLoop, 30);
    </script>

</body>
</html>
