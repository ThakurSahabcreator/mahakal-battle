<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>महाकाल लेवल वाली कठिन पहेली - Admin Controlled</title>

<style>
body {
background-color: #121212;
color: #ffffff;
font-family: Arial, sans-serif;
text-align: center;
margin: 0;
padding: 20px;
user-select: none;
}
.container {
max-width: 400px;
margin: auto;
background: #1e1e1e;
padding: 20px;
border-radius: 12px;
border: 2px solid #ff7b00;
box-shadow: 0 4px 15px rgba(255, 123, 0, 0.3);
position: relative;
}
h2 { color: #ffab00; margin-top: 10px; cursor: pointer; }

.banner-img {
width: 100%;
max-height: 180px;
object-fit: cover;
border-radius: 8px;
border: 1px solid #ffab00;
margin-bottom: 10px;
}

.btn {
background: linear-gradient(to right, #ff5722, #ff9800);
color: white;
border: none;
padding: 12px;
width: 100%;
border-radius: 6px;
font-size: 16px;
font-weight: bold;
cursor: pointer;
margin-top: 10px;
}
.btn:hover { opacity: 0.9; }

.option-btn {
background: #2a2a2a;
color: #ffab00;
border: 1px solid #ffab00;
padding: 12px;
width: 100%;
border-radius: 6px;
font-size: 15px;
font-weight: bold;
cursor: pointer;
margin-top: 10px;
text-align: left;
padding-left: 15px;
transition: 0.2s;
}
.option-btn:hover { background: #3d3d3d; color: #fff; }

input {
width: 90%;
padding: 10px;
margin: 10px 0;
background: #2a2a2a;
border: 1px solid #444;
color: white;
border-radius: 5px;
text-align: center;
font-size: 15px;
}

.unique-wallet-card {
background: linear-gradient(135deg, #2c1a00, #4d2600);
padding: 15px;
border-radius: 10px;
margin-bottom: 15px;
border: 2px solid #ffcc00;
}
.unique-wallet-card h3 {
margin: 0;
color: #ffe680;
font-size: 20px;
}

.game-card-box {
background: #2a1a2e;
border: 2px solid #9c27b0;
border-radius: 10px;
padding: 15px;
margin: 15px 0;
}

.admin-panel {
background: #2a1a1a;
border: 2px solid #ff5252;
padding: 15px;
border-radius: 8px;
margin-top: 15px;
text-align: left;
display: none;
}
.hidden { display: none !important; }
.msg { color: #00e676; font-size: 15px; margin-top: 10px; font-weight: bold; }
.error { color: #ff5252; font-size: 15px; margin-top: 10px; font-weight: bold; }
</style>
</head>
<body>

<div class="container">

<h2 onclick="checkSecretAdminTap()">🔥 महाकाल दुर्लभ पहेली ज़ोन</h2>

<img src="1792858963757.png" alt="Mahakal Banner" class="banner-img">

<div class="unique-wallet-card">
<h3>💰 मेरा वॉलेट: ₹<span id="balance">100</span></h3>
<p style="font-size: 11px; color: #00e676; margin: 3px 0;" id="puzzle-user-phone"></p>
<div style="display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: #ffab00;">
<span>लगाई बाजी: ₹<span id="last-bet-view">0</span></span>
<span style="background: #ff5722; color: #fff; padding: 2px 8px; border-radius: 10px;" id="current-level-tag">Level 1 (सामान्य)</span>
</div>
</div>

<div id="puzzle-setup-box" class="game-card-box">
<h3 style="color: #ffab00; margin-top: 0;">🧠 दुर्लभ पहेली चैलेंज</h3>
<p style="font-size: 12px; color: #ccc;">न्यूनतम ₹5 या अधिक की बाजी लगाएं:</p>
<input type="number" id="puzzle-bet-input" value="10" min="5">
<button class="btn" onclick="startPuzzleGame()">🚀 चैलेंज शुरू करें</button>
</div>

<div id="puzzle-play-box" class="game-card-box hidden">
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
<span id="level-display" style="background: #9c27b0; color: #fff; padding: 3px 10px; border-radius: 15px; font-size: 12px; font-weight: bold;">Level 1</span>
<span style="background: #121212; padding: 3px 10px; border-radius: 15px; font-size: 13px; border: 1px solid #ffab00;">⏱️ <span id="puzzle-timer" style="color: #ffab00; font-weight: bold;">15</span>s</span>
</div>

<p id="puzzle-question" style="font-size: 15px; color: #ffab00; margin: 12px 0; text-align: left; line-height: 1.5; font-weight: bold;"></p>

<div id="options-container">
<button class="option-btn" onclick="checkAnswer('A')">A. <span id="textA"></span></button>
<button class="option-btn" onclick="checkAnswer('B')">B. <span id="textB"></span></button>
<button class="option-btn" onclick="checkAnswer('C')">C. <span id="textC"></span></button>
<button class="option-btn" onclick="checkAnswer('D')">D. <span id="textD"></span></button>
</div>

<div id="puzzle-result"></div>
<button class="btn" style="background: #555; margin-top: 15px;" onclick="backToSetup()">होम / सेटअप पर जाएं</button>
</div>

<div id="admin-panel-div" class="admin-panel">
<b style="color: #ff5252;">👑 पहेली एडमिन मास्टर कंट्रोल:</b>
<div style="background: #121212; padding: 8px; border-radius: 5px; margin-bottom: 10px; font-size: 12px; line-height: 1.5;">
📊 यूजर की लाइव बाजी: <span id="admin-live-bet" style="color: #00e676; font-weight: bold;">₹0</span><br>
📈 यूजर का करंट लेवल: <span id="admin-live-level" style="color: #00b0ff; font-weight: bold;">Level 1</span><br>
💰 यूजर का वॉलेट: <span id="admin-live-wallet" style="color: #ffab00; font-weight: bold;">₹100</span><br>
💡 <b style="color: #ffab00;">सही उत्तर (Secret):</b> <span id="admin-correct-ans" style="color: #00e676; font-weight: bold; font-size: 14px;">-</span>
</div>
<label style="font-size: 11px;">वॉलेट बैलेंस एडिट करें:</label>
<input type="number" id="admin-wallet-input" placeholder="नया बैलेंस दर्ज करें">
<button class="btn" style="padding: 6px; font-size: 13px; background: #00e676; color: #000;" onclick="adminUpdateWallet()">बैलेंस सेव करें</button>
<button class="btn" style="background: #555; padding: 5px; font-size: 12px; margin-top: 10px;" onclick="closeSecretAdmin()">एडमिन पैनल बंद करें</button>
</div>

<button class="btn" style="background: #334155; margin-top: 15px;" onclick="window.location.href='index.html'">🏠 Main Dashboard Par Wapas Jayein</button>

</div>

<script>
let currentBetAmount = 0;
let currentLevel = 1;
let puzzleTimerInterval = null;
let timeLeft = 15;
let correctButtonLetter = 'A';

let levelsData = {
1: [
{ q: "एक थाल मोतियों से भरा, सबके सिर पर औंधा धरा; चारों तरफ़ वह थाली फिरे, मोती उससे एक न गिरे?", options: { A: "आसमान और तारे", B: "कुएं की जगत", C: "सूरजमुखी का फूल", D: "ओस की बूंदें" }, answer: "A" },
{ q: "काला घोड़ा, सफेद सवारी, एक उतरे तो दूसरा सवारी?",options: { A: "तवा और रोटी", B: "जूता और पाँव", C: "रात और दिन", D: "कलम और स्याही" }, answer: "C" },
{ q: "ऐसी कौन सी चीज है जिसके पास पंख नहीं हैं फिर भी वह उड़ती है, और हाथ नहीं हैं फिर भी दरवाजा खोलती है?", options: { A: "समय और हवा", B: "धूप की किरण", C: "कागज की नाव", D: "सपनों की उड़ान" }, answer: "A" }
],
2: [
{ q: "हाथ में लोटा, मुँह में डोरी, सब कोई पूछे उसकी बोली?", options: { A: "कुएं की बाल्टी", B: "पनघट का घड़ा", C: "तुलसी का गमला", D: "मिट्टी का दीया" }, answer: "A" },
{ q: "तीन अक्षर का मेरा नाम, उल्टा सीधा एक समान; खाने के काम आऊँ, जरा बताओ मेरा नाम?", options: { A: "कनक", B: "नयन", C: "ममम", D: "रस रस" }, answer: "A" },
{ q: "न कभी खाया, न कभी पिया, फिर भी सबका पेट भरा?", options: { A: "किताब और शिक्षक", B: "आईना (शीशा)", C: "हवा का झोंका", D: "सूरज की रोशनी" }, answer: "B" }
],
3: [
{ q: "जिंदा हूँ पर साँस नहीं, शीतल हूँ पर प्यास नहीं; बिन परों के उड़ जाऊँ, बिना पाँव के दौड़ लगाऊँ?", options: { A: "बिजली का करंट", B: "बादल और बारिश", C: "नदी की धारा", D: "सपनों का साया" }, answer: "C" },
{ q: "ऐसी कौन सी चीज है जिसे जितना खींचेंगे, उतनी ही वह छोटी होती जाएगी?", options: { A: "सिगरेट का कश", B: "रबड़ का बैंड", C: "बीतता हुआ समय", D: "कुएं की रस्सी" }, answer: "A" },
{ q: "एक गुफा में तीस चोर, दोनों हाथ से मचाएं शोर?",options: { A: "दाँत और जीभ", B: "ढोल और मंजीरा", C: "हाथ की उंगलियाँ", D: "बारिश की बूँदें" }, answer: "A" }
]
};

function getCurrentUserPhone() {
    return localStorage.getItem('active_session_phone') || localStorage.getItem('logged_in_phone') || 'Guest_User';
}

function getWalletBalance() {
    let user = getCurrentUserPhone();
    if(!user || user === 'Guest_User') return 100;
    let bal = localStorage.getItem('user_bal_' + user);
    if(bal === null) {
        bal = '100';
        localStorage.setItem('user_bal_' + user, bal);
    }
    return parseFloat(bal);
}

function setWalletBalance(amount) {
    let user = getCurrentUserPhone();
    if(user && user !== 'Guest_User') {
        localStorage.setItem('user_bal_' + user, amount);
        updateBalanceDisplay();
    }
}

window.onload = function() {
    updateBalanceDisplay();
};

function updateBalanceDisplay() {
    let bal = getWalletBalance();
    document.getElementById('balance').innerText = bal;
    let adminLiveBal = document.getElementById('admin-live-wallet');
    if(adminLiveBal) adminLiveBal.innerText = "₹" + bal;
    
    document.getElementById('current-level-tag').innerText = "Level " + currentLevel;
    let adminLiveLvl = document.getElementById('admin-live-level');
    if(adminLiveLvl) adminLiveLvl.innerText = "Level " + currentLevel;
    
    let user = getCurrentUserPhone();
    let phoneDisp = document.getElementById('puzzle-user-phone');
    if(phoneDisp && user) {
        phoneDisp.innerText = "📱 Logged in: " + user;
    }
}

let tapCount = 0, lastTapTime = 0;
function checkSecretAdminTap() {
let currentTime = new Date().getTime();
if (currentTime - lastTapTime < 600) tapCount++; else tapCount = 1;
lastTapTime = currentTime;
if (tapCount === 3) {
tapCount = 0;
let pass = prompt("गुप्त एडमिन पासवर्ड दर्ज करें:");
if (pass === "78699") {
document.getElementById('admin-panel-div').style.display = "block";
alert("✅ पहेली एडमिन पैनल खुल गया है!");
} else if (pass !== null) { alert("❌ गलत पासवर्ड!"); }
}
}

function closeSecretAdmin() { document.getElementById('admin-panel-div').style.display = "none"; }

function adminUpdateWallet() {
let newAmt = parseFloat(document.getElementById('admin-wallet-input').value);
if (!isNaN(newAmt)) {
setWalletBalance(newAmt);
alert("✅ वॉलेट बैलेंस अपडेट हो गया: ₹" + newAmt);
}
}

function startPuzzleGame() {
let betAmt = parseInt(document.getElementById('puzzle-bet-input').value);
if (isNaN(betAmt) || betAmt < 5) { alert("❌ कृपया न्यूनतम ₹5 की बाजी लगाएं!"); return; }

let bal = getWalletBalance();
if (bal < betAmt) { alert("❌ आपके वॉलेट में पर्याप्त बैलेंस नहीं है!"); return; }

currentBetAmount = betAmt;
currentLevel = 1;
document.getElementById('last-bet-view').innerText = currentBetAmount;
document.getElementById('admin-live-bet').innerText = "₹" + currentBetAmount;

setWalletBalance(bal - betAmt);

document.getElementById('puzzle-setup-box').classList.add('hidden');
document.getElementById('puzzle-play-box').classList.remove('hidden');
loadPuzzleForCurrentLevel();
}

function loadPuzzleForCurrentLevel() {
if (puzzleTimerInterval) clearInterval(puzzleTimerInterval);

let list = levelsData[currentLevel] || levelsData[1];
let p = list[Math.floor(Math.random() * list.length)];

let correctOriginalText = p.options[p.answer];
let optionTexts = [p.options.A, p.options.B, p.options.C, p.options.D];
optionTexts.sort(() => Math.random() - 0.5);

document.getElementById('level-display').innerText = "Level " + currentLevel;
document.getElementById('puzzle-question').innerText = "❓ " + p.q;

document.getElementById('textA').innerText = optionTexts[0];
document.getElementById('textB').innerText = optionTexts[1];
document.getElementById('textC').innerText = optionTexts[2];
document.getElementById('textD').innerText = optionTexts[3];

if (optionTexts[0] === correctOriginalText) correctButtonLetter = 'A';
else if (optionTexts[1] === correctOriginalText) correctButtonLetter = 'B';
else if (optionTexts[2] === correctOriginalText) correctButtonLetter = 'C';
else if (optionTexts[3] === correctOriginalText) correctButtonLetter = 'D';

document.getElementById('admin-correct-ans').innerText = "Button " + correctButtonLetter + " (" + correctOriginalText + ")";

document.getElementById('puzzle-result').innerText = "";
enableOptions(true);
startTimer();
}

function startTimer() {
timeLeft = 15;
document.getElementById('puzzle-timer').innerText = timeLeft;

puzzleTimerInterval = setInterval(() => {
timeLeft--;
document.getElementById('puzzle-timer').innerText = timeLeft;

if (timeLeft <= 0) {
clearInterval(puzzleTimerInterval);
enableOptions(false);
let resultDiv = document.getElementById('puzzle-result');
resultDiv.className = "error";
resultDiv.innerText = `⏱️ समय समाप्त! Level ${currentLevel} पर हार गए।`;
currentLevel = 1;
updateBalanceDisplay();
setTimeout(backToSetup, 3000);
}
}, 1000);
}

function checkAnswer(selectedKey) {
if (puzzleTimerInterval) clearInterval(puzzleTimerInterval);
enableOptions(false);
let resultDiv = document.getElementById('puzzle-result');
let currentBal = getWalletBalance();

if (selectedKey === correctButtonLetter) {
let winAmt = currentBetAmount * 2;
setWalletBalance(currentBal + winAmt);

if (currentLevel < 3) {
currentLevel++;
updateBalanceDisplay();
resultDiv.className = "msg";
resultDiv.innerText = `🎉 सही जवाब! ₹${winAmt} जीते! अब Level ${currentLevel} पर जा रहे हैं...`;
setTimeout(loadPuzzleForCurrentLevel, 3500);
} else {
resultDiv.className = "msg";
resultDiv.innerText = `🏆 बधाई हो! आपने सभी 3 लेवल्स पार कर लिए और ₹${winAmt} जीत लिए!`;
currentLevel = 1;
updateBalanceDisplay();
setTimeout(backToSetup, 4000);
}
} else {
resultDiv.className = "error";
resultDiv.innerText = `❌ गलत जवाब! सही उत्तर Button ${correctButtonLetter} था। आप हार गए।`;
currentLevel = 1;
updateBalanceDisplay();
setTimeout(backToSetup, 3500);
}
}

function enableOptions(status) {
let btns = document.querySelectorAll('.option-btn');
btns.forEach(b => b.disabled = !status);
}

function backToSetup() {
if (puzzleTimerInterval) clearInterval(puzzleTimerInterval);
document.getElementById('puzzle-play-box').classList.add('hidden');
document.getElementById('puzzle-setup-box').classList.remove('hidden');
}
</script>
</body>
</html>
