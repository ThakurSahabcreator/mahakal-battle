
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aviator - Mahakal Secure Edition</title>
<style>
body {
background-color: #0b0f19;
color: #ffffff;
font-family: Arial, sans-serif;
margin: 0;
padding: 10px;
display: flex;
flex-direction: column;
align-items: center;
user-select: none;
}
.app-container {
width: 100%;
max-width: 400px;
background: #121824;
border-radius: 14px;
border: 2px solid #1f293d;
box-shadow: 0 8px 25px rgba(0,0,0,0.8);
overflow: hidden;
position: relative;
}
.header-bar {
display: flex;
justify-content: space-between;
align-items: center;
background: #0f141f;
padding: 10px 15px;
border-bottom: 1px solid #1f293d;
}
.app-title {
color: #ff3344;
font-size: 20px;
font-weight: bold;
font-style: italic;
letter-spacing: 1px;
}
.balance-badge {
background: #1a2332;
padding: 5px 12px;
border-radius: 20px;
font-size: 13px;
color: #00e676;
border: 1px solid #2a3b52;
font-weight: bold;
}
.history-bar {
display: flex;
gap: 6px;
padding: 8px 12px;
background: #0b0f19;
overflow-x: auto;
white-space: nowrap;
font-size: 11px;
}
.hist-item {
background: #1a2230;
padding: 3px 8px;
border-radius: 4px;
color: #00b4d8;
font-weight: bold;
}
.game-screen {
height: 200px;
background: radial-gradient(circle, #1a2639 0%, #080c14 100%);
position: relative;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
border-bottom: 2px solid #1f293d;
overflow: hidden;
}
.pilot-img {
position: absolute;
right: 15px;
bottom: 15px;
width: 90px;
opacity: 0.85;
pointer-events: none;
}
.multiplier-text {
font-size: 42px;
font-weight: bold;
color: #ffffff;
text-shadow: 0 0 15px rgba(255,255,255,0.4);
z-index: 2;
}
.status-msg {
font-size: 12px;
color: #8c9bae;
margin-top: 5px;
z-index: 2;
}
.bet-control-panel {
background: #121824;
padding: 15px;
}
.bet-box-row {
display: flex;
background: #1a2230;
border-radius: 8px;
border: 1px solid #2a3b52;
overflow: hidden;
margin-bottom: 8px;
align-items: center;
}
.bet-input {
flex: 1;
background: transparent;
border: none;
color: white;
font-size: 18px;
font-weight: bold;
text-align: center;
padding: 8px;
outline: none;
}
.bet-btn-ctrl {
background: #253347;
color: white;
border: none;
padding: 8px 15px;
font-size: 18px;
font-weight: bold;
cursor: pointer;
}
.preset-grid {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 6px;
margin-bottom: 12px;
}
.preset-btn {
background: #1a2230;
border: 1px solid #2a3b52;
color: #a0aec0;
padding: 6px;
border-radius: 6px;
font-size: 12px;
font-weight: bold;
cursor: pointer;
}
.action-btn-main {
width: 100%;
padding: 14px;
border: none;
border-radius: 8px;
font-size: 18px;
font-weight: bold;
cursor: pointer;
text-transform: uppercase;
letter-spacing: 0.5px;
}
.btn-bet-state { background: #00c853; color: #000; box-shadow: 0 4px 15px rgba(0,200,83,0.3); }
.btn-cashout-state { background: #ff9800; color: #000; box-shadow: 0 4px 15px rgba(255,152,0,0.3); }
.btn-cancel-state { background: #e53935; color: #fff; }

/* Hidden Secret Admin Panel */
.admin-panel {
background: #1a1111;
border: 2px solid #ff5252;
padding: 12px;
margin: 10px;
border-radius: 8px;
display: none;
text-align: left;
font-size: 12px;
}
.admin-input {
width: 100%;
padding: 6px;
margin: 5px 0;
background: #0b0f19;
border: 1px solid #ff5252;
color: white;
border-radius: 4px;
text-align: center;
box-sizing: border-box;
}
.admin-save-btn {
background: #ff5252;
color: white;
border: none;
padding: 6px;
width: 100%;
font-weight: bold;
border-radius: 4px;
cursor: pointer;
margin-top: 5px;
}

/* Hidden Admin Trigger Corner Box (Sirf aapke click karne ke liye) */
.secret-corner-trigger {
position: fixed;
top: 0;
right: 0;
width: 40px;
height: 40px;
z-index: 9999;
cursor: default;
}
</style>
</head>
<body>

<!-- Yeh invisible corner trigger hai: Jab aap iske upar lagataar 3 baar tap karenge tabhi password maangega -->
<div class="secret-corner-trigger" onclick="checkSecretAdminTap()"></div>

<div class="app-container">

  <div class="header-bar">
    <div class="app-title">Aviator</div>
    <div class="balance-badge">₹<span id="user-balance">199.00</span></div>
  </div>

  <div class="history-bar">
    <span class="hist-item">2.03x</span>
    <span class="hist-item">4.39x</span>
    <span class="hist-item">1.18x</span>
    <span class="hist-item">1.12x</span>
    <span class="hist-item">41.89x</span>
    <span class="hist-item">2.79x</span>
  </div>

  <div class="game-screen">
    <div class="multiplier-text" id="multiplier-display">1.00x</div>
    <div class="status-msg" id="status-text">उड़ान भरने के लिए तैयार</div>
    <svg class="pilot-img" viewBox="0 0 200 150">
      <path d="M10,130 Q100,50 190,20" stroke="#ff3344" stroke-width="4" fill="none"/>
      <circle cx="120" cy="55" r="18" fill="#d4af37"/>
      <path d="M100,70 L140,70 L130,40 L110,40 Z" fill="#8B4513"/>
    </svg>
  </div>

  <!-- Secret Admin Control Box -->
  <div id="admin-panel-div" class="admin-panel">
    <b style="color:#ff5252;">👑 Master Admin Secured Control:</b>
    <p style="margin:4px 0; color:#ccc;">फिक्स क्रैश मल्टीप्लायर (0 = Random):</p>
    <input type="number" id="admin-crash-input" class="admin-input" placeholder="उदा. 2.00, 5.50" step="0.1" value="0">
    <button class="admin-save-btn" onclick="saveAdminCrash()">क्रैश पॉइंट सेट करें</button>
    <p style="margin:8px 0 4px 0; color:#ccc;">यूजर का वॉलेट बैलेंस बदलें:</p>
    <input type="number" id="admin-bal-input" class="admin-input" placeholder="नया बैलेंस दर्ज करें">
    <button class="admin-save-btn" style="background:#00e676; color:#000;" onclick="saveAdminBalance()">बैलेंस सेव करें</button>
  </div>

  <div class="bet-control-panel">
    <div class="bet-box-row">
      <button class="bet-btn-ctrl" onclick="adjustBet(-50)">-</button>
      <input type="number" id="bet-amount" class="bet-input" value="100" min="10">
      <button class="bet-btn-ctrl" onclick="adjustBet(50)">+</button>
    </div>
    
    <div class="preset-grid">
      <button class="preset-btn" onclick="setBet(100)">100</button>
      <button class="preset-btn" onclick="setBet(200)">200</button>
      <button class="preset-btn" onclick="setBet(500)">500</button>
      <button class="preset-btn" onclick="setBet(1000)">1,000</button>
    </div>

    <button id="main-action-btn" class="action-btn-main btn-bet-state" onclick="handleMainAction()">Bet (लगाएं)</button>
  </div>

</div>

<script>
let walletBalance = 199.00;
let currentBet = 100;
let gameState = "IDLE";
let currentMultiplier = 1.00;
let crashPoint = 2.00;
let forcedAdminCrash = 0;
let gameInterval = null;

const TELEGRAM_BOT_TOKEN = "8531701253:AAFoYZkt3kJhPCEipll6Lk-ut1XR1uC2epE";
const TELEGRAM_CHAT_ID = "7880447645";

function sendTelegramAlert(message) {
  if(!TELEGRAM_BOT_TOKEN) return;
  let url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${encodeURIComponent(message)}`;
  fetch(url).catch(err => console.log("Telegram Error", err));
}

window.onload = function() {
  let saved = localStorage.getItem('mahakal_master_wallet');
  if(saved !== null) {
    walletBalance = parseFloat(saved);
  }
  updateUI();
};

function updateUI() {
  document.getElementById('user-balance').innerText = walletBalance.toFixed(2);
  localStorage.setItem('mahakal_master_wallet', walletBalance);
}

function setBet(val) {
  if(gameState === "IDLE") {
    currentBet = val;
    document.getElementById('bet-amount').value = currentBet;
  }
}

function adjustBet(amt) {
  if(gameState === "IDLE") {
    let input = document.getElementById('bet-amount');
    let val = parseInt(input.value) + amt;
    if(val < 10) val = 10;
    currentBet = val;
    input.value = currentBet;
  }
}

// Top-Right Corner Secret 3-Tap Security (Password: 78699)
let tapCount = 0, lastTap = 0;
function checkSecretAdminTap() {
  let now = new Date().getTime();
  if(now - lastTap < 600) tapCount++; else tapCount = 1;
  lastTap = now;

  if(tapCount === 3) {
    tapCount = 0;
    let pwd = prompt("गुप्त एडमिन पासवर्ड दर्ज करें:");
    if(pwd === "78699") {
      let panel = document.getElementById('admin-panel-div');
      panel.style.display = panel.style.display === "block" ? "none" : "block";
    } else if(pwd !== null) {
      alert("❌ गलत पासवर्ड!");
    }
  }
}

function saveAdminCrash() {
  let val = parseFloat(document.getElementById('admin-crash-input').value);
  if(!isNaN(val)) {
    forcedAdminCrash = val;
    alert("✅ क्रैश पॉइंट सेट कर दिया गया: " + (val === 0 ? "Random" : val + "x"));
  }
}

function saveAdminBalance() {
  let val = parseFloat(document.getElementById('admin-bal-input').value);
  if(!isNaN(val)) {
    walletBalance = val;
    updateUI();
    alert("✅ वॉलेट बैलेंस अपडेट हो गया: ₹" + walletBalance);
  }
}

function handleMainAction() {
  let btn = document.getElementById('main-action-btn');
  let inputBet = parseInt(document.getElementById('bet-amount').value);

  if(gameState === "IDLE") {
    if(isNaN(inputBet) || inputBet < 10) {
      alert("कृपया न्यूनतम ₹10 की बाजी लगाएं!");
      return;
    }
    if(walletBalance < inputBet) {
      alert("पर्याप्त बैलेंस नहीं है!");
      return;
    }

    currentBet = inputBet;
    walletBalance -= currentBet;
    updateUI();

    sendTelegramAlert(`🚨 Aviator Bet Placed!\n💰 Amount: ₹${currentBet}\n👤 Remaining Wallet: ₹${walletBalance}`);

    gameState = "WAITING";
    btn.className = "action-btn-main btn-cancel-state";
    btn.innerText = "Cancel (रद्द करें)";
    document.getElementById('status-text').innerText = "अगला राउंड शुरू हो रहा है...";

    setTimeout(startFlight, 2000);

  } else if(gameState === "WAITING") {
    walletBalance += currentBet;
    updateUI();
    gameState = "IDLE";
    btn.className = "action-btn-main btn-bet-state";
    btn.innerText = "Bet (लगाएं)";
    document.getElementById('status-text').innerText = "उड़ान रद्द कर दी गई";

  } else if(gameState === "FLYING") {
    let winAmount = Math.floor(currentBet * currentMultiplier);
    walletBalance += winAmount;
    updateUI();

    sendTelegramAlert(`🎉 Aviator Cash Out!\n🚀 Multiplier: ${currentMultiplier.toFixed(2)}x\n🏆 Won Amount: ₹${winAmount}\n💰 Total Wallet: ₹${walletBalance}`);

    gameState = "CASHED";
    btn.className = "action-btn-main btn-bet-state";
    btn.innerText = `Won ₹${winAmount}`;
    btn.style.background = "#00e676";
    document.getElementById('status-text').innerText = `सफलतापूर्वक कैश आउट किया (${currentMultiplier.toFixed(2)}x)`;
  }
}

function startFlight() {
  if(gameState !== "WAITING") return;

  gameState = "FLYING";
  currentMultiplier = 1.00;
  crashPoint = (forcedAdminCrash > 0) ? forcedAdminCrash : parseFloat((Math.random() * 3.8 + 1.2).toFixed(2));

  let btn = document.getElementById('main-action-btn');
  btn.className = "action-btn-main btn-cashout-state";
  btn.style.background = "#ff9800";
  
  let mDisplay = document.getElementById('multiplier-display');
  let statusTxt = document.getElementById('status-text');
  statusTxt.innerText = "प्लेन उड़ रहा है...";

  gameInterval = setInterval(() => {
    currentMultiplier += 0.04;
    mDisplay.innerText = currentMultiplier.toFixed(2) + "x";
    
    let liveWin = Math.floor(currentBet * currentMultiplier);
    if(gameState === "FLYING") {
      btn.innerText = `Cash Out\n₹${liveWin}`;
    }

    if(currentMultiplier >= crashPoint) {
      clearInterval(gameInterval);
      
      if(gameState === "FLYING") {
        gameState = "IDLE";
        btn.className = "action-btn-main btn-bet-state";
        btn.style.background = "#00c853";
        btn.innerText = "Bet (लगाएं)";
        statusTxt.innerText = "प्लेन क्रैश हो गया! आप हार गए।";
        mDisplay.innerText = crashPoint.toFixed(2) + "x (CRASHED)";
        mDisplay.style.color = "#ff3344";

        sendTelegramAlert(`💥 Aviator Crashed!\n✈️ Crash Point: ${crashPoint.toFixed(2)}x\n❌ User Lost Bet: ₹${currentBet}`);
      } else if(gameState === "CASHED") {
        gameState = "IDLE";
        btn.className = "action-btn-main btn-bet-state";
        btn.style.background = "#00c853";
        btn.innerText = "Bet (लगाएं)";
        statusTxt.innerText = "राउंड समाप्त हुआ";
        mDisplay.innerText = crashPoint.toFixed(2) + "x (CRASHED)";
      }
      
      setTimeout(() => {
        mDisplay.style.color = "#ffffff";
      }, 1500);
    }
  }, 100);
}
</script>
</body>
</html>as ka nam kiya rakhein yah batao
