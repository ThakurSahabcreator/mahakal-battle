<!-- Dusre panel ke liye bhi wahi - bas 1 ki jagah 2 likh de -->
<div style="background:#000;border:1px solid #d4af37;border-radius:10px;padding:10px;text-align:center;margin-bottom:8px">
  <div style="font-size:11px;color:#aaa">LAGAYA HUA BET</div>
  <div style="font-size:18px;font-weight:800;color:#fff"><span id="myBet2">0</span> Points</div>
  <div style="font-size:11px;color:#aaa;margin-top:6px">ABHI JEET - BADHTA HUA 🔥</div>
  <div style="font-size:26px;font-weight:900;color:#22c55e" id="myWin2">0 Points</div>
  <div style="font-size:11px;color:#ffd700" id="myMult2">1.00x pe ho</div>
</div>
<button class="play" id="btn2" onclick="play(2)">PLAY</button>

<script>
function play(p){
  if(practice){ alert('Practice me ho bhai, paisa nahi lagega'); return; }
  if(active[p]){ cashout(p); return; }
  if(bal<amt[p]){ alert('Points khatam!'); return; }
  bal-=amt[p];
  document.getElementById('bal').innerText=bal;
  active[p]={amt:amt[p]};
  // Niche coin dikhao - Bet kitna lagaya
  document.getElementById('myBet'+p).innerText=amt[p];
  document.getElementById('myWin'+p).innerText=amt[p]+' Points';
  let b=document.getElementById('btn'+p);
  b.innerText='CASHOUT'; b.classList.add('cash');
}

// Apne timer me - jahan mult badh raha hai - wahan ye 2 line add kar de
// Yehi line coin ko badhta hua dikhayegi
// [1,2].forEach(p=>{
//   if(active[p]){
//     let win = Math.floor(active[p].amt * mult);
//     document.getElementById('myWin'+p).innerText = win + ' Points';
//     document.getElementById('myMult'+p).innerText = mult.toFixed(2)+'x pe ho';
//   }
// });

function cashout(p){
  if(!active[p]||!playing) return;
  let win=Math.floor(active[p].amt*mult);
  bal+=win;
  document.getElementById('bal').innerText=bal;
  // Cashout ke baad niche 0 kar do
  document.getElementById('myWin'+p).innerText='0 Points';
  document.getElementById('myBet'+p).innerText='0';
  document.getElementById('myMult'+p).innerText='Cashout ho gaya ✅';
  active[p]=null;
  let b=document.getElementById('btn'+p);
  b.innerText='PLAY'; b.classList.remove('cash');
}
</script>
