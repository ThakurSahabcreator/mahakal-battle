<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thakur Sahab - Aviator Master Game</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body {
    background-color: #0b0f19;
    color: #ffffff;
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding: 10px;
    user-select: none;
}
.container {
    max-width: 420px;
    margin: auto;
    background: #131a26;
    padding: 15px;
    border-radius: 12px;
    border: 2px solid #ff7b00;
    box-shadow: 0 4px 20px rgba(255, 123, 0, 0.3);
}
.header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}
.back-btn {
    background: #ef4444;
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
}
.wallet-display {
    background: #00c853;
    color: #000;
    padding: 6px 12px;
    border-radius: 5px;
    font-weight: bold;
    font-size: 14px;
}
.deposit-btn-top {
    background: #00897b;
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
}
.game-screen {
    background: radial-gradient(circle, #1a2332 0%, #0b0f19 100%);
    border: 2px solid #334155;
    border-radius: 10px;
    height: 200px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-bottom: 15px;
}
.multiplier-text {
    font-size: 38px;
    font-weight: 800;
    color: #ffab00;
    text-shadow: 0 0 10px rgba(255, 171, 0, 0.5);
}
.plane-status {
    font-size: 13px;
    color: #00e676;
    margin-top: 5px;
    font-weight: bold;
}
.history-strip {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 5px 0;
    margin-bottom: 10px;
    scrollbar-width: none;
}
.history-badge {
    background: #1e293b;
    border: 1px solid #ef4444;
    color: #ff5252;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: bold;
    white-space: nowrap;
}
.bet-card {
    background: #1a2332;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 10px;
    text-align: left;
}
.bet-input {
    width: 100%;
    padding: 8px;
    background: #0b0f19;
    border: 1px solid #444;
    color: white;
    border-radius: 5px;
    text-align: center;
    font-size: 15px;
    margin: 5px 0;
    box-sizing: border-box;
}
.quick-chips {
    display: flex;
    gap: 5px;
    margin-bottom: 8px;
}
.chip-btn {
    flex: 1;
    background: #222d3e;
    border: 1px solid #555;
    color: white;
    padding: 5px;
    font-size: 11px;
    border-radius: 4px;
    cursor: pointer;
}
.action-btn {
    background: #00c853;
    color: #000;
    border: none;
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 5px;
}
.live-feed-box {
    background: #141a23;
    border: 1px solid #2a364f;
    border-radius: 6px;
    padding: 8px;
    font-size: 11px;
    color: #00ff66;
    text-align: center;
    margin-top: 10px;
}
</style>
</head>
<body>

<div class="container">
    <!-- Top Nav -->
    <div class="header-row">
        <button class="back-btn" onclick="history.back()">Back</button>
        <span style="font-size: 18px; font-weight: bold; color: #ffab00;">Aviator</span>
        <div style="display: flex; gap: 5px;">
            <div class="wallet-display">₹<span id="aviator-bal">19</span></div>
        </div>
    </div>

    <!-- Multiplier History Strip -->
    <div class="history-strip" id="multiplier-history">
        <div class="history-badge">2.00x</div>
        <div class="history-badge">1.40x</div>
        <div class="history-badge">5.20x</div>
        <div class="history-badge">1.96x</div>
    </div>

    <!-- Game Animation Screen -->
    <div class="game-screen">
        <div class="multiplier-text" id="live-multiplier">1.00x</div>
        <div class="plane-status" id="plane-status-msg">🚀 प्लेन उड़ रहा है...</div>
    </div>

    <!-- Bet Control Box 1 -->
    <div class="bet-card">
        <div style="font-size: 12px; color: #aaa;">बेट राशि (रुपए):</div>
        <input type="number" id="bet-amt-1" class="bet-input" value="100">
        <div class="quick-chips">
            <button class="chip-btn" onclick="setBet(1, 100)">100</button>
            <button class="chip-btn" onclick="setBet(1, 200)">200</button>
            <button class="chip-btn" onclick="setBet(1, 500)">500</button>
            <button class="chip-btn" onclick="setBet(1, 1000)">1,000</button>
        </div>
        <button class="action-btn" id="bet-btn-1" onclick="toggleBet(1)">BET (लगाएं)</button>
    </div>

    <!-- Live Online Players Feed -->
    <div class="live-feed-box">
        🟢 Live Online Players: <span id="active-players">678</span> Active Now<br>
        🏆 <span id="winner-announcement">राहुल (Kanpur) ने अभी Aviator से ₹500 जीते!</span>
    </div>
</div>

<script>
// LocalStorage se active user ka balance fetch karna
function getActiveUser() {
    return localStorage.getItem('active_user');
}

function getAviatorBalance() {
    let user = getActiveUser();
    if(!user) return 19;
    let bal = localStorage.getItem('balance_' + user);
    return bal !== null ? parseFloat(bal) : 19;
}

function setAviatorBalance(amount) {
    let user = getActiveUser();
    if(user) {
        localStorage.setItem('balance_' + user, amount);
        document.getElementById('aviator-bal').innerText = amount;
    }
}

function updateAviatorDisplay() {
    let bal = getAviatorBalance();
    document.getElementById('aviator-bal').innerText = bal;
}

window.onload = function() {
    updateAviatorDisplay();
    startAviatorGameLoop();
};

function setBet(boxId, amount) {
    document.getElementById('bet-amt-1').value = amount;
}

let isBetPlaced = false;
let currentMultiplier = 1.00;
let gameInterval = null;

function toggleBet(boxId) {
    let betInput = document.getElementById('bet-amt-1');
    let betBtn = document.getElementById('bet-btn-1');
    let amt = parseFloat(betInput.value);
    let bal = getAviatorBalance();

    if(!isBetPlaced) {
        if(amt > bal) {
            alert("वॉलेट में पर्याप्त बैलेंस नहीं है!");
            return;
        }
        // Deduct bet amount
        setAviatorBalance(bal - amt);
        isBetPlaced = true;
        betBtn.innerText = "CASH OUT (निकाले)";
        betBtn.style.background = "#ffab00";
        betBtn.style.color = "#000";
    } else {
        // Cash out win
        let winAmt = Math.round(amt * currentMultiplier);
        let newBal = getAviatorBalance() + winAmt;
        setAviatorBalance(newBal);
        alert(`बधाई हो! आपने ₹${winAmt} जीत लिए हैं।`);
        isBetPlaced = false;
        betBtn.innerText = "BET (लगाएं)";
        betBtn.style.background = "#00c853";
        betBtn.style.color = "#000";
    }
}

// Smooth Aviator Multiplier Game Loop
function startAviatorGameLoop() {
    let multText = document.getElementById('live-multiplier');
    let statusMsg = document.getElementById('plane-status-msg');
    
    currentMultiplier = 1.00;
    let crashPoint = (Math.random() * 5 + 1.2).toFixed(2); // Random crash between 1.20x to 6.20x

    gameInterval = setInterval(() => {
        currentMultiplier += 0.03;
        multText.innerText = currentMultiplier.toFixed(2) + "x";

        if(currentMultiplier >= parseFloat(crashPoint)) {
            clearInterval(gameInterval);
            statusMsg.innerHTML = `<span style="color:#ff5252;">💥 प्लेन क्रैश हो गया! (${crashPoint}x)</span>`;
            
            // Auto-reset bet if user didn't cash out
            if(isBetPlaced) {
                isBetPlaced = false;
                let betBtn = document.getElementById('bet-btn-1');
                betBtn.innerText = "BET (लगाएं)";
                betBtn.style.background = "#00c853";
                betBtn.style.color = "#000";
            }

            // Restart next round after 3 seconds
            setTimeout(() => {
                statusMsg.innerHTML = "🚀 नया राउंड शुरू हो रहा है...";
                setTimeout(startAviatorGameLoop, 1500);
            }, 2000);
        }
    }, 100);
}
</script>

</body>
</html>
