<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahakal Aviator - महाकाल प्लेन क्रैश गेम</title>
<style>
body {
  background-color: #0b0f19;
  color: #ffffff;
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 10px;
  user-select: none;
}
.container {
  max-width: 420px;
  margin: auto;
  background: #131a26;
  padding: 15px;
  border-radius: 12px;
  border: 2px solid #00b4d8;
  box-shadow: 0 4px 20px rgba(0, 180, 216, 0.3);
  position: relative;
}
h2 { color: #00b4d8; margin-top: 5px; font-size: 18px; cursor: pointer; }
.top-bar {
  display: flex;
  justify-content: space-between;
  background: #1a2332;
  padding: 8px 12px;
  border-radius: 6px;
  margin-bottom: 10px;
  font-size: 14px;
  border: 1px solid #334155;
}
.game-screen {
  height: 180px;
  background: radial-gradient(circle, #1a2332 0%, #05070c 100%);
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 2px solid #00b4d8;
  margin-bottom: 12px;
  position: relative;
}
.multiplier {
  font-size: 36px;
  font-weight: bold;
  color: #00e676;
}
.status-text {
  font-size: 13px;
  color: #ffab00;
  margin-top: 5px;
}
.card-box {
  background: #1a2332;
  border: 1px solid #334155;
  border-radius: 8px;
  padding: 12px;
  margin: 10px 0;
  text-align: left;
}
input, select {
  width: 90%;
  padding: 10px;
  margin: 6px 0;
  background: #0b0f19;
  border: 1px solid #444;
  color: white;
  border-radius: 5px;
  text-align: center;
  font-size: 14px;
}
.btn {
  background: linear-gradient(to right, #0077b6, #00b4d8);
  color: white;
  border: none;
  padding: 12px;
  width: 100%;
  border-radius: 6px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 8px;
}
.btn:hover { opacity: 0.9; }

.admin-panel {
  background: #2a1a1a;
  border: 2px solid #ff5252;
  padding: 12px;
  border-radius: 8px;
  margin-top: 15px;
  text-align: left;
  display: none;
  font-size: 12px;
}
.msg { color: #00e676; font-size: 13px; margin-top: 6px; font-weight: bold; text-align: center; }
.error { color: #ff5252; font-size: 13px; margin-top: 6px; font-weight: bold; text-align: center; }
</style>
</head>
<body>

<div class="container">
  <!-- Title par 3 baar click karne se password (78699) maangega aur Admin Panel khulega -->
  <h2 onclick="checkAviatorAdminTap()">✈️ महाकाल Aviator प्लेन गेम</h2>
  
  <div class="top-bar">
    <span>💰 वॉलेट: ₹<span id="aviator-wallet">10</span></span>
    <button onclick="window.location.href='index.html'" style="background: #ff7b00; border: none; color: white; padding: 4px 10px; border-radius: 4px; font-weight: bold; cursor: pointer;">डैशबोर्ड जाएं</button>
  </div>

  <!-- Game Screen -->
  <div class="game-screen">
    <div class="multiplier" id="av-multiplier">1.00x</div>
    <div class="status-text" id="av-status">अगला राउंड शुरू होने वाला है...</div>
  </div>

  <!-- Betting & Auto Cashout Control Panel -->
  <div class="card-box">
    <label style="font-size: 12px; color: #ffab00;">बेट राशि (Bet Amount):</label>
    <input type="number" id="av-bet-amt" value="50" min="10">

    <label style="font-size: 12px; color: #00e676; margin-top: 5px; display: block;">ऑटो कैशआउट टारगेट (Auto Cashout Multiplier):</label>
    <input type="number" id="av-auto-cash" value="2.00" step="0.1" min="1.1" placeholder="उदा. 2.00">

    <button class="btn" id="av-action-btn" onclick="toggleAviatorBet()">बेट लगाएं (Place Bet)</button>
    <div id="av-msg"></div>
  </div>

  <!---------------- AVIATOR SECRET ADMIN PANEL (Password: 78699) ---------------->
  <div id="aviator-admin-div" class="admin-panel">
    <b style="color: #ff5252;">👑 Aviator मास्टर कंट्रोल पैनल:</b>
    <hr style="border-color: #444; margin: 5px 0;">
    <p style="margin-top: 8px;">🎯 <b>अगले प्लेन का क्रैश पॉइंट सेट करें (Fixed Multiplier):</b></p>
    <input type="number" id="adm-set-crash" placeholder="उदा. 2.50" step="0.1" min="1.1">
    <button class="btn" style="padding: 6px; background: #00e676; color: #000; margin-top: 5px;" onclick="saveAdminCrash()">क्रैश पॉइंट लॉक करें</button>
    <div id="adm-crash-msg" style="color: #00e676; font-size: 11px; margin-top: 4px;"></div>

    <button class="btn" style="background: #555; padding: 5px; margin-top: 10px;" onclick="closeAviatorAdmin()">एडमिन बंद करें</button>
  </div>

  <button class="btn" style="background: #555; margin-top: 10px;" onclick="window.location.href='index.html'">मुख्य होमपेज पर वापस जाएं</button>
</div>

<script>
let walletBal = 10;
let gameInterval = null;
let currentMult = 1.00;
let crashAt = 2.00;
let forcedCrash = null; // Admin forced crash
let isPlaying = false;
let hasCasheOut = false;
let betAmount = 50;
let autoTarget = 2.00;

window.onload = function() {
  let saved = localStorage.getItem('mahakal_master_wallet');
  if(saved !== null) walletBal = parseFloat(saved);
  document.getElementById('aviator-wallet').innerText = walletBal;
  startAviatorRound();
};

function updateWalletUI() {
  document.getElementById('aviator-wallet').innerText = walletBal;
  localStorage.setItem('mahakal_master_wallet', walletBal);
}

function startAviatorRound() {
  isPlaying = false;
  hasCasheOut = false;
  currentMult = 1.00;
  document.getElementById('av-multiplier').innerText = "1.00x";
  document.getElementById('av-multiplier').style.color = "#00e676";
  document.getElementById('av-status').innerText = "अगला राउंड 3 सेकंड में शुरू होगा...";
  document.getElementById('av-action-btn').innerText = "बेट लगाएं (Place Bet)";
  document.getElementById('av-action-btn').style.background = "linear-gradient(to right, #0077b6, #00b4d8)";

  setTimeout(runFlight, 3000);
}

function runFlight() {
  // Agar admin ne fix crash set kiya hai toh wahi use hoga, warna random
  if(forcedCrash !== null) {
    crashAt = forcedCrash;
    forcedCrash = null; // Reset after one use
  } else {
    crashAt = parseFloat((Math.random() * 3.5 + 1.2).toFixed(2));
  }

  document.getElementById('av-status').innerText = "✈️ प्लेन उड़ रहा है...";
  
  gameInterval = setInterval(() => {
    currentMult += 0.04;
    let mStr = currentMult.toFixed(2) + "x";
    document.getElementById('av-multiplier').innerText = mStr;

    // Check Auto Cashout if user placed bet
    if(isPlaying && !hasCasheOut) {
      if(currentMult >= autoTarget) {
        cashOutGame(true);
      }
    }

    // Check Crash
    if(currentMult >= crashAt) {
      clearInterval(gameInterval);
      document.getElementById('av-multiplier').innerText = "💥 " + crashAt.toFixed(2) + "x";
      document.getElementById('av-multiplier').style.color = "#ff5252";
      document.getElementById('av-status').innerText = "क्रैश हो गया!";
      
      if(isPlaying && !hasCasheOut) {
        document.getElementById('av-msg').className = "error";
        document.getElementById('av-msg').innerText = `❌ आप हार गए! ₹${betAmount} डूब गए।`;
        isPlaying = false;
      }

      setTimeout(startAviatorRound, 4000);
    }
  }, 100);
}

function toggleAviatorBet() {
  betAmount = parseInt(document.getElementById('av-bet-amt').value);
  autoTarget = parseFloat(document.getElementById('av-auto-cash').value);
  let msg = document.getElementById('av-msg');

  if(isNaN(betAmount) || betAmount < 10) {
    msg.className = "error"; msg.innerText = "कम से कम ₹10 की बेट लगाएं!"; return;
  }
  if(walletBal < betAmount) {
    msg.className = "error"; msg.innerText = "वॉलेट में पर्याप्त बैलेंस नहीं है!"; return;
  }

  if(!isPlaying) {
    walletBal -= betAmount;
    updateWalletUI();
    isPlaying = true;
    hasCasheOut = false;
    msg.className = "msg"; msg.innerText = `✅ बेट लग गई! (ऑटो टारगेट: ${autoTarget}x)`;
    document.getElementById('av-action-btn').innerText = "कैश आउट (Cash Out)";
    document.getElementById('av-action-btn').style.background = "linear-gradient(to right, #d32f2f, #f44336)";
  } else {
    cashOutGame(false);
  }
}

function cashOutGame(isAuto) {
  if(!isPlaying || hasCasheOut) return;
  hasCasheOut = true;
  isPlaying = false;

  let winAmt = Math.floor(betAmount * currentMult);
  walletBal += winAmt;
  updateWalletUI();

  let msg = document.getElementById('av-msg');
  msg.className = "msg";
  msg.innerText = isAuto ? `🎉 ऑटो कैशआउट सफल! ${currentMult.toFixed(2)}x पर ₹${winAmt} जीत गए!` : `🎉 मैनुअल कैशआउट! ${currentMult.toFixed(2)}x पर ₹${winAmt} जीत गए!`;

  document.getElementById('av-action-btn').innerText = "अगली बेट लगाएं";
  document.getElementById('av-action-btn').style.background = "linear-gradient(to right, #0077b6, #00b4d8)";
}

// Secret Admin Tap Trigger (3 clicks on title, password: 78699)
let tapC = 0, lastT = 0;
function checkAviatorAdminTap() {
  let now = new Date().getTime();
  if(now - lastT < 600) tapC++; else tapC = 1;
  lastT = now;

  if(tapC === 3) {
    tapC = 0;
    let p = prompt("गुप्त एडमिन पासवर्ड दर्ज करें:");
    if(p === "78699") {[span_1](start_span)[span_1](end_span)
      document.getElementById('aviator-admin-div').style.display = "block";
      alert("✅ Aviator मास्टर एडमिन पैनल खुल गया है!");
    } else if(p !== null) {
      alert("❌ गलत पासवर्ड!");
    }
  }
}

function closeAviatorAdmin() {
  document.getElementById('aviator-admin-div').style.display = "none";
}

function saveAdminCrash() {
  let val = parseFloat(document.getElementById('adm-set-crash').value);
  if(!isNaN(val) && val >= 1.05) {
    forcedCrash = val;
    document.getElementById('adm-crash-msg').innerText = `✅ अगला प्लेन ठीक ${val}x पर क्रैश होगा!`;
  } else {
    alert("कृपया सही वैल्यू (उदा. 2.00) दर्ज करें!");
  }
}
</script>
</body>
</html>
