<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aviator - Final Strict Betting Game</title>
<style>
body {
  background-color: #0b0f19;
  color: #ffffff;
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 5px;
  user-select: none;
  -webkit-text-size-adjust: 100%;
}
.container {
  width: 100%;
  max-width: 400px;
  margin: auto;
  background: #121824;
  padding: 10px;
  border-radius: 12px;
  border: 2px solid #ff4757;
  position: relative;
  box-sizing: border-box;
}
.header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
h2 { color: #ff4757; margin: 0; font-size: 20px; font-style: italic; cursor: pointer; }
.wallet-badge {
  background: #2ed573; color: #000; padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 13px;
}
.dep-btn {
  background: #2ed573; color: #000; border: none; padding: 5px 10px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 12px;
}
.history-bar {
  display: flex; gap: 5px; overflow-x: auto; margin-bottom: 8px; padding-bottom: 4px; scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.history-bar::-webkit-scrollbar { display: none; }
.hist-pill {
  padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; white-space: nowrap; flex-shrink: 0;
}
.pill-blue { background: #1a2332; border: 1px solid #00b4d8; color: #00b4d8; }
.pill-red { background: #3a1111; border: 1px solid #ff5252; color: #ff5252; }

.game-box {
  width: 100%;
  height: 200px; 
  background: radial-gradient(circle at bottom left, #2b0c12 0%, #080b12 70%);
  border-radius: 8px; 
  display: flex; 
  flex-direction: column; 
  align-items: center; 
  justify-content: center;
  border: 1px solid #ff4757; 
  margin-bottom: 8px; 
  position: relative; 
  overflow: hidden;
  box-sizing: border-box;
}

.red-curve-bg {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
}

.runway-line {
  position: absolute;
  bottom: 12px;
  left: 0;
  width: 100%;
  height: 2px;
  background: #ff4757;
  z-index: 2;
}

.plane-container {
  position: absolute;
  bottom: 12px;
  left: 10px;
  display: flex;
  align-items: center;
  z-index: 3;
  will-change: left, bottom, transform;
}

.red-plane-svg {
  width: 75px;
  height: 48px;
  fill: #ff4757;
  filter: drop-shadow(0 0 10px rgba(255, 71, 87, 0.9));
}

.plane-mult { font-size: 42px; font-weight: bold; color: #ffffff; z-index: 4; text-shadow: 0 2px 12px rgba(0,0,0,0.9); }
.plane-status { font-size: 14px; color: #ffa502; margin-top: 4px; font-weight: bold; z-index: 4; }

.bet-card {
  background: #172133; border: 1px solid #2f3e5c; border-radius: 8px; padding: 8px; margin-bottom: 8px; text-align: left; box-sizing: border-box;
}
.amt-row { display: flex; gap: 4px; margin-top: 5px; }
.quick-btn {
  background: #0b0f19; color: #fff; border: 1px solid #444; flex: 1; padding: 6px 2px; border-radius: 4px; font-size: 11px; cursor: pointer; text-align: center;
}
input {
  width: 100%; padding: 8px; background: #0b0f19; border: 1px solid #444; color: white; border-radius: 5px; text-align: center; font-size: 14px; box-sizing: border-box; margin-top: 4px; outline: none;
}
.big-bet-btn {
  background: #2ed573; color: #000; border: none; padding: 10px; width: 100%; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 6px;
}
.big-bet-btn:disabled {
  background: #555 !important;
  color: #aaa !important;
  cursor: not-allowed;
}
.admin-inline-box {
  background: #2a1a1a; border: 2px solid #ff5252; padding: 10px; border-radius: 8px; margin-bottom: 10px; text-align: left; display: none;
}
.msg { color: #2ed573; font-size: 12px; margin-top: 4px; font-weight: bold; text-align: center; }
.error { color: #ff4757; font-size: 12px; margin-top: 4px; font-weight: bold; text-align: center; }
.live-profit { color: #2ed573; font-size: 13px; font-weight: bold; margin-top: 5px; text-align: center; background: #051a0e; padding: 4px; border-radius: 4px; border: 1px solid #2ed573; display: none; }
.auto-row {
  display: flex; align-items: center; justify-content: space-between; margin-top: 6px; font-size: 12px; color: #00b4d8;
}
.auto-row input { width: 70px; padding: 4px; font-size: 12px; }
.live-bets-box {
  background: #161f2e; border: 1px solid #334155; border-radius: 8px; padding: 8px; margin-bottom: 8px; max-height: 110px; overflow-y: auto; text-align: left; font-size: 11px; box-sizing: border-box;
}
.live-bet-item { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid #1f293d; }
.live-bet-item span { color: #aaa; }
.live-bet-item .u-name { color: #fff; font-weight: bold; }
.live-bet-item .u-amt { color: #00b4d8; }
.live-bet-item .u-win { color: #2ed573; font-weight: bold; }
</style>
</head>
<body>

<div class="container">
  <div class="header-row">
    <h2 onclick="checkSecretTap()">Aviator</h2>
    <div>
      <span class="wallet-badge">₹<span id="av-bal">90398</span></span>
      <button class="dep-btn" onclick="window.location.href='index.html'">Deposit</button>
    </div>
  </div>

  <div id="aviator-admin-box" class="admin-inline-box">
    <b style="color: #ff5252; font-size: 13px;">👑 एडमिन क्रैश कंट्रोल:</b>
    <input type="number" id="adm-crash-val" placeholder="उदा. 2.00" step="0.1" min="1.1" style="padding: 6px; font-size: 13px;">
    <div style="display: flex; gap: 5px; margin-top: 5px;">
      <button class="big-bet-btn" style="padding: 6px; background: #2ed573; color: #000; font-size: 12px; margin-top: 0;" onclick="saveAdminCrash()">लॉक करें</button>
      <button class="big-bet-btn" style="padding: 6px; background: #555; color: #fff; font-size: 12px; margin-top: 0;" onclick="closeAdmin()">बंद</button>
    </div>
    <div id="adm-status-msg" style="color: #2ed573; font-size: 11px; margin-top: 3px; font-weight: bold;"></div>
  </div>

  <div class="history-bar" id="history-bar"></div>

  <div class="game-box">
    <svg class="red-curve-bg" viewBox="0 0 350 200" preserveAspectRatio="none">
      <defs>
        <linearGradient id="redGrad" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#ff4757" stop-opacity="0.05"/>
          <stop offset="100%" stop-color="#ff4757" stop-opacity="0.5"/>
        </linearGradient>
      </defs>
      <path id="curvePath" d="M 0 200 Q 0 200, 0 200 L 0 200 Z" fill="url(#redGrad)"></path>
      <path id="linePath" d="M 0 200 Q 0 200, 0 200" fill="none" stroke="#ff4757" stroke-width="3"></path>
    </svg>

    <div class="runway-line"></div>
    <div class="plane-container" id="plane-graphic">
      <svg class="red-plane-svg" viewBox="0 0 512 512">
        <path d="M448 336v-48L288 192V96c0-17.67-14.33-32-32-32s-32 14.33-32 32v96L64 288v48l160-48v112l-48 32v32l80-24 80 24v-32l-48-32V288z"/>
      </svg>
    </div>
    <div class="plane-mult" id="av-mult">1.00x</div>
    <div class="plane-status" id="av-stat">जुड़ रहा है...</div>
  </div>

  <div class="bet-card">
    <label style="font-size: 11px; color: #aaa;">बेट राशि (रुपए):</label>
    <input type="number" id="bet-input-1" value="500" min="10">
    <div class="amt-row">
      <button class="quick-btn" onclick="setAmt(100)">100</button>
      <button class="quick-btn" onclick="setAmt(200)">200</button>
      <button class="quick-btn" onclick="setAmt(500)">500</button>
      <button class="quick-btn" onclick="setAmt(1000)">1,000</button>
    </div>
    <div class="auto-row">
      <span>ऑटो कैशआउट:</span>
      <input type="number" id="auto-val-1" value="2.00" step="0.1" min="1.1">
    </div>
    <button class="big-bet-btn" id="action-btn-1" onclick="handleBet(1)">BET (लगाएं)</button>
    <div id="live-profit-1" class="live-profit">लाइव जीत: ₹0</div>
    <div id="msg-1"></div>
  </div>
  
  <div class="bet-card">
    <label style="font-size: 11px; color: #aaa;">बेट राशि (रुपए):</label>
    <input type="number" id="bet-input-2" value="500" min="10">
    <div class="amt-row">
      <button class="quick-btn" onclick="setAmt2(100)">100</button>
      <button class="quick-btn" onclick="setAmt2(200)">200</button>
      <button class="quick-btn" onclick="setAmt2(500)">500</button>
      <button class="quick-btn" onclick="setAmt2(1000)">1,000</button>
    </div>
    <div class="auto-row">
      <span>ऑटो कैशआउट:</span>
      <input type="number" id="auto-val-2" value="2.00" step="0.1" min="1.1">
    </div>
    <button class="big-bet-btn" id="action-btn-2" onclick="handleBet(2)">BET (लगाएं)</button>
    <div id="live-profit-2" class="live-profit">लाइव जीत: ₹0</div>
    <div id="msg-2"></div>
  </div>

  <div class="live-bets-box" id="live-bets-container">
    <div style="font-weight: bold; color: #00b4d8; margin-bottom: 4px; border-bottom: 1px solid #334155; padding-bottom: 2px;">🟢 लाइव प्लेयर्स (Bets & Cashouts)</div>
    <div id="live-bets-list">
      <div class="live-bet-item"><span class="u-name">Rahul_99</span> <span class="u-amt">₹500</span> <span class="u-win">⏳ खेल रहे हैं</span></div>
    </div>
  </div>
</div>
<script>
let walletBal = 90398;
let gameState = "BETTING"; 
let timerLeft = 15.0; 
let currentMultiplier = 1.00;
let crashAtMultiplier = 2.00;
let forcedCrashValue = null;
let flightTime = 0;

let isPlaying1 = false, isPlaying2 = false;
let betAmt1 = 0, betAmt2 = 0;
let autoTarget1 = 2.00, autoTarget2 = 2.00;
let historyList = [2.03, 4.39, 3.73, 1.18, 1.12, 41.89];

let tapCount = 0, tapTimer = null;

window.onload = function() {
  let saved = localStorage.getItem('mahakal_master_wallet');
  if(saved !== null) walletBal = parseFloat(saved);
  document.getElementById('av-bal').innerText = walletBal;
  renderHistory();
  setInterval(gameLoop, 100);
};

function checkSecretTap() {
  tapCount++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { tapCount = 0; }, 1200);
  if(tapCount >= 7) {
    tapCount = 0;
    let p = prompt("एडमिन पासवर्ड दर्ज करें:");
    if(p !== null && p.trim() === "78699") {
      document.getElementById('aviator-admin-box').style.display = "block";
    }
  }
}

function closeAdmin() {
  document.getElementById('aviator-admin-box').style.display = "none";
}

function saveAdminCrash() {
  let val = parseFloat(document.getElementById('adm-crash-val').value);
  if(!isNaN(val) && val >= 1.05) {
    forcedCrashValue = val;
    document.getElementById('adm-status-msg').innerText = `✅ क्रैश ${val}एक्स लॉक हुआ!`;
    setTimeout(closeAdmin, 1500);
  } else {
    alert("सही वैल्यू डालें!");
  }
}

function gameLoop() {
  let planeContainer = document.getElementById('plane-graphic');
  let curvePath = document.getElementById('curvePath');
  let linePath = document.getElementById('linePath');

  const planeSvgHtml = `
    <svg class="red-plane-svg" viewBox="0 0 512 512" style="width:75px;height:48px;fill:#ff4757;filter:drop-shadow(0 0 10px rgba(255, 71, 87, 0.9));">
      <path d="M448 336v-48L288 192V96c0-17.67-14.33-32-32-32s-32 14.33-32 32v96L64 288v48l160-48v112l-48 32v32l80-24 80 24v-32l-48-32V288z"/>
    </svg>`;

  if (gameState === "BETTING") {
    timerLeft -= 0.1;
    let displaySec = Math.max(0, Math.ceil(timerLeft));
    
    document.getElementById('av-stat').innerText = `⏱️ अगला राउंड शुरू होने में: ${displaySec}s`;
    document.getElementById('av-mult').innerText = "1.00x";
    document.getElementById('av-mult').style.color = "#ffffff";

    if(!isPlaying1) {
      let btn1 = document.getElementById('action-btn-1');
      btn1.innerText = "BET (लगाएं)";
      btn1.style.background = "#2ed573";
      btn1.style.color = "#000";
      btn1.disabled = false;
    }
    if(!isPlaying2) {
      let btn2 = document.getElementById('action-btn-2');
      btn2.innerText = "BET (लगाएं)";
      btn2.style.background = "#2ed573";
      btn2.style.color = "#000";
      btn2.disabled = false;
    }

    planeContainer.innerHTML = planeSvgHtml;
    planeContainer.style.left = "10px";
    planeContainer.style.bottom = "12px";
    let ps = planeContainer.querySelector('.red-plane-svg');
    if(ps) ps.style.transform = "rotate(0deg)";

    curvePath.setAttribute('d', 'M 0 200 Q 0 200, 0 200 L 0 200 Z');
    linePath.setAttribute('d', 'M 0 200 Q 0 200, 0 200');

    if (timerLeft <= 0) {
      gameState = "FLYING";
      currentMultiplier = 1.00;
      flightTime = 0;
      
      if(forcedCrashValue !== null) {
        crashAtMultiplier = forcedCrashValue;
        forcedCrashValue = null;
      } else {
        crashAtMultiplier = parseFloat((Math.random() * 3.5 + 1.2).toFixed(2));
      }
      
      generateFakeLiveBets();

      if (!isPlaying1) {
        let b1 = document.getElementById('action-btn-1');
        b1.innerText = "अगले राउंड का इंतज़ार...";
        b1.style.background = "#555";
        b1.disabled = true;
      }
      if (!isPlaying2) {
        let b2 = document.getElementById('action-btn-2');
        b2.innerText = "अगले राउंड का इंतज़ार...";
        b2.style.background = "#555";
        b2.disabled = true;
      }
    }
  } 
  else if (gameState === "FLYING") {
    flightTime += 0.1;
    currentMultiplier = 1.00 + Math.pow(flightTime, 1.7) * 0.12;
    currentMultiplier = parseFloat(currentMultiplier.toFixed(2));

    document.getElementById('av-stat').innerText = "✈️ प्लेन उड़ रहा है...";
    document.getElementById('av-mult').innerText = currentMultiplier.toFixed(2) + "x";

    let progress = Math.min(1, flightTime / 3.0);
    let moveX = 10 + (progress * 250);
    let moveY = 12 + (Math.pow(progress, 1.5) * 120);

    planeContainer.style.left = moveX + "px";
    planeContainer.style.bottom = moveY + "px";
    
    let ps = planeContainer.querySelector('.red-plane-svg');
    if(ps) ps.style.transform = `rotate(${25 + (progress * 15)}deg)`;

    let pathD = `M 0 200 Q ${moveX/2} 200, ${moveX} ${200 - moveY} L ${moveX} 200 Z`;
    let lineD = `M 0 200 Q ${moveX/2} 200, ${moveX} ${200 - moveY}`;
    curvePath.setAttribute('d', pathD);
    linePath.setAttribute('d', lineD);

    updateFakeLiveCashouts(currentMultiplier);

    if (isPlaying1) {
      let p1 = Math.floor(betAmt1 * currentMultiplier);
      document.getElementById('live-profit-1').style.display = "block";
      document.getElementById('live-profit-1').innerText = `📈 लाइव जीत: ₹${p1}`;
      let b1 = document.getElementById('action-btn-1');
      b1.innerText = `Cash Out (₹${p1})`;
      b1.style.background = "#ffa502";
      b1.disabled = false;

      if (currentMultiplier >= autoTarget1) {
        walletBal += p1;
        updateBal();
        isPlaying1 = false;
        let btn1 = document.getElementById('action-btn-1');
        btn1.innerText = "अगले राउंड का इंतज़ार...";
        btn1.style.background = "#555";
        btn1.disabled = true;
        document.getElementById('msg-1').className = "msg";
        document.getElementById('msg-1').innerText = `🎉 ऑटो कैशआउट! ₹${p1} जीत गए!`;
        document.getElementById('live-profit-1').style.display = "none";
      }
    }

    if (isPlaying2) {
      let p2 = Math.floor(betAmt2 * currentMultiplier);
      document.getElementById('live-profit-2').style.display = "block";
      document.getElementById('live-profit-2').innerText = `📈 लाइव जीत: ₹${p2}`;
      let b2 = document.getElementById('action-btn-2');
      b2.innerText = `Cash Out (₹${p2})`;
      b2.style.background = "#ffa502";
      b2.disabled = false;

      if (currentMultiplier >= autoTarget2) {
        walletBal += p2;
        updateBal();
        isPlaying2 = false;
        let btn2 = document.getElementById('action-btn-2');
        btn2.innerText = "अगले राउंड का इंतज़ार...";
        btn2.style.background = "#555";
        btn2.disabled = true;
        document.getElementById('msg-2').className = "msg";
        document.getElementById('msg-2').innerText = `🎉 ऑटो कैशआउट! ₹${p2} जीत गए!`;
        document.getElementById('live-profit-2').style.display = "none";
      }
    }

    if (currentMultiplier >= crashAtMultiplier) {
      gameState = "CRASHED";
      setTimeout(() => {
        timerLeft = 15.0;
        gameState = "BETTING";
      }, 3000);
      markCrashedState();
    }
  }
  else if (gameState === "CRASHED") {
    planeContainer.innerHTML = '<div style="font-size:45px;">💥</div>';
    document.getElementById('av-mult').innerText = currentMultiplier.toFixed(2) + "x";
    document.getElementById('av-mult').style.color = "#ff4757";
    document.getElementById('av-stat').innerText = "💥 Flew Away!";

    if (!window.lastCrashRecorded || window.lastCrashRecorded !== currentMultiplier) {
      window.lastCrashRecorded = currentMultiplier;
      historyList.push(currentMultiplier);
      if (historyList.length > 10) historyList.shift();
      renderHistory();
    }

    if (isPlaying1) {
      document.getElementById('msg-1').className = "error";
      document.getElementById('msg-1').innerText = "❌ आप हार गए!";
      isPlaying1 = false;
      let b1 = document.getElementById('action-btn-1');
      b1.innerText = "अगले राउंड का इंतज़ार...";
      b1.style.background = "#555";
      b1.disabled = true;
      document.getElementById('live-profit-1').style.display = "none";
    }
    if (isPlaying2) {
      document.getElementById('msg-2').className = "error";
      document.getElementById('msg-2').innerText = "❌ आप हार गए!";
      isPlaying2 = false;
      let b2 = document.getElementById('action-btn-2');
      b2.innerText = "अगले राउंड का इंतज़ार...";
      b2.style.background = "#555";
      b2.disabled = true;
      document.getElementById('live-profit-2').style.display = "none";
    }
  }
}

function markCrashedState() {
  let listEl = document.getElementById('live-bets-list');
  let items = listEl.getElementsByClassName('live-bet-item');
  for(let item of items) {
    let winSpan = item.querySelector('.u-win');
    if(winSpan && winSpan.innerText.includes("⏳")) {
      winSpan.style.color = "#ff4757";
      winSpan.innerText = "❌ क्रैश";
    }
  }
}

let fakeUsersData = [];
function generateFakeLiveBets() {
  let names = ["Vikas_Kumar", "Rohit_Singh", "Aman_Verma", "Pooja_Sharma", "Amit_Gupta", "Neha_Yadav", "Sachin_King"];
  fakeUsersData = [];
  let listEl = document.getElementById('live-bets-list');
  listEl.innerHTML = "";
  let count = Math.floor(Math.random() * 3) + 3;
  for(let i = 0; i < count; i++) {
    let uName = names[Math.floor(Math.random() * names.length)];
    let uAmt = (Math.floor(Math.random() * 10) + 1) * 100;
    fakeUsersData.push({ name: uName, amt: uAmt, cashAt: parseFloat((Math.random() * 2.5 + 1.1).toFixed(2)) });
    let item = document.createElement('div');
    item.className = 'live-bet-item';
    item.id = `fake-user-${i}`;
    item.innerHTML = `<span class="u-name">${uName}</span> <span class="u-amt">₹${uAmt}</span> <span class="u-win" style="color:#ffa502;">⏳ खेल रहे हैं</span>`;
    listEl.appendChild(item);
  }
}

function updateFakeLiveCashouts(currM) {
  fakeUsersData.forEach((user, idx) => {
    let el = document.getElementById(`fake-user-${idx}`);
    if(el) {
      let winSpan = el.querySelector('.u-win');
      if(winSpan && winSpan.innerText.includes("⏳") && currM >= user.cashAt) {
        let winAmt = Math.floor(user.amt * user.cashAt);
        winSpan.style.color = "#2ed573";
        winSpan.innerText = `✅ ${user.cashAt}x (₹${winAmt})`;
      }
    }
  });
}

function handleBet(panelNo) {
  if (gameState !== "BETTING") {
    alert("प्लेन उड़ रहा है! अब इस राउंड में बेट नहीं लग सकती। कृपया अगले राउंड का इंतज़ार करें।");
    return;
  }

  let inpId = panelNo === 1 ? 'bet-input-1' : 'bet-input-2';
  let autoId = panelNo === 1 ? 'auto-val-1' : 'auto-val-2';
  let btnId = panelNo === 1 ? 'action-btn-1' : 'action-btn-2';
  let msgId = panelNo === 1 ? 'msg-1' : 'msg-2';
  let profitId = panelNo === 1 ? 'live-profit-1' : 'live-profit-2';
  
  let amt = parseInt(document.getElementById(inpId).value);
  let target = parseFloat(document.getElementById(autoId).value);

  if(isNaN(amt) || amt < 10) { alert("कम से कम ₹10 लगाएं!"); return; }
  if(walletBal < amt) { alert("बैलेंस कम है!"); return; }

  let currentText = document.getElementById(btnId).innerText;
  if(currentText.includes("Cash Out")) {
    let currMultText = parseFloat(document.getElementById('av-mult').innerText);
    let win = Math.floor((panelNo === 1 ? betAmt1 : betAmt2) * currMultText);
    walletBal += win;
    updateBal();
    
    if(panelNo === 1) isPlaying1 = false; else isPlaying2 = false;
    document.getElementById(btnId).innerText = "BET (लगाएं)";
    document.getElementById(btnId).style.background = "#2ed573";
    document.getElementById(btnId).style.color = "#000";
    document.getElementById(msgId).className = "msg";
    document.getElementById(msgId).innerText = `🎉 कैशआउट! ₹${win} जीत गए!`;
    document.getElementById(profitId).style.display = "none";
    return;
  }

  walletBal -= amt;
  updateBal();
  if(panelNo === 1) { 
    isPlaying1 = true; betAmt1 = amt; autoTarget1 = isNaN(target) ? 2.00 : target; 
  } else { 
    isPlaying2 = true; betAmt2 = amt; autoTarget2 = isNaN(target) ? 2.00 : target; 
  }
  
  document.getElementById(btnId).innerText = "WAITING (लग गई)";
  document.getElementById(btnId).style.background = "#ffa502";
  document.getElementById(btnId).style.color = "#000";
  document.getElementById(msgId).className = "msg";
  document.getElementById(msgId).innerText = "✅ बेट सफलतापूर्वक लग गई!";
}

function updateBal() {
  document.getElementById('av-bal').innerText = walletBal;
  localStorage.setItem('mahakal_master_wallet', walletBal);
}

function setAmt(v) { document.getElementById('bet-input-1').value = v; }
function setAmt2(v) { document.getElementById('bet-input-2').value = v; }

function renderHistory() {
  let bar = document.getElementById('history-bar');
  bar.innerHTML = "";
  historyList.forEach(item => {
    let div = document.createElement('div');
    div.className = item >= 2.00 ? "hist-pill pill-red" : "hist-pill pill-blue";
    div.innerText = item.toFixed(2) + "x";
    bar.appendChild(div);
  });
}
</script>
</body>
</html>
