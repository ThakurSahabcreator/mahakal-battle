<div style="max-width:480px;margin:10px auto;background:#111;border:1px solid #d4af37;border-radius:12px;padding:12px">
  <div style="display:flex;justify-content:space-between"><b style="color:#ffd700">🔴 LIVE BETS - Real Players Jaisa</b><span style="font-size:11px;color:#22c55e">● 512 Online</span></div>
  <div id="liveBets" style="margin-top:8px;font-size:12px"></div>
</div>

<script>
// Spribe jaisa Live Players - Naam + Bet + Badhte Hue Coin
let livePlayers = [
  {name:"Rahul •••", bet:100, cashoutAt:2.5, out:false},
  {name:"Priya •••", bet:200, cashoutAt:3.8, out:false},
  {name:"Amit •••", bet:50, cashoutAt:1.8, out:false},
  {name:"Sneha •••", bet:500, cashoutAt:5.2, out:false},
  {name:"Vikash •••", bet:1000, cashoutAt:8.5, out:false},
  {name:"Rohan •••", bet:150, cashoutAt:2.1, out:false},
];

function showLiveBets(){
  let html = '';
  livePlayers.forEach(p=>{
    let currentWin = Math.floor(p.bet * mult); // Jaise multiplier badhega, iska coin bhi badhega
    if(mult >= p.cashoutAt && !p.out){
      p.out = true;
      p.finalWin = Math.floor(p.bet * p.cashoutAt);
    }
    if(p.out){
      html += `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #222"><span>👤 ${p.name}</span><span>${p.bet} Points</span><span style="color:#22c55e;font-weight:800">+${p.finalWin} WON ✅</span></div>`;
    } else {
      // Abhi ud raha hai - coin badhta hua dikhega
      html += `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #222"><span>👤 ${p.name}</span><span>${p.bet} Points</span><span style="color:#ffd700;font-weight:800">${currentWin} 🔥</span></div>`;
    }
  });
  document.getElementById('liveBets').innerHTML = html;
}

// Har round shuru hone pe naye players banao - jaise real me naye log aate hain
function resetLivePlayers(){
  let names = ["Rahul","Priya","Amit","Sneha","Vikash","Rohan","Anjali","Deepak","Manish","Pooja","Arjun","Kavita"];
  livePlayers = [];
  for(let i=0;i<6;i++){
    let n = names[Math.floor(Math.random()*names.length)];
    let b = [50,100,150,200,500,1000][Math.floor(Math.random()*6)];
    livePlayers.push({name:n+" •••", bet:b, cashoutAt:1.5+Math.random()*7, out:false});
  }
}
