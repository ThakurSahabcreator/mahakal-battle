<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>महाकाल Dual Aviator</title>
<!-- WhatsApp OG Meta Tags -->
<meta property="og:title" content="महाकाल गेमिंग ज़ोन - Mahakal Dual Aviator">
<meta property="og:description" content="पहेलियां सुलझाएं, असली नकद जीतें और सुरक्षित गेमिंग का आनंद लें!">
<meta property="og:url" content="https://sandeepmahakal.github.io/mahakal-battle/">
<meta property="og:type" content="website">

<style>
body {
background-color: #0b0f19;
color: #ffffff;
font-family: Arial, sans-serif;
text-align: center;
margin: 0;
padding: 10px;
-webkit-user-select: none;
user-select: none;
}
.container {
max-width: 420px;
margin: auto;
background: #131a26;
padding: 12px;
border-radius: 12px;
border: 2px solid #00e676;
box-shadow: 0 4px 20px rgba(0, 230, 118, 0.3);
position: relative;
}
h2 { color: #00e676; margin-top: 2px; font-size: 18px; }

/* Banner Style */
.game-banner {
width: 100%;
border-radius: 8px;
border: 1px solid #ffab00;
margin-bottom: 10px;
box-shadow: 0 0 10px rgba(255, 171, 0, 0.3);
}

/* Login Page Style */
.auth-box {
background: #1b2230;
padding: 15px;
border-radius: 8px;
border: 1px solid #334155;
margin-top: 5px;
text-align: left;
}
.auth-box input {
width: 95%;
padding: 10px;
margin: 6px 0;
background: #0b0f19;
border: 1px solid #64748b;
color: white;
border-radius: 4px;
font-size: 14px;
text-align: center;
}

/* History Bar */
.history-bar {
display: flex;
gap: 5px;
overflow-x: auto;
padding: 5px;
background: #070a12;
border-radius: 6px;
margin-bottom: 8px;
white-space: nowrap;
}
.history-item {
background: #1e293b;
color: #38bdf8;
padding: 2px 6px;
border-radius: 4px;
font-size: 10px;
font-weight: bold;
border: 1px solid #334155;
}
.history-item.high {
color: #00e676;
border-color: #00e676;
}

/* Game Screen (Clean View) */
.game-screen {
width: 100%;
height: 190px;
background: #070a12;
border: 2px solid #334155;
border-radius: 8px;
position: relative;
overflow: hidden;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
margin-bottom: 8px;
}

.multiplier-display {
font-size: 36px;
font-weight: bold;
color: #00e676;
text-shadow: 0 0 10px rgba(0, 230, 118, 0.5);
z-index: 2;
}

.timer-display {
font-size: 20px;
color: #ffab00;
font-weight: bold;
margin-top: 5px;
}

.plane-icon {
position: absolute;
font-size: 28px;
transition: transform 0.1s linear;
display: none;
z-index: 1;
}

/* Dual Bet Panels */
.dual-controls {
display: flex;
gap: 6px;
margin-bottom: 8px;
}

.bet-panel {
flex: 1;
background: #1b2230;
padding: 8px;
border-radius: 8px;
border: 1px solid #475569;
text-align: left;
}

.bet-panel h4 {
margin: 0 0 4px 0;
color: #ffab00;
font-size: 12px;
text-align: center;
}

.bet-panel input {
width: 90%;
padding: 5px;
margin: 3px 0;
background: #0b0f19;
border: 1px solid #64748b;
color: white;
border-radius: 4px;
text-align: center;
font-size: 13px;
}

.live-win-text {
font-size: 11px;
color: #ffeb3b;
font-weight: bold;
margin-top: 3px;
min-height: 16px;
text-align: center;
}

.btn {
background: linear-gradient(to right, #ff9100, #ff6d00);
color: white;
border: none;
padding: 10px;
width: 100%;
border-radius: 6px;
font-size: 14px;
font-weight: bold;
cursor: pointer;
margin-top: 6px;
}
.btn:hover { opacity: 0.9; }

.btn-cashout {
background: linear-gradient(to right, #ff9100, #ff3d00);
}

/* Admin Panel (Password Protected 78699) */
.admin-setting-box {
display: none; 
background: #1e1b2e;
border: 1px dashed #ab47bc;
padding: 8px;
border-radius: 8px;
margin-top: 6px;
text-align: left;
font-size: 11px;
color: #e1bee7;
}
.admin-setting-box input {
width: 50px;
padding: 4px;
background: #0b0f19;
color: #00e676;
border: 1px solid #ab47bc;
font-weight: bold;
display: inline-block;
margin: 2px;
}

.quick-btns {
display: flex;
gap: 3px;
margin-top: 4px;
flex-wrap: wrap;
}
.quick-btn {
background: #3b0764;
color: #e9d5ff;
border: 1px solid #a855f7;
padding: 3px 6px;
font-size: 9px;
border-radius: 4px;
cursor: pointer;
font-weight: bold;
}

.msg { color: #00e676; font-size: 12px; margin-top: 4px; font-weight: bold; }
.error { color: #ff5252; font-size: 12px; margin-top: 4px; font-weight: bold; }
</style>
</head>
<body>

<div class="container">

<!-- 🔐 Login Page -->
<div class="auth-box" id="auth-section">
    <img src="1792858963757.png" class="game-banner" onerror="this.style.display='none'">
    
    <div style="text-align: center; margin-bottom: 10px;">
        <span style="font-size: 18px; font-weight: bold; color: #ffab00;">🔱 महाकाल गेमिंग ज़ोन 🔱</span><br>
        <span style="font-size: 12px; color: #00e676;">नया खाता बनाएं & ₹10 बोनस पाएं!</span>
    </div>

    <label style="font-size: 11px; color: #94a3b8;">मोबाइल नंबर:</label>
    <input type="text" id="auth-phone" placeholder="अपना मोबाइल नंबर दर्ज करें">
    
    <button class="btn" onclick="sendOtp()">OTP भेजें</button>

    <div id="otp-container" style="display:none; margin-top: 6px;">
        <label style="font-size: 11px; color: #94a3b8;">OTP दर्ज करें:</label>
        <input type="text" id="auth-otp" placeholder="1234">

        <button class="btn" onclick="verifyAndLogin()" style="background: linear-gradient(to right, #00c853, #64dd17);">रजिस्ट्रेशन पूरा करें</button>
    </div>
    
    <div id="auth-msg" style="text-align: center; font-size: 11px; margin-top: 5px; color: #00e676;"></div>
</div>

<!-- 🎮 Game Dashboard (100% Clean)[span_4](start_span)[span_4](end_span) -->
<div id="game-dashboard" style="display:none;">

    <!-- History Bar -->
    <div class="history-bar" id="history-container">
        <div class="history-item">1.45x</div>
        <div class="history-item high">10.0x</div>
    </div>

    <!-- Game Screen -->
    <div class="game-screen" id="game-screen">
        <div class="multiplier-display" id="multiplier-text" style="display:none;">1.00x</div>
        <div class="timer-display" id="timer-box">बेटिंग टाइम: <span id="countdown">10</span>s</div>
        <div class="plane-icon" id="plane">🚀</div>
    </div>

    <!-- Dual Bet Panels -->
    <div class="dual-controls">
        <div class="bet-panel">
            <h4>बेट 1</h4>
            <input type="number" id="bet1-amount" value="50" min="5" max="50000">
            <button class="btn" style="padding:7px;" id="action-btn-1" onclick="handleBet(1)">बेट लगाएं</button>
            <div class="live-win-text" id="live-win-1"></div>
        </div>
        <div class="bet-panel">
            <h4>बेट 2</h4>
            <input type="number" id="bet2-amount" value="100" min="5" max="50000">
            <button class="btn" style="padding:7px;" id="action-btn-2" onclick="handleBet(2)">बेट लगाएं</button>
            <div class="live-win-text" id="live-win-2"></div>
        </div>
    </div>

    <div id="result-msg" style="min-height: 18px;"></div>

    <!-- 👑 Admin Portal Button (Password Protected 78699)[span_5](start_span)[span_5](end_span) -->
    <div style="margin-top: 10px; text-align: center;">
        <button onclick="openAdminPanel()" style="background:none; border:none; color:#475569; font-size:10px; cursor:pointer;">👑 Admin Portal</button>
    </div>

    <!-- 👑 Admin Master Control Panel -->
    <div class="admin-setting-box" id="admin-panel-div">
        <b>👑 एडमिन मास्टर कंट्रोल (क्रैश और टाइमिंग सेट करें):</b><br>
        बेट टाइम (Sec): <input type="number" id="admin-bet-time" value="10"> 
        क्रैश पॉइंट (x): <input type="number" id="admin-crash-point" value="2.50" step="0.1"> 
        <br>
        <b>⚡ क्विक सेट (2x, 3x, 5x, आदि):</b>
        <div class="quick-btns">
            <button class="quick-btn" onclick="setCrash(1.5)">1.5x</button>
            <button class="quick-btn" onclick="setCrash(2.0)">2x</button>
            <button class="quick-btn" onclick="setCrash(3.0)">3x</button>
            <button class="quick-btn" onclick="setCrash(5.0)">5x</button>
            <button class="quick-btn" onclick="setCrash(10.0)">10x</button>
            <button class="quick-btn" onclick="setCrash(50.0)">50x</button>
        </div>
    </div>

</div>

</div>

<script>
let currentUser = null;
let gameWallet = 500;

let multiplier = 1.00;
let gameInterval = null;
let timerInterval = null;
let gameState = "WAITING"; 
let crashPoint = 2.50;
let timeLeft = 10;
let crashHistory = [1.45, 10.0, 2.10, 50.0, 3.20];

let bets = {
    1: { placed: false, amount: 0, cashedOut: false },
    2: { placed: false, amount: 0, cashedOut: false }
};

function sendOtp() {
    let phone = document.getElementById('auth-phone').value.trim();
    if(phone.length < 10) {
        alert("❌ कृपया सही 10 अंकों का मोबाइल नंबर दर्ज करें!");
        return;
    }
    document.getElementById('otp-container').style.display = 'block';
    document.getElementById('otp-btn').style.display = 'none';
    document.getElementById('auth-msg').innerText = "✅ OTP भेज दिया गया है (Demo OTP: 1234)";
}

function verifyAndLogin() {
    let phone = document.getElementById('auth-phone').value.trim();
    let otp = document.getElementById('auth-otp').value.trim();

    if(otp !== "1234") {
        alert("❌ गलत OTP! कृपया '1234' दर्ज करें।");
        return;
    }

    currentUser = phone;
    document.getElementById('auth-section').style.display = "none";
    document.getElementById('game-dashboard').style.display = "block";
    startCountdown();
}

// 👑 Secret Admin Password Check (78699)[span_6](start_span)[span_6](end_span)
function openAdminPanel() {
    let pin = prompt("कृपया एडमिन पासवर्ड दर्ज करें:");
    if(pin === "78699") { 
        document.getElementById('admin-panel-div').style.display = "block";
        alert("✅ एडमिन पैनल अनलॉक हो गया है!");
    } else if(pin !== null) {
        alert("❌ गलत पासवर्ड!");
    }
}

function setCrash(val) {
    document.getElementById('admin-crash-point').value = val;
    crashPoint = val;
}

function updateHistoryUI() {
    let container = document.getElementById('history-container');
    container.innerHTML = "";
    crashHistory.slice(-6).forEach(val => {
        let div = document.createElement('div');
        div.className = val >= 5.0 ? "history-item high" : "history-item";
        div.innerText = val.toFixed(2) + "x";
        container.appendChild(div);
    });
}

function handleBet(panelId) {
    let betInputId = panelId === 1 ? 'bet1-amount' : 'bet2-amount';
    let btnId = panelId === 1 ? 'action-btn-1' : 'action-btn-2';
    let winTextId = panelId === 1 ? 'live-win-1' : 'live-win-2';
    let betInput = parseInt(document.getElementById(betInputId).value);

    if (gameState === "WAITING") {
        if (!bets[panelId].placed) {
            if (isNaN(betInput) || betInput < 5) {
                alert("❌ न्यूनतम ₹5 या अधिक दर्ज करें!");
                return;
            }

            bets[panelId].amount = betInput;
            bets[panelId].placed = true;

            document.getElementById(betInputId).disabled = true;
            let btn = document.getElementById(btnId);
            btn.innerText = "रद्द करें";
            btn.className = "btn btn-cashout";
            document.getElementById(winTextId).innerText = `लगाए: ₹${betInput}`;
        } else {
            bets[panelId].placed = false;

            document.getElementById(betInputId).disabled = false;
            let btn = document.getElementById(btnId);
            btn.innerText = "बेट लगाएं";
            btn.className = "btn";
            document.getElementById(winTextId).innerText = "रद्द कर दिया";
        }
    } else if (gameState === "RUNNING") {
        if (bets[panelId].placed && !bets[panelId].cashedOut) {
            let winAmt = Math.floor(bets[panelId].amount * multiplier);
            bets[panelId].cashedOut = true;

            let btn = document.getElementById(btnId);
            btn.innerText = "जीता ✅";
            btn.className = "btn";
            document.getElementById(winTextId).innerText = `जीत: ₹${winAmt}`;

            let resDiv = document.getElementById('result-msg');
            resDiv.className = "msg";
            resDiv.innerText = `🎉 जीता: ₹${winAmt} (${multiplier.toFixed(2)}x)`;
        }
    }
}

function startCountdown() {
    gameState = "WAITING";
    timeLeft = parseInt(document.getElementById('admin-bet-time').value) || 10;
    
    document.getElementById('multiplier-text').style.display = "none";
    document.getElementById('timer-box').style.display = "block";
    document.getElementById('plane').style.display = "none";
    document.getElementById('result-msg').innerText = "";

    [1, 2].forEach(id => {
        bets[id].placed = false;
        bets[id].cashedOut = false;
        document.getElementById(`bet${id}-amount`).disabled = false;
        let btn = document.getElementById(`action-btn-${id}`);
        btn.innerText = "बेट लगाएं";
        btn.className = "btn";
        document.getElementById(`live-win-${id}`).innerText = "";
    });

    timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('countdown').innerText = timeLeft;

        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            startFlightGame();
        }
    }, 1000);
}

function startFlightGame() {
    gameState = "RUNNING";
    multiplier = 1.00;

    document.getElementById('timer-box').style.display = "none";
    document.getElementById('multiplier-text').style.display = "block";
    document.getElementById('plane').style.display = "block";
    document.getElementById('plane').style.transform = "translate(-30px, 15px) rotate(-15deg)";

    crashPoint = parseFloat(document.getElementById('admin-crash-point').value) || 2.50;

    [1, 2].forEach(id => {
        let btn = document.getElementById(`action-btn-${id}`);
        if (bets[id].placed) {
            btn.innerText = "Cash Out";
            btn.className = "btn btn-cashout";
        } else {
            btn.disabled = true;
            btn.innerText = "मिस हो गया";
            btn.className = "btn";
        }
    });

    gameInterval = setInterval(() => {
        multiplier += 0.02;
        document.getElementById('multiplier-text').innerText = multiplier.toFixed(2) + "x";

        let adminInput = parseFloat(document.getElementById('admin-crash-point').value);
        if(!isNaN(adminInput)) {
            crashPoint = adminInput;
        }

        [1, 2].forEach(id => {
            if (bets[id].placed && !bets[id].cashedOut) {
                let liveW = Math.floor(bets[id].amount * multiplier);
                document.getElementById(`live-win-${id}`).innerText = `₹${liveW}`;
            }
        });

        let xPos = (multiplier - 1) * 20 - 25;
        let yPos = 15 - (multiplier - 1) * 10;
        if(xPos > 80) xPos = 80;
        if(yPos < -30) yPos = -30;
        document.getElementById('plane').style.transform = `translate(${xPos}px, ${yPos}px) rotate(-20deg)`;

        if (multiplier >= crashPoint) {
            clearInterval(gameInterval);
            triggerCrash();
        }
    }, 70);
}

function triggerCrash() {
    gameState = "CRASHED";
    document.getElementById('plane').style.display = "none";

    crashHistory.push(crashPoint);
    updateHistoryUI();

    [1, 2].forEach(id => {
        if (bets[id].placed && !bets[id].cashedOut) {
            document.getElementById(`live-win-${id}`).innerText = "हार गए ❌";
        }
        let btn = document.getElementById(`action-btn-${id}`);
        btn.disabled = false;
        btn.innerText = "अगला राउंड...";
        btn.className = "btn";
    });

    let resDiv = document.getElementById('result-msg');
    resDiv.className = "error";
    resDiv.innerText = `💥 क्रैश हो गया! (${crashPoint.toFixed(2)}x)`;

    setTimeout(startCountdown, 4000);
}

updateHistoryUI();
</script>

</body>
</html>
