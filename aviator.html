<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aviator - Perfect Sync with Live Users</title>
<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
body {
  background-color: #0b0f19;
  color: #ffffff;
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 5px;
  user-select: none;
}
.container {
  max-width: 400px;
  margin: auto;
  background: #131a26;
  padding: 10px;
  border-radius: 10px;
  border: 2px solid #00b4d8;
  position: relative;
}
.header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
h2 { color: #ff5252; margin: 0; font-size: 22px; font-style: italic; cursor: pointer; }
.wallet-badge {
  background: #00c853;
  color: #000;
  padding: 5px 12px;
  border-radius: 6px;
  font-weight: bold;
  font-size: 14px;
}
.dep-btn {
  background: #00c853;
  color: #000;
  border: none;
  padding: 6px 12px;
  border-radius: 5px;
  font-weight: bold;
  cursor: pointer;
}
.history-bar {
  display: flex;
  gap: 5px;
  overflow-x: auto;
  margin-bottom: 8px;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.history-bar::-webkit-scrollbar { display: none; }
.hist-pill {
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: bold;
  white-space: nowrap;
}
.pill-blue { background: #1a2332; border: 1px solid #00b4d8; color: #00b4d8; }
.pill-red { background: #3a1111; border: 1px solid #ff5252; color: #ff5252; }

.game-box {
  height: 170px;
  background: radial-gradient(circle, #221015 0%, #05070c 100%);
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 1px solid #ff5252;
  margin-bottom: 8px;
  position: relative;
  overflow: hidden;
}
.plane-icon {
  font-size: 32px;
  margin-bottom: 2px;
}
.plane-mult {
  font-size: 40px;
  font-weight: bold;
  color: #ffffff;
}
.plane-status {
  font-size: 13px;
  color: #ffab00;
  margin-top: 4px;
  font-weight: bold;
}
.bet-card {
  background: #1a2332;
  border: 1px solid #334155;
  border-radius: 8px;
  padding: 8px;
  margin-bottom: 8px;
  text-align: left;
}
.amt-row {
  display: flex;
  gap: 4px;
  margin-top: 5px;
}
.quick-btn {
  background: #0b0f19;
  color: #fff;
  border: 1px solid #444;
  flex: 1;
  padding: 4px;
  border-radius: 4px;
  font-size: 11px;
  cursor: pointer;
}
input {
  width: 100%;
  padding: 8px;
  background: #0b0f19;
  border: 1px solid #444;
  color: white;
  border-radius: 5px;
  text-align: center;
  font-size: 14px;
  box-sizing: border-box;
  margin-top: 4px;
}
.big-bet-btn {
  background: #00c853;
  color: #000;
  border: none;
  padding: 10px;
  width: 100%;
  border-radius: 6px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 6px;
}
.admin-inline-box {
  background: #2a1a1a;
  border: 2px solid #ff5252;
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 10px;
  text-align: left;
  display: none;
}
.msg { color: #00e676; font-size: 12px; margin-top: 4px; font-weight: bold; text-align: center; }
.error { color: #ff5252; font-size: 12px; margin-top: 4px; font-weight: bold; text-align: center; }
.live-profit { color: #00e676; font-size: 13px; font-weight: bold; margin-top: 5px; text-align: center; background: #051a0e; padding: 4px; border-radius: 4px; border: 1px solid #00c853; display: none; }
.auto-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 6px;
  font-size: 12px;
  color: #00b4d8;
}
.auto-row input {
  width: 70px;
  padding: 4px;
  font-size: 12px;
}
.live-bets-box {
  background: #161f2e;
  border: 1px solid #334155;
  border-radius: 8px;
  padding: 8px;
  margin-bottom: 8px;
  max-height: 120px;
  overflow-y: auto;
  text-align: left;
  font-size: 11px;
}
.live-bet-item {
  display: flex;
  justify-content: space-between;
  padding: 3px 0;
  border-bottom: 1px solid #1f293d;
}
.live-bet-item span { color: #aaa; }
.live-bet-item .u-name { color: #fff; font-weight: bold; }
.live-bet-item .u-amt { color: #00b4d8; }
.live-bet-item .u-win { color: #00e676; font-weight: bold; }
</style>
</head>
<body>

<div class="container">
  <div class="header-row">
    <h2 onclick="checkSecretTap()">Aviator</h2>
    <div>
      <span class="wallet-badge">₹<span id="av-bal">90398</span></span>
      <button class="dep-btn" onclick="window.location.href='index.html'">Deposit</button>
    </div>
  </div>

  <div id="aviator-admin-box" class="admin-inline-box">
    <b style="color: #ff5252; font-size: 13px;">👑 एडमिन क्रैश कंट्रोल:</b>
    <input type="number" id="adm-crash-val" placeholder="उदा. 2.00" step="0.1" min="1.1" style="padding: 6px; font-size: 13px;">
    <div style="display: flex; gap: 5px; margin-top: 5px;">
      <button class="big-bet-btn" style="padding: 6px; background: #00e676; color: #000; font-size: 12px; margin-top: 0;" onclick="saveAdminCrash()">लॉक करें</button>
      <button class="big-bet-btn" style="padding: 6px; background: #555; color: #fff; font-size: 12px; margin-top: 0;" onclick="closeAdmin()">बंद</button>
    </div>
    <div id="adm-status-msg" style="color: #00e676; font-size: 11px; margin-top: 3px; font-weight: bold;"></div>
  </div>

  <div class="history-bar" id="history-bar"></div>

  <div class="game-box">
    <div class="plane-icon" id="plane-graphic">✈️</div>
    <div class="plane-mult" id="av-mult">1.00x</div>
    <div class="plane-status" id="av-stat">कनेक्ट हो रहा है...</div>
  </div>

  <div class="bet-card">
    <label style="font-size: 11px; color: #aaa;">बेट राशि (रुपए):</label>
    <input type="number" id="bet-input-1" value="500" min="10">
    <div class="amt-row">
      <button class="quick-btn" onclick="setAmt(100)">100</button>
      <button class="quick-btn" onclick="setAmt(200)">200</button>
      <button class="quick-btn" onclick="setAmt(500)">500</button>
      <button class="quick-btn" onclick="setAmt(1000)">1,000</button>
    </div>
    <div class="auto-row">
      <span>ऑटो कैशआउट:</span>
      <input type="number" id="auto-val-1" value="2.00" step="0.1" min="1.1">
    </div>
    <button class="big-bet-btn" id="action-btn-1" onclick="handleBet(1)">BET (लगाएं)</button>
    <div id="live-profit-1" class="live-profit">लाइव जीत: ₹0</div>
    <div id="msg-1"></div>
  </div>

  <div class="bet-card">
    <label style="font-size: 11px; color: #aaa;">बेट राशि (रुपए):</label>
    <input type="number" id="bet-input-2" value="500" min="10">
    <div class="amt-row">
      <button class="quick-btn" onclick="setAmt2(100)">100</button>
      <button class="quick-btn" onclick="setAmt2(200)">200</button>
      <button class="quick-btn" onclick="setAmt2(500)">500</button>
      <button class="quick-btn" onclick="setAmt2(1000)">1,000</button>
    </div>
    <div class="auto-row">
      <span>ऑटो कैशआउट:</span>
      <input type="number" id="auto-val-2" value="2.00" step="0.1" min="1.1">
    </div>
    <button class="big-bet-btn" id="action-btn-2" onclick="handleBet(2)">BET (लगाएं)</button>
    <div id="live-profit-2" class="live-profit">लाइव जीत: ₹0</div>
    <div id="msg-2"></div>
  </div>

  <div class="live-bets-box" id="live-bets-container">
    <div style="font-weight: bold; color: #00b4d8; margin-bottom: 4px; border-bottom: 1px solid #334155; padding-bottom: 2px;">🟢 लाइव प्लेयर्स (Bets & Cashouts)</div>
    <div id="live-bets-list">
      <div class="live-bet-item"><span class="u-name">Rahul_99</span> <span class="u-amt">₹500</span> <span class="u-win">⏳ खेल रहे हैं</span></div>
    </div>
  </div>
</div>
<script>
const firebaseConfig = {
  databaseURL: "https://aviatorapp-9b1a6-default-rtdb.firebaseio.com/"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let walletBal = 90398;
let isPlaying1 = false, isPlaying2 = false;
let betAmt1 = 0, betAmt2 = 0;
let autoTarget1 = 2.00, autoTarget2 = 2.00;
let historyList = [2.03, 4.39, 3.73, 1.18, 1.12, 41.89];

let tapCount = 0, tapTimer = null;
let localGameTimer = null;

window.onload = function() {
  let saved = localStorage.getItem('mahakal_master_wallet');
  if(saved !== null) walletBal = parseFloat(saved);
  document.getElementById('av-bal').innerText = walletBal;
  renderHistory();

  db.ref("aviatorGameState").on("value", (snapshot) => {
    let data = snapshot.val();
    if(data) {
      updateGameScreen(data);
    } else {
      initializeServerState();
    }
  });

  startLocalLoop();
};

function initializeServerState() {
  db.ref("aviatorGameState").set({
    status: "BETTING",
    timeLeft: 15,
    multiplier: 1.00
  });
}

function startLocalLoop() {
  if(localGameTimer) clearInterval(localGameTimer);
  localGameTimer = setInterval(() => {
    db.ref("aviatorGameState").once("value", (snapshot) => {
      let data = snapshot.val();
      if(!data) return;

      if(data.status === "BETTING") {
        let t = data.timeLeft - 1;
        if(t > 0) {
          db.ref("aviatorGameState").update({ timeLeft: t });
        } else {
          db.ref("aviatorServerCrash").once("value", (snap) => {
            let crashVal = snap.val() || parseFloat((Math.random() * 3.5 + 1.2).toFixed(2));
            db.ref("aviatorGameState").set({
              status: "FLYING",
              multiplier: 1.00,
              crashAt: crashVal
            });
            generateFakeLiveBets("BETTING");
          });
        }
      } 
      else if(data.status === "FLYING") {
        let m = data.multiplier + 0.03;
        let crashLimit = data.crashAt || 2.00;
        updateFakeLiveCashouts(m);

        if(m >= crashLimit) {
          db.ref("aviatorGameState").set({
            status: "CRASHED",
            multiplier: crashLimit
          });
          markFakeLiveCrashed();
          setTimeout(() => {
            db.ref("aviatorGameState").set({
              status: "BETTING",
              timeLeft: 15,
              multiplier: 1.00
            });
          }, 3000);
        } else {
          db.ref("aviatorGameState").update({ multiplier: parseFloat(m.toFixed(2)) });
        }
      }
    });
  }, 1000);
}

let fakeUsersData = [];
function generateFakeLiveBets(state) {
  let names = ["Vikas_Kumar", "Rohit_Singh", "Aman_Verma", "Pooja_Sharma", "Amit_Gupta", "Neha_Yadav", "Sachin_King"];
  fakeUsersData = [];
  let listEl = document.getElementById('live-bets-list');
  listEl.innerHTML = "";

  let count = Math.floor(Math.random() * 3) + 3;
  for(let i = 0; i < count; i++) {
    let uName = names[Math.floor(Math.random() * names.length)];
    let uAmt = (Math.floor(Math.random() * 10) + 1) * 100;
    fakeUsersData.push({ name: uName, amt: uAmt, status: "playing", cashAt: parseFloat((Math.random() * 2.5 + 1.1).toFixed(2)) });
    
    let item = document.createElement('div');
    item.className = 'live-bet-item';
    item.id = `fake-user-${i}`;
    item.innerHTML = `<span class="u-name">${uName}</span> <span class="u-amt">₹${uAmt}</span> <span class="u-win" style="color:#ffab00;">⏳ खेल रहे हैं</span>`;
    listEl.appendChild(item);
  }
}

function updateFakeLiveCashouts(currM) {
  fakeUsersData.forEach((user, idx) => {
    if(user.status === "playing" && currM >= user.cashAt) {
      user.status = "cashed";
      let winAmt = Math.floor(user.amt * user.cashAt);
      let el = document.getElementById(`fake-user-${idx}`);
      if(el) {
        el.innerHTML = `<span class="u-name">${user.name}</span> <span class="u-amt">₹${user.amt}</span> <span class="u-win">✅ ${user.cashAt}x (₹${winAmt})</span>`;
      }
    }
  });
}

function markFakeLiveCrashed() {
  fakeUsersData.forEach((user, idx) => {
    if(user.status === "playing") {
      user.status = "lost";
      let el = document.getElementById(`fake-user-${idx}`);
      if(el) {
        el.innerHTML = `<span class="u-name">${user.name}</span> <span class="u-amt">₹${user.amt}</span> <span class="u-win" style="color:#ff5252;">❌ क्रैश</span>`;
      }
    }
  });
}

function updateBal() {
  document.getElementById('av-bal').innerText = walletBal;
  localStorage.setItem('mahakal_master_wallet', walletBal);
}

function setAmt(v) { document.getElementById('bet-input-1').value = v; }
function setAmt2(v) { document.getElementById('bet-input-2').value = v; }

function checkSecretTap() {
  tapCount++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { tapCount = 0; }, 1200);
  if(tapCount >= 7) {
    tapCount = 0;
    let p = prompt("एडमिन पासवर्ड दर्ज करें:");
    if(p !== null && p.trim() === "78699") {
      document.getElementById('aviator-admin-box').style.display = "block";
    }
  }
}

function closeAdmin() {
  document.getElementById('aviator-admin-box').style.display = "none";
}

function saveAdminCrash() {
  let val = parseFloat(document.getElementById('adm-crash-val').value);
  if(!isNaN(val) && val >= 1.05) {
    db.ref("aviatorServerCrash").set(val, (err) => {
      if(!err) {
        document.getElementById('adm-status-msg').innerText = `✅ क्रैश ${val}x लॉक हुआ!`;
        setTimeout(closeAdmin, 1500);
      }
    });
  } else {
    alert("सही वैल्यू डालें!");
  }
}

function renderHistory() {
  let bar = document.getElementById('history-bar');
  bar.innerHTML = "";
  historyList.forEach(item => {
    let div = document.createElement('div');
    div.className = item >= 2.00 ? "hist-pill pill-red" : "hist-pill pill-blue";
    div.innerText = item.toFixed(2) + "x";
    bar.appendChild(div);
  });
}

function updateGameScreen(data) {
  let status = data.status;
  let mult = data.multiplier || 1.00;
  let timeLeft = data.timeLeft || 0;

  if(status === "BETTING") {
    document.getElementById('av-stat').innerText = `⏱️ अगला राउंड शुरू होने में: ${timeLeft} सेकण्ड`;
    document.getElementById('av-mult').innerText = "1.00x";
    document.getElementById('av-mult').style.color = "#fff";
    document.getElementById('plane-graphic').innerText = "✈️";

    if(isPlaying1 && timeLeft === 15) {
      isPlaying1 = false;
      document.getElementById('action-btn-1').innerText = "BET (लगाएं)";
      document.getElementById('action-btn-1').style.background = "#00c853";
      document.getElementById('live-profit-1').style.display = "none";
    }
    if(isPlaying2 && timeLeft === 15) {
      isPlaying2 = false;
      document.getElementById('action-btn-2').innerText = "BET (लगाएं)";
      document.getElementById('action-btn-2').style.background = "#00c853";
      document.getElementById('live-profit-2').style.display = "none";
    }
  } 
  else if(status === "FLYING") {
    document.getElementById('av-stat').innerText = "✈️ प्लेन उड़ रहा है...";
    document.getElementById('av-mult').innerText = mult.toFixed(2) + "x";

    if(isPlaying1) {
      let p1 = Math.floor(betAmt1 * mult);
      document.getElementById('live-profit-1').style.display = "block";
      document.getElementById('live-profit-1').innerText = `📈 लाइव जीत: ₹${p1}`;
      document.getElementById('action-btn-1').innerText = `CASHOUT (₹${p1})`;
      document.getElementById('action-btn-1').style.background = "#ff5252";

      if(mult >= autoTarget1) {
        walletBal += p1;
        updateBal();
        isPlaying1 = false;
        document.getElementById('action-btn-1').innerText = "BET (लगाएं)";
        document.getElementById('action-btn-1').style.background = "#00c853";
        document.getElementById('msg-1').className = "msg";
        document.getElementById('msg-1').innerText = `🎉 ऑटो कैशआउट! ₹${p1} जीत गए!`;
        document.getElementById('live-profit-1').style.display = "none";
      }
    }

    if(isPlaying2) {
      let p2 = Math.floor(betAmt2 * mult);
      document.getElementById('live-profit-2').style.display = "block";
      document.getElementById('live-profit-2').innerText = `📈 लाइव जीत: ₹${p2}`;
      document.getElementById('action-btn-2').innerText = `CASHOUT (₹${p2})`;
      document.getElementById('action-btn-2').style.background = "#ff5252";

      if(mult >= autoTarget2) {
        walletBal += p2;
        updateBal();
        isPlaying2 = false;
        document.getElementById('action-btn-2').innerText = "BET (लगाएं)";
        document.getElementById('action-btn-2').style.background = "#00c853";
        document.getElementById('msg-2').className = "msg";
        document.getElementById('msg-2').innerText = `🎉 ऑटो कैशआउट! ₹${p2} जीत गए!`;
        document.getElementById('live-profit-2').style.display = "none";
      }
    }
  } 
  else if(status === "CRASHED") {
    document.getElementById('plane-graphic').innerText = "💥";
    document.getElementById('av-mult').innerText = mult.toFixed(2) + "x";
    document.getElementById('av-mult').style.color = "#ff5252";
    document.getElementById('av-stat').innerText = "💥 क्रैश हो गया!";

    if(!window.lastCrashRecorded || window.lastCrashRecorded !== mult) {
      window.lastCrashRecorded = mult;
      historyList.push(mult);
      if(historyList.length > 10) historyList.shift();
      renderHistory();
    }

    if(isPlaying1) {
      document.getElementById('msg-1').className = "error";
      document.getElementById('msg-1').innerText = "❌ आप हार गए!";
      isPlaying1 = false;
      document.getElementById('action-btn-1').innerText = "BET (लगाएं)";
      document.getElementById('action-btn-1').style.background = "#00c853";
      document.getElementById('live-profit-1').style.display = "none";
    }
    if(isPlaying2) {
      document.getElementById('msg-2').className = "error";
      document.getElementById('msg-2').innerText = "❌ आप हार गए!";
      isPlaying2 = false;
      document.getElementById('action-btn-2').innerText = "BET (लगाएं)";
      document.getElementById('action-btn-2').style.background = "#00c853";
      document.getElementById('live-profit-2').style.display = "none";
    }
  }
}

function handleBet(panelNo) {
  let inpId = panelNo === 1 ? 'bet-input-1' : 'bet-input-2';
  let autoId = panelNo === 1 ? 'auto-val-1' : 'auto-val-2';
  let btnId = panelNo === 1 ? 'action-btn-1' : 'action-btn-2';
  let msgId = panelNo === 1 ? 'msg-1' : 'msg-2';
  let profitId = panelNo === 1 ? 'live-profit-1' : 'live-profit-2';
  
  let amt = parseInt(document.getElementById(inpId).value);
  let target = parseFloat(document.getElementById(autoId).value);

  if(isNaN(amt) || amt < 10) { alert("कम से कम ₹10 लगाएं!"); return; }
  if(walletBal < amt) { alert("बैलेंस कम है!"); return; }

  let currentText = document.getElementById(btnId).innerText;
  if(currentText.includes("CASHOUT")) {
    let currMultText = parseFloat(document.getElementById('av-mult').innerText);
    let win = Math.floor((panelNo === 1 ? betAmt1 : betAmt2) * currMultText);
    walletBal += win;
    updateBal();
    
    if(panelNo === 1) isPlaying1 = false; else isPlaying2 = false;
    document.getElementById(btnId).innerText = "BET (लगाएं)";
    document.getElementById(btnId).style.background = "#00c853";
    document.getElementById(msgId).className = "msg";
    document.getElementById(msgId).innerText = `🎉 कैशआउट! ₹${win} जीत गए!`;
    document.getElementById(profitId).style.display = "none";
    return;
  }

  walletBal -= amt;
  updateBal();
  if(panelNo === 1) { 
    isPlaying1 = true; betAmt1 = amt; autoTarget1 = isNaN(target) ? 2.00 : target; 
  } else { 
    isPlaying2 = true; betAmt2 = amt; autoTarget2 = isNaN(target) ? 2.00 : target; 
  }
  
  document.getElementById(btnId).innerText = "WAITING...";
  document.getElementById(btnId).style.background = "#ff9800";
  document.getElementById(msgId).className = "msg";
  document.getElementById(msgId).innerText = "✅ बेट लग गई!";
}
</script>
</body>
</html>
