<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aviator - Thakur Sahab Mahakal Battle</title>
<style>
body {
background-color: #0b0f19;
color: #ffffff;
font-family: Arial, sans-serif;
text-align: center;
margin: 0;
padding: 10px;
user-select: none;
}
.container {
max-width: 420px;
margin: auto;
background: #131a26;
padding: 15px;
border-radius: 12px;
border: 2px solid #ff7b00;
box-shadow: 0 4px 20px rgba(255, 123, 0, 0.3);
position: relative;
}
.header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 10px;
}
.wallet-badge {
background: #00c853;
color: #000;
padding: 6px 12px;
border-radius: 6px;
font-weight: bold;
font-size: 14px;
}
.back-btn {
background: #ff5252;
color: #fff;
border: none;
padding: 6px 12px;
border-radius: 6px;
font-weight: bold;
cursor: pointer;
}
.multiplier-history {
display: flex;
gap: 5px;
overflow-x: auto;
padding: 5px 0;
margin-bottom: 10px;
}
.m-pill {
background: #1a2332;
border: 1px solid #ffab00;
color: #ffab00;
padding: 3px 8px;
border-radius: 4px;
font-size: 11px;
font-weight: bold;
white-space: nowrap;
}
.game-screen {
background: #1a1a24;
border: 2px solid #ff5252;
border-radius: 10px;
height: 180px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
margin-bottom: 15px;
position: relative;
overflow: hidden;
}
.plane-multiplier {
font-size: 38px;
font-weight: bold;
color: #fff;
}
.plane-status {
font-size: 13px;
color: #ff5252;
margin-top: 5px;
font-weight: bold;
}
.bet-card {
background: #1a2332;
border: 1px solid #334155;
border-radius: 8px;
padding: 10px;
margin-bottom: 10px;
text-align: left;
}
.bet-card label {
font-size: 11px;
color: #aaa;
}
.bet-input-box {
width: 100%;
padding: 8px;
margin: 5px 0;
background: #0b0f19;
border: 1px solid #444;
color: white;
border-radius: 5px;
text-align: center;
font-size: 14px;
box-sizing: border-box;
}
.quick-btns {
display: flex;
gap: 5px;
margin-bottom: 5px;
}
.q-btn {
flex: 1;
background: #222d3f;
border: 1px solid #555;
color: #fff;
padding: 4px;
font-size: 11px;
border-radius: 4px;
cursor: pointer;
}
.action-btn {
background: #00c853;
color: #fff;
border: none;
padding: 12px;
width: 100%;
border-radius: 6px;
font-size: 15px;
font-weight: bold;
cursor: pointer;
margin-top: 5px;
}
.action-btn.cashout {
background: #ffab00;
color: #000;
}
</style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <button class="back-btn" onclick="window.location.href='index.html'">⬅ Back</button>
        <div style="font-size: 18px; font-weight: bold; color: #ffab00;">Aviator</div>
        <div class="wallet-badge">₹<span id="aviator-balance">19</span></div>
    </div>

    <!-- Multiplier History Bar -->
    <div class="multiplier-history" id="history-bar">
        <div class="m-pill">2.20x</div>
        <div class="m-pill">1.45x</div>
        <div class="m-pill">3.10x</div>
        <div class="m-pill">1.12x</div>
        <div class="m-pill">5.50x</div>
    </div>

    <!-- Main Game Screen -->
    <div class="game-screen" id="screen-bg">
        <div class="plane-multiplier" id="multiplier-display">1.00x</div>
        <div class="plane-status" id="plane-status">🚀 Round Shuru Hone Wala Hai...</div>
    </div>

    <!-- Bet Panel 1 -->
    <div class="bet-card">
        <label>बेट राशि (रुपए):</label>
        <input type="number" id="bet-amt-1" class="bet-input-box" value="100" min="10">
        <div class="quick-btns">
            <button class="q-btn" onclick="setBet(1, 50)">50</button>
            <button class="q-btn" onclick="setBet(1, 100)">100</button>
            <button class="q-btn" onclick="setBet(1, 500)">500</button>
            <button class="q-btn" onclick="setBet(1, 1000)">1000</button>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 5px;">
            <label>ऑटो कैशआउट:</label>
            <input type="number" id="auto-cash-1" value="2.00" style="width: 70px; padding: 4px; background: #0b0f19; border: 1px solid #444; color: #fff; text-align: center; border-radius: 4px;" step="0.1">
        </div>
        <button id="bet-btn-1" class="action-btn" onclick="toggleBet(1)">BET (लगाएं)</button>
    </div>

    <!-- Bet Panel 2 -->
    <div class="bet-card">
        <label>बेट राशि (रुपए):</label>
        <input type="number" id="bet-amt-2" class="bet-input-box" value="100" min="10">
        <div class="quick-btns">
            <button class="q-btn" onclick="setBet(2, 50)">50</button>
            <button class="q-btn" onclick="setBet(2, 100)">100</button>
            <button class="q-btn" onclick="setBet(2, 500)">500</button>
            <button class="q-btn" onclick="setBet(2, 1000)">1000</button>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 5px;">
            <label>ऑटो कैशआउट:</label>
            <input type="number" id="auto-cash-2" value="2.00" style="width: 70px; padding: 4px; background: #0b0f19; border: 1px solid #444; color: #fff; text-align: center; border-radius: 4px;" step="0.1">
        </div>
        <button id="bet-btn-2" class="action-btn" onclick="toggleBet(2)">BET (लगाएं)</button>
    </div>
</div>

<script>
let walletBalance = 19;
let gameInterval = null;
let currentMultiplier = 1.00;
let crashPoint = 1.00;
let gameState = 'waiting'; // waiting, flying, crashed

let betPlaced1 = false;
let betPlaced2 = false;
let cashedOut1 = false;
let cashedOut2 = false;

window.onload = function() {
    let savedBal = localStorage.getItem('mahakal_master_wallet');
    if(savedBal !== null) {
        walletBalance = parseFloat(savedBal);
    }
    updateWalletUI();
    startWaitingPhase();
};

function updateWalletUI() {
    document.getElementById('aviator-balance').innerText = walletBalance.toFixed(2);
    localStorage.setItem('mahakal_master_wallet', walletBalance);
}

function setBet(panel, amt) {
    document.getElementById(`bet-amt-${panel}`).value = amt;
}

function toggleBet(panel) {
    let amtInput = document.getElementById(`bet-amt-${panel}`);
    let btn = document.getElementById(`bet-btn-${panel}`);
    let amt = parseFloat(amtInput.value);

    if (panel === 1) {
        if (!betPlaced1) {
            if (walletBalance < amt) { alert("पर्याप्त बैलेंस नहीं है!"); return; }
            walletBalance -= amt;
            updateWalletUI();
            betPlaced1 = true;
            btn.innerText = "CANCEL (रद्द کریں)";
            btn.style.background = "#ff5252";
        } else {
            walletBalance += amt;
            updateWalletUI();
            betPlaced1 = false;
            cashedOut1 = false;
            btn.innerText = "BET (लगाएं)";
            btn.style.background = "#00c853";
        }
    } else {
        if (!betPlaced2) {
            if (walletBalance < amt) { alert("पर्याप्त बैलेंस नहीं है!"); return; }
            walletBalance -= amt;
            updateWalletUI();
            betPlaced2 = true;
            btn.innerText = "CANCEL (रद्द करें)";
            btn.style.background = "#ff5252";
        } else {
            walletBalance += amt;
            updateWalletUI();
            betPlaced2 = false;
            cashedOut2 = false;
            btn.innerText = "BET (लगाएं)";
            btn.style.background = "#00c853";
        }
    }
}

function startWaitingPhase() {
    gameState = 'waiting';
    currentMultiplier = 1.00;
    document.getElementById('multiplier-display').innerText = "1.00x";
    document.getElementById('plane-status').innerText = "🚀 Agla Round Shuru Ho Raha Hai...";
    document.getElementById('plane-status').style.color = "#ffab00";
    document.getElementById('screen-bg').style.borderColor = "#ffab00";

    cashedOut1 = false;
    cashedOut2 = false;

    // Handle Active Bets state for next round
    if (betPlaced1) {
        document.getElementById('bet-btn-1').innerText = "WAITING...";
        document.getElementById('bet-btn-1').style.background = "#673ab7";
    }
    if (betPlaced2) {
        document.getElementById('bet-btn-2').innerText = "WAITING...";
        document.getElementById('bet-btn-2').style.background = "#673ab7";
    }

    setTimeout(startFlyingPhase, 3000);
}

function startFlyingPhase() {
    gameState = 'flying';
    currentMultiplier = 1.00;
    // Random crash point between 1.10x and 8.50x
    crashPoint = (Math.random() * 7.4 + 1.10).toFixed(2);

    if (betPlaced1) {
        document.getElementById('bet-btn-1').innerText = "CASHOUT";
        document.getElementById('bet-btn-1').className = "action-btn cashout";
    }
    if (betPlaced2) {
        document.getElementById('bet-btn-2').innerText = "CASHOUT";
        document.getElementById('bet-btn-2').className = "action-btn cashout";
    }

    document.getElementById('plane-status').innerText = "✈️ Plane Ud Raha Hai...";
    document.getElementById('plane-status').style.color = "#00e676";
    document.getElementById('screen-bg').style.borderColor = "#00e676";

    gameInterval = setInterval(() => {
        currentMultiplier += 0.03;
        document.getElementById('multiplier-display').innerText = currentMultiplier.toFixed(2) + "x";

        // Auto Cashout check Panel 1
        let auto1 = parseFloat(document.getElementById('auto-cash-1').value);
        if (betPlaced1 && !cashedOut1 && currentMultiplier >= auto1) {
            cashOut(1);
        }

        // Auto Cashout check Panel 2
        let auto2 = parseFloat(document.getElementById('auto-cash-2').value);
        if (betPlaced2 && !cashedOut2 && currentMultiplier >= auto2) {
            cashOut(2);
        }

        if (currentMultiplier >= parseFloat(crashPoint)) {
            clearInterval(gameInterval);
            crashPhase();
        }
    }, 100);
}

function cashOut(panel) {
    if (panel === 1 && betPlaced1 && !cashedOut1) {
        let amt = parseFloat(document.getElementById('bet-amt-1').value);
        let win = amt * currentMultiplier;
        walletBalance += win;
        updateWalletUI();
        cashedOut1 = true;
        let btn = document.getElementById('bet-btn-1');
        btn.innerText = `WON ₹${win.toFixed(0)}`;
        btn.style.background = "#00c853";
        btn.className = "action-btn";
    } else if (panel === 2 && betPlaced2 && !cashedOut2) {
        let amt = parseFloat(document.getElementById('bet-amt-2').value);
        let win = amt * currentMultiplier;
        walletBalance += win;
        updateWalletUI();
        cashedOut2 = true;
        let btn = document.getElementById('bet-btn-2');
        btn.innerText = `WON ₹${win.toFixed(0)}`;
        btn.style.background = "#00c853";
        btn.className = "action-btn";
    }
}

// Override button click during flight
document.getElementById('bet-btn-1').onclick = function() {
    if (gameState === 'flying' && betPlaced1 && !cashedOut1) {
        cashOut(1);
    } else {
        toggleBet(1);
    }
};

document.getElementById('bet-btn-2').onclick = function() {
    if (gameState === 'flying' && betPlaced2 && !cashedOut2) {
        cashOut(2);
    } else {
        toggleBet(2);
    }
};

function crashPhase() {
    gameState = 'crashed';
    document.getElementById('multiplier-display').innerText = crashPoint + "x";
    document.getElementById('plane-status').innerText = "💥 CRASHED! Plane Urr Gaya!";
    document.getElementById('plane-status').style.color = "#ff5252";
    document.getElementById('screen-bg').style.borderColor = "#ff5252";

    // If bet was placed but not cashed out, user loses
    if (betPlaced1 && !cashedOut1) {
        let btn = document.getElementById('bet-btn-1');
        btn.innerText = "LOST";
        btn.style.background = "#333";
        btn.className = "action-btn";
    }
    if (betPlaced2 && !cashedOut2) {
        let btn = document.getElementById('bet-btn-2');
        btn.innerText = "LOST";
        btn.style.background = "#333";
        btn.className = "action-btn";
    }

    addHistoryPill(crashPoint);

    // Reset bets for next round after delay
    setTimeout(() => {
        betPlaced1 = false;
        betPlaced2 = false;
        cashedOut1 = false;
        cashedOut2 = false;

        document.getElementById('bet-btn-1').innerText = "BET (लगाएं)";
        document.getElementById('bet-btn-1').style.background = "#00c853";
        document.getElementById('bet-btn-2').innerText = "BET (लगाएं)";
        document.getElementById('bet-btn-2').style.background = "#00c853";

        startWaitingPhase();
    }, 3000);
}

function addHistoryPill(val) {
    let bar = document.getElementById('history-bar');
    let pill = document.createElement('div');
    pill.className = 'm-pill';
    pill.innerText = val + "x";
    bar.prepend(pill);
    if (bar.children.length > 8) {
        bar.lastChild.remove();
    }
}
</script>
</body>
</html>
