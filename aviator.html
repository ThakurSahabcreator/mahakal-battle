<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>महाकाल Dual Aviator - Full Admin Control</title>
<style>
body {
background-color: #0b0f19;
color: #ffffff;
font-family: Arial, sans-serif;
text-align: center;
margin: 0;
padding: 10px;
-webkit-user-select: none;
user-select: none;
}
.container {
max-width: 420px;
margin: auto;
background: #131a26;
padding: 15px;
border-radius: 12px;
border: 2px solid #00e676;
box-shadow: 0 4px 20px rgba(0, 230, 118, 0.3);
position: relative;
}
h2 { color: #00e676; margin-top: 5px; font-size: 20px; }

.wallet-box {
background: linear-gradient(135deg, #1b2a4a, #0b1329);
padding: 10px;
border-radius: 8px;
margin-bottom: 10px;
border: 1px solid #00b0ff;
font-size: 16px;
font-weight: bold;
color: #00b0ff;
}

.game-screen {
width: 100%;
height: 200px;
background: #070a12;
border: 2px solid #334155;
border-radius: 8px;
position: relative;
overflow: hidden;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
margin-bottom: 10px;
}

.multiplier-display {
font-size: 38px;
font-weight: bold;
color: #00e676;
text-shadow: 0 0 10px rgba(0, 230, 118, 0.5);
z-index: 2;
}

.timer-display {
font-size: 22px;
color: #ffab00;
font-weight: bold;
margin-top: 5px;
}

.plane-icon {
position: absolute;
font-size: 32px;
transition: transform 0.1s linear;
display: none;
z-index: 1;
}

/* Dual Bet Panels */
.dual-controls {
display: flex;
gap: 8px;
margin-bottom: 10px;
}

.bet-panel {
flex: 1;
background: #1b2230;
padding: 10px;
border-radius: 8px;
border: 1px solid #475569;
text-align: left;
}

.bet-panel h4 {
margin: 0 0 5px 0;
color: #ffab00;
font-size: 13px;
text-align: center;
}

.bet-panel input {
width: 90%;
padding: 6px;
margin: 4px 0;
background: #0b0f19;
border: 1px solid #64748b;
color: white;
border-radius: 4px;
text-align: center;
font-size: 14px;
}

.live-win-text {
font-size: 12px;
color: #ffeb3b;
font-weight: bold;
margin-top: 4px;
min-height: 18px;
text-align: center;
}

.btn {
background: linear-gradient(to right, #00c853, #64dd17);
color: white;
border: none;
padding: 8px;
width: 100%;
border-radius: 5px;
font-size: 13px;
font-weight: bold;
cursor: pointer;
margin-top: 5px;
}
.btn:hover { opacity: 0.9; }

.btn-cashout {
background: linear-gradient(to right, #ff9100, #ff3d00);
}

.btn-back {
background: #475569;
margin-top: 10px;
width: 100%;
padding: 10px;
font-size: 14px;
}

/* Secret Admin Box */
.secret-admin-box {
background: #2a1010;
border: 1px solid #ff5252;
padding: 8px;
border-radius: 8px;
margin-top: 10px;
text-align: left;
font-size: 12px;
color: #ff8a80;
font-weight: bold;
}

.admin-setting-box {
background: #1e1b2e;
border: 1px dashed #ab47bc;
padding: 8px;
border-radius: 8px;
margin-top: 8px;
text-align: left;
font-size: 11px;
color: #e1bee7;
}
.admin-setting-box input {
width: 50px;
padding: 4px;
background: #0b0f19;
color: #00e676;
border: 1px solid #ab47bc;
font-weight: bold;
display: inline-block;
margin: 2px;
}

.msg { color: #00e676; font-size: 13px; margin-top: 5px; font-weight: bold; }
.error { color: #ff5252; font-size: 13px; margin-top: 5px; font-weight: bold; }
</style>
</head>
<body>

<div class="container">
<h2>✈️ महाकाल Dual Aviator बैटल</h2>

<div class="wallet-box">
💰 वॉलेट बैलेंस: ₹<span id="aviator-balance">5000</span>
</div>

<div class="game-screen" id="game-screen">
<div class="multiplier-display" id="multiplier-text" style="display:none;">1.00x</div>
<div class="timer-display" id="timer-box">बेटिंग टाइम: <span id="countdown">10</span>s</div>
<div class="plane-icon" id="plane">🚀</div>
</div>

<!-- Dual Bet Panels -->
<div class="dual-controls">
    <div class="bet-panel">
        <h4>बेट 1</h4>
        <input type="number" id="bet1-amount" value="50" min="5" max="50000">
        <button class="btn" id="action-btn-1" onclick="handleBet(1)">बेट लगाएं</button>
        <div class="live-win-text" id="live-win-1"></div>
    </div>
    <div class="bet-panel">
        <h4>बेट 2</h4>
        <input type="number" id="bet2-amount" value="100" min="5" max="50000">
        <button class="btn" id="action-btn-2" onclick="handleBet(2)">बेट लगाएं</button>
        <div class="live-win-text" id="live-win-2"></div>
    </div>
</div>

<div id="result-msg" style="min-height: 20px;"></div>

<!-- 👑 एडमिन मास्टर कंट्रोल पैनल -->
<div class="admin-setting-box">
<b>👑 एडमिन मास्टर कंट्रोल:</b><br>
1. बेट टाइम (सेकंड): <input type="number" id="admin-bet-time" value="10"> <br>
2. क्रैश पॉइंट (x): <input type="number" id="admin-crash-point" value="2.50" step="0.1"> <br>
3. स्पीड (मिलीसेकंड): <input type="number" id="admin-speed" value="70" title="कम करने पर प्लेन तेज़ भागेगा">
</div>

<!-- 🔒 एडमिन लाइव स्टेटस -->
<div class="secret-admin-box" id="secret-preview">
    🔐 [Live Status]: कुल बेट राशि: ₹<span id="admin-total-bet">0</span> | स्थिति: <span id="admin-game-status">बेटिंग चल रही है...</span>
</div>

<button class="btn btn-back" onclick="window.location.href='index.html'">🏠 मुख्य डैशबोर्ड पर वापस जाएं</button>
</div>

<script>
let balance = 5000;
let multiplier = 1.00;
let gameInterval = null;
let timerInterval = null;
let gameState = "WAITING"; // WAITING, RUNNING, CRASHED
let crashPoint = 2.50;
let timeLeft = 10;

let bets = {
    1: { placed: false, amount: 0, cashedOut: false },
    2: { placed: false, amount: 0, cashedOut: false }
};

function updateWalletDisplay() {
    document.getElementById('aviator-balance').innerText = balance;
}

function updateAdminStats() {
    let total = (bets[1].placed ? bets[1].amount : 0) + (bets[2].placed ? bets[2].amount : 0);
    document.getElementById('admin-total-bet').innerText = total;
}

// बेट लगाने या कैश आउट करने का मुख्य फंक्शन
function handleBet(panelId) {
    let betInputId = panelId === 1 ? 'bet1-amount' : 'bet2-amount';
    let btnId = panelId === 1 ? 'action-btn-1' : 'action-btn-2';
    let winTextId = panelId === 1 ? 'live-win-1' : 'live-win-2';
    let betInput = parseInt(document.getElementById(betInputId).value);

    if (gameState === "WAITING") {
        // जब तक टाइमर चल रहा है, यूज़र पैसे लगा या हटा सकता है
        if (!bets[panelId].placed) {
            if (isNaN(betInput) || betInput < 5) {
                alert("❌ न्यूनतम ₹5 या अधिक की बाजी दर्ज करें!");
                return;
            }
            if (balance < betInput) {
                alert("❌ वॉलेट में पर्याप्त बैलेंस नहीं है!");
                return;
            }

            bets[panelId].amount = betInput;
            bets[panelId].placed = true;
            balance -= betInput;
            updateWalletDisplay();
            updateAdminStats();

            document.getElementById(betInputId).disabled = true;
            let btn = document.getElementById(btnId);
            btn.innerText = "रद्द करें (Cancel)";
            btn.className = "btn btn-cashout";
            document.getElementById(winTextId).innerText = `लगाए: ₹${betInput}`;
        } else {
            // बेट वापस लेना
            balance += bets[panelId].amount;
            bets[panelId].placed = false;
            updateWalletDisplay();
            updateAdminStats();

            document.getElementById(betInputId).disabled = false;
            let btn = document.getElementById(btnId);
            btn.innerText = "बेट लगाएं";
            btn.className = "btn";
            document.getElementById(winTextId).innerText = "रद्द कर दिया";
        }

    } else if (gameState === "RUNNING") {
        // जब प्लेन उड़ रहा हो, तब 'Cash Out' करें
        if (bets[panelId].placed && !bets[panelId].cashedOut) {
            let winAmt = Math.floor(bets[panelId].amount * multiplier);
            balance += winAmt;
            updateWalletDisplay();

            bets[panelId].cashedOut = true;
            let btn = document.getElementById(btnId);
            btn.innerText = "जीता ✅";
            btn.className = "btn";
            document.getElementById(winTextId).innerText = `जीत: ₹${winAmt}`;

            let resDiv = document.getElementById('result-msg');
            resDiv.className = "msg";
            resDiv.innerText = `🎉 Bet ${panelId} Cash Out! जीता: ₹${winAmt} (${multiplier.toFixed(2)}x)`;
        }
    }
}

// 1. बेटिंग टाइमर शुरू करने का फंक्शन (आप एडमिन बॉक्स से सेकंड सेट कर सकते हैं)
function startCountdown() {
    gameState = "WAITING";
    document.getElementById('admin-game-status').innerText = "बेटिंग चल रही है (टाइम चालू है)";
    
    // एडमिन द्वारा बॉक्स में सेट किया गया टाइम यहाँ लिया जाएगा
    timeLeft = parseInt(document.getElementById('admin-bet-time').value) || 10;
    
    document.getElementById('multiplier-text').style.display = "none";
    document.getElementById('timer-box').style.display = "block";
    document.getElementById('plane').style.display = "none";
    document.getElementById('result-msg').innerText = "";

    // दोनों पैनल रीसेट
    [1, 2].forEach(id => {
        bets[id].placed = false;
        bets[id].cashedOut = false;
        document.getElementById(`bet${id}-amount`).disabled = false;
        let btn = document.getElementById(`action-btn-${id}`);
        btn.innerText = "बेट लगाएं";
        btn.className = "btn";
        document.getElementById(`live-win-${id}`).innerText = "";
    });

    updateAdminStats();

    timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('countdown').innerText = timeLeft;

        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            startFlightGame();
        }
    }, 1000);
}

// 2. प्लेन उड़ान भरने का फंक्शन (अब फ्लाइट के दौरान भी क्रैश पॉइंट बदला जा सकता है)
function startFlightGame() {
    gameState = "RUNNING";
    multiplier = 1.00;
    document.getElementById('admin-game-status').innerText = "प्लेन उड़ रहा है ✈️";

    document.getElementById('timer-box').style.display = "none";
    document.getElementById('multiplier-text').style.display = "block";
    document.getElementById('plane').style.display = "block";
    document.getElementById('plane').style.transform = "translate(-40px, 20px) rotate(-15deg)";

    // उड़ान शुरू होते ही एडमिन बॉक्स से क्रैश पॉइंट और स्पीड ले ली जाएगी
    crashPoint = parseFloat(document.getElementById('admin-crash-point').value) || 2.50;
    let speed = parseInt(document.getElementById('admin-speed').value) || 70;

    [1, 2].forEach(id => {
        let btn = document.getElementById(`action-btn-${id}`);
        if (bets[id].placed) {
            btn.innerText = "Cash Out";
            btn.className = "btn btn-cashout";
        } else {
            btn.disabled = true;
            btn.innerText = "मिस हो गया";
            btn.className = "btn";
        }
    });

    gameInterval = setInterval(() => {
        multiplier += 0.02;
        document.getElementById('multiplier-text').innerText = multiplier.toFixed(2) + "x";

        // हर बार चेक करें कि क्या एडमिन ने चलते गेम में क्रैश पॉइंट बदल दिया है?
        let liveAdminCrash = parseFloat(document.getElementById('admin-crash-point').value);
        if(!isNaN(liveAdminCrash)) {
            crashPoint = liveAdminCrash;
        }

        [1, 2].forEach(id => {
            if (bets[id].placed && !bets[id].cashedOut) {
                let liveW = Math.floor(bets[id].amount * multiplier);
                document.getElementById(`live-win-${id}`).innerText = `₹${liveW}`;
            }
        });

        let xPos = (multiplier - 1) * 25 - 30;
        let yPos = 20 - (multiplier - 1) * 12;
        if(xPos > 100) xPos = 100;
        if(yPos < -40) yPos = -40;
        document.getElementById('plane').style.transform = `translate(${xPos}px, ${yPos}px) rotate(-20deg)`;

        if (multiplier >= crashPoint) {
            clearInterval(gameInterval);
            triggerCrash();
        }
    }, speed);
}

// 3. क्रैश होने पर एक्शन
function triggerCrash() {
    gameState = "CRASHED";
    document.getElementById('plane').style.display = "none";
    document.getElementById('admin-game-status').innerText = `क्रैश हो गया! (${crashPoint.toFixed(2)}x)`;

    [1, 2].forEach(id => {
        if (bets[id].placed && !bets[id].cashedOut) {
            document.getElementById(`live-win-${id}`).innerText = "हार गए ❌";
        }
        let btn = document.getElementById(`action-btn-${id}`);
        btn.disabled = false;
        btn.innerText = "अगला राउंड...";
        btn.className = "btn";
    });

    let resDiv = document.getElementById('result-msg');
    resDiv.className = "error";
    resDiv.innerText = `💥 क्रैश हो गया! प्लेन ${crashPoint.toFixed(2)}x पर उड़ गया।`;

    // 4 सेकंड बाद नया टाइमर शुरू होगा
    setTimeout(startCountdown, 4000);
}

updateWalletDisplay();
startCountdown(); // ऑटो-स्टार्ट
</script>

</body>
</html>
