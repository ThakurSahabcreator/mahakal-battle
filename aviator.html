<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>महाकाल Aviator - प्लेन क्रैश बैटल</title>
<style>
body {
background-color: #0b0f19;
color: #ffffff;
font-family: Arial, sans-serif;
text-align: center;
margin: 0;
padding: 15px;
-webkit-user-select: none;
user-select: none;
}
.container {
max-width: 400px;
margin: auto;
background: #131a26;
padding: 20px;
border-radius: 12px;
border: 2px solid #00e676;
box-shadow: 0 4px 20px rgba(0, 230, 118, 0.3);
position: relative;
}
h2 { color: #00e676; margin-top: 5px; }

.wallet-box {
background: linear-gradient(135deg, #1b2a4a, #0b1329);
padding: 12px;
border-radius: 8px;
margin-bottom: 15px;
border: 1px solid #00b0ff;
font-size: 18px;
font-weight: bold;
color: #00b0ff;
}

.game-screen {
width: 100%;
height: 230px;
background: #070a12;
border: 2px solid #334155;
border-radius: 8px;
position: relative;
overflow: hidden;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
margin-bottom: 15px;
}

.multiplier-display {
font-size: 40px;
font-weight: bold;
color: #00e676;
text-shadow: 0 0 10px rgba(0, 230, 118, 0.5);
z-index: 2;
}

/* Yahan live winning amount badalte hue dikhega */
.live-win-box {
font-size: 22px;
font-weight: bold;
color: #ffeb3b;
background: rgba(0, 0, 0, 0.5);
padding: 4px 15px;
border-radius: 15px;
margin-top: 8px;
z-index: 2;
border: 1px solid #ffeb3b;
display: none;
}

.plane-icon {
position: absolute;
font-size: 35px;
transition: transform 0.1s linear;
display: none;
z-index: 1;
}

.controls-box {
background: #1b2230;
padding: 15px;
border-radius: 8px;
border: 1px solid #475569;
}

input {
width: 90%;
padding: 10px;
margin: 8px 0;
background: #0b0f19;
border: 1px solid #64748b;
color: white;
border-radius: 5px;
text-align: center;
font-size: 16px;
}

.btn {
background: linear-gradient(to right, #00c853, #64dd17);
color: white;
border: none;
padding: 12px;
width: 100%;
border-radius: 6px;
font-size: 16px;
font-weight: bold;
cursor: pointer;
margin-top: 8px;
}
.btn:hover { opacity: 0.9; }

.btn-cashout {
background: linear-gradient(to right, #ff9100, #ff3d00);
display: none;
}

.btn-back {
background: #475569;
margin-top: 15px;
}

.admin-setting-box {
background: #1e1b2e;
border: 1px dashed #ab47bc;
padding: 10px;
border-radius: 8px;
margin-top: 15px;
text-align: left;
font-size: 13px;
color: #e1bee7;
}
.admin-setting-box input {
width: 70px;
padding: 5px;
background: #0b0f19;
color: #00e676;
border: 1px solid #ab47bc;
font-weight: bold;
display: inline-block;
margin: 0 5px;
}

.msg { color: #00e676; font-size: 15px; margin-top: 10px; font-weight: bold; }
.error { color: #ff5252; font-size: 15px; margin-top: 10px; font-weight: bold; }
</style>
</head>
<body>

<div class="container">
<h2>✈️ महाकाल Aviator बैटल</h2>

<div class="wallet-box">
💰 वॉलेट बैलेंस: ₹<span id="aviator-balance">100</span>
</div>

<div class="game-screen" id="game-screen">
<div class="multiplier-display" id="multiplier-text">1.00x</div>
<div class="live-win-box" id="live-win-box">Winning: ₹10</div>
<div class="plane-icon" id="plane">🚀</div>
</div>

<div class="controls-box" id="controls-box">
<p style="font-size: 13px; color: #94a3b8; margin: 0 0 5px 0;">अपनी बाजी (₹5 या अधिक) दर्ज करें:</p>
<input type="number" id="bet-amount" value="10" min="5" placeholder="बाजी राशि (उदा. 10, 50)">

<button class="btn" id="action-btn" onclick="placeBetAndStart()">प्लेन उड़ाएं (Place Bet)</button>
</div>

<div id="result-msg" style="min-height: 25px;"></div>

<div class="admin-setting-box">
<b>👑 एडमिन कंट्रोल (Multiplier Limit):</b><br>
कम से कम: <input type="number" id="min-limit" value="1.2">x &nbsp; 
अधिकतम: <input type="number" id="max-limit" value="50">x
<p style="font-size: 11px; color: #b388ff; margin: 5px 0 0 0;">(छोटी बेट पर प्लेन ऊपर जाएगा, बड़ी बेट पर ऑटोमैटिक क्रैश होगा)</p>
</div>

<button class="btn btn-back" onclick="window.location.href='index.html'">🏠 मुख्य डैशबोर्ड पर वापस जाएं</button>
</div>

<script>
let balance = 100;
let currentBet = 10;
let multiplier = 1.00;
let gameInterval = null;
let isPlaying = false;
let crashPoint = 1.00;

function updateWalletDisplay() {
document.getElementById('aviator-balance').innerText = balance;
}

function placeBetAndStart() {
let betInput = parseInt(document.getElementById('bet-amount').value);
if (isNaN(betInput) || betInput < 5) {
alert("❌ कृपया न्यूनतम ₹5 या उससे अधिक की बाजी दर्ज करें!");
return;
}
if (balance < betInput) {
alert("❌ आपके वॉलेट में पर्याप्त बैलेंस नहीं है!");
return;
}

currentBet = betInput;
balance -= currentBet;
updateWalletDisplay();

document.getElementById('bet-amount').disabled = true;
let actionBtn = document.getElementById('action-btn');
actionBtn.innerText = "Cash Out";
actionBtn.className = "btn btn-cashout";
actionBtn.setAttribute("onclick", "cashOut()");

document.getElementById('result-msg').innerText = "";
document.getElementById('plane').style.display = "block";
document.getElementById('live-win-box').style.display = "block";
document.getElementById('plane').style.transform = "translate(-50px, 20px) rotate(-15deg)";

multiplier = 1.00;
isPlaying = true;

let userMin = parseFloat(document.getElementById('min-limit').value) || 1.2;
let userMax = parseFloat(document.getElementById('max-limit').value) || 50;

let speed = 90;

// ⚡ स्मार्ट ऑटोमैटिक बेट कंट्रोल सिस्टम
if (currentBet >= 40) {
    speed = 25; 
    crashPoint = parseFloat((Math.random() * 0.15 + 1.02).toFixed(2)); 
} else if (currentBet >= 20) {
    speed = 50;
    crashPoint = parseFloat((Math.random() * 0.8 + 1.1).toFixed(2));
} else {
    speed = 100; 
    crashPoint = parseFloat((Math.random() * (userMax - 2) + 2).toFixed(2));
}

gameInterval = setInterval(() => {
multiplier += 0.01;
document.getElementById('multiplier-text').innerText = multiplier.toFixed(2) + "x";

// Live winning calculation & display
let currentWin = Math.floor(currentBet * multiplier);
document.getElementById('live-win-box').innerText = `Winning: ₹${currentWin}`;

let xPos = (multiplier - 1) * 30 - 30;
let yPos = 20 - (multiplier - 1) * 15;
if(xPos > 120) xPos = 120;
if(yPos < -50) yPos = -50;
document.getElementById('plane').style.transform = `translate(${xPos}px, ${yPos}px) rotate(-20deg)`;

if (multiplier >= crashPoint) {
clearInterval(gameInterval);
planeCrashed();
}
}, speed);
}

function cashOut() {
if (!isPlaying) return;
clearInterval(gameInterval);
isPlaying = false;

let winAmount = Math.floor(currentBet * multiplier);
balance += winAmount;
updateWalletDisplay();

let actionBtn = document.getElementById('action-btn');
actionBtn.innerText = "प्लेन उड़ाएं (Place Bet)";
actionBtn.className = "btn";
actionBtn.setAttribute("onclick", "placeBetAndStart()");
document.getElementById('bet-amount').disabled = false;
document.getElementById('plane').style.display = "none";
document.getElementById('live-win-box').style.display = "none";

let resDiv = document.getElementById('result-msg');
resDiv.className = "msg";
resDiv.innerText = `🎉 शानदार! आपने समय पर Cash Out कर लिया। जीत: ₹${winAmount} (${multiplier.toFixed(2)}x)`;
}

function planeCrashed() {
isPlaying = false;
document.getElementById('plane').style.display = "none";
document.getElementById('live-win-box').style.display = "none";

let actionBtn = document.getElementById('action-btn');
actionBtn.innerText = "प्लेन उड़ाएं (Place Bet)";
actionBtn.className = "btn";
actionBtn.setAttribute("onclick", "placeBetAndStart()");
document.getElementById('bet-amount').disabled = false;

let resDiv = document.getElementById('result-msg');
resDiv.className = "error";
resDiv.innerText = `💥 क्रैश हो गया! प्लेन ${crashPoint.toFixed(2)}x पर उड़ गया। आप बाजी हार गए।`;
}

updateWalletDisplay();
</script>

</body>
</html>
