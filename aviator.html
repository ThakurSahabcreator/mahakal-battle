<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aviator</title>
<!-- Firebase SDKs for Realtime Server Sync across all phones -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
body {
  background-color: #0b0f19;
  color: #ffffff;
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 5px;
  user-select: none;
}
.container {
  max-width: 400px;
  margin: auto;
  background: #131a26;
  padding: 10px;
  border-radius: 10px;
  border: 2px solid #00b4d8;
  position: relative;
}
.header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
h2 { color: #ff5252; margin: 0; font-size: 22px; font-style: italic; cursor: pointer; }
.wallet-badge {
  background: #00c853;
  color: #000;
  padding: 5px 12px;
  border-radius: 6px;
  font-weight: bold;
  font-size: 14px;
}
.dep-btn {
  background: #00c853;
  color: #000;
  border: none;
  padding: 6px 12px;
  border-radius: 5px;
  font-weight: bold;
  cursor: pointer;
}
.history-bar {
  display: flex;
  gap: 5px;
  overflow-x: auto;
  margin-bottom: 8px;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.history-bar::-webkit-scrollbar { display: none; }
.hist-pill {
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: bold;
  white-space: nowrap;
}
.pill-blue { background: #1a2332; border: 1px solid #00b4d8; color: #00b4d8; }
.pill-red { background: #3a1111; border: 1px solid #ff5252; color: #ff5252; }

.game-box {
  height: 170px;
  background: radial-gradient(circle, #221015 0%, #05070c 100%);
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 1px solid #ff5252;
  margin-bottom: 8px;
  position: relative;
  overflow: hidden;
}
.plane-icon {
  font-size: 32px;
  animation: flyPlane 1.5s infinite alternate ease-in-out;
  margin-bottom: 2px;
}
@keyframes flyPlane {
  0% { transform: translateY(0px) rotate(-5deg); }
  100% { transform: translateY(-8px) rotate(5deg); }
}
.plane-mult {
  font-size: 40px;
  font-weight: bold;
  color: #ffffff;
}
.plane-status {
  font-size: 13px;
  color: #ffab00;
  margin-top: 4px;
  font-weight: bold;
}
.bet-card {
  background: #1a2332;
  border: 1px solid #334155;
  border-radius: 8px;
  padding: 8px;
  margin-bottom: 8px;
  text-align: left;
}
.amt-row {
  display: flex;
  gap: 4px;
  margin-top: 5px;
}
.quick-btn {
  background: #0b0f19;
  color: #fff;
  border: 1px solid #444;
  flex: 1;
  padding: 4px;
  border-radius: 4px;
  font-size: 11px;
  cursor: pointer;
}
input {
  width: 100%;
  padding: 8px;
  background: #0b0f19;
  border: 1px solid #444;
  color: white;
  border-radius: 5px;
  text-align: center;
  font-size: 14px;
  box-sizing: border-box;
  margin-top: 4px;
}
.big-bet-btn {
  background: #00c853;
  color: #000;
  border: none;
  padding: 10px;
  width: 100%;
  border-radius: 6px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 6px;
}
.admin-inline-box {
  background: #2a1a1a;
  border: 2px solid #ff5252;
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 10px;
  text-align: left;
  display: none;
}
.msg { color: #00e676; font-size: 12px; margin-top: 4px; font-weight: bold; text-align: center; }
.error { color: #ff5252; font-size: 12px; margin-top: 4px; font-weight: bold; text-align: center; }
.live-profit { color: #00e676; font-size: 13px; font-weight: bold; margin-top: 5px; text-align: center; background: #051a0e; padding: 4px; border-radius: 4px; border: 1px solid #00c853; display: none; }
.auto-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 6px;
  font-size: 12px;
  color: #00b4d8;
}
.auto-row input {
  width: 70px;
  padding: 4px;
  font-size: 12px;
}
.live-bets-box {
  background: #161f2e;
  border: 1px solid #334155;
  border-radius: 8px;
  padding: 8px;
  margin-bottom: 8px;
  max-height: 180px;
  overflow-y: auto;
  text-align: left;
  font-size: 11px;
}
.live-bet-item {
  display: flex;
  justify-content: space-between;
  padding: 4px 2px;
  border-bottom: 1px solid #1f293d;
}
.live-bet-item span { color: #aaa; }
.live-bet-item .u-name { color: #fff; font-weight: bold; }
.live-bet-item .u-amt { color: #00b4d8; }
.live-bet-item .u-win { color: #00e676; font-weight: bold; }
</style>
</head>
<body>

<div class="container">
  <div class="header-row">
    <h2 id="game-title" onclick="checkSecretTap()">Aviator</h2>
    <div>
      <span class="wallet-badge">₹<span id="av-bal">90398</span></span>
      <button class="dep-btn" onclick="window.location.href='index.html'">Deposit</button>
    </div>
  </div>

  <!-- ADMIN CONTROL PANEL (Password: 78699) -->
  <div id="aviator-admin-box" class="admin-inline-box">
    <b style="color: #ff5252; font-size: 13px;">👑 एडमिन कंट्रोल & रियल यूजर्स मॉनिटर:</b>
    <div style="margin-top: 6px; font-size: 12px; color: #ffab00;">इस राउंड में खेल रहे रियल यूजर्स: <span id="admin-real-count" style="color:#00e676; font-weight:bold;">0</span></div>
    <input type="number" id="adm-crash-val" placeholder="उदा. 2.00 (क्रैश पॉइंट)" step="0.1" min="1.1" style="padding: 6px; font-size: 13px; margin-top: 5px;">
    <div style="display: flex; gap: 5px; margin-top: 5px;">
      <button class="big-bet-btn" style="padding: 6px; background: #00e676; color: #000; font-size: 12px; margin-top: 0;" onclick="saveAdminCrash()">सर्वर पर लॉक करें</button>
      <button class="big-bet-btn" style="padding: 6px; background: #555; color: #fff; font-size: 12px; margin-top: 0;" onclick="closeAviatorAdmin()">बंद</button>
    </div>
    <div id="adm-status-msg" style="color: #00e676; font-size: 11px; margin-top: 3px; font-weight: bold;"></div>
  </div>

  <!-- Dynamic Multiplier History Bar -->
  <div class="history-bar" id="history-bar">
    <div class="hist-pill pill-blue">2.03x</div>
    <div class="hist-pill pill-red">4.39x</div>
    <div class="hist-pill pill-red">3.73x</div>
    <div class="hist-pill pill-blue">1.18x</div>
    <div class="hist-pill pill-blue">1.12x</div>
    <div class="hist-pill pill-red">41.89x</div>
  </div>

  <!-- Game Screen -->
  <div class="game-box">
    <div class="plane-icon" id="plane-graphic">✈️</div>
    <div class="plane-mult" id="av-mult">1.00x</div>
    <div class="plane-status" id="av-stat">बेटिंग का समय: 15 सेकण्ड</div>
  </div>

  <!-- Bet Panel 1 -->
  <div class="bet-card">
    <label style="font-size: 11px; color: #aaa;">बेट राशि (रुपए):</label>
    <input type="number" id="bet-input-1" value="500" min="10">
    <div class="amt-row">
      <button class="quick-btn" onclick="setAmt(100)">100</button>
      <button class="quick-btn" onclick="setAmt(200)">200</button>
      <button class="quick-btn" onclick="setAmt(500)">500</button>
      <button class="quick-btn" onclick="setAmt(1000)">1,000</button>
    </div>
    <div class="auto-row">
      <span>ऑटो कैशआउट (Auto x):</span>
      <input type="number" id="auto-val-1" value="2.00" step="0.1" min="1.1">
    </div>
    <button class="big-bet-btn" id="action-btn-1" onclick="handleBet(1)">BET (लगाएं)</button>
    <div id="live-profit-1" class="live-profit">लाइव जीत: ₹0</div>
    <div id="msg-1"></div>
  </div>

  <!-- Bet Panel 2 -->
  <div class="bet-card">
    <label style="font-size: 11px; color: #aaa;">बेट राशि (रुपए):</label>
    <input type="number" id="bet-input-2" value="500" min="10">
    <div class="amt-row">
      <button class="quick-btn" onclick="setAmt2(100)">100</button>
      <button class="quick-btn" onclick="setAmt2(200)">200</button>
      <button class="quick-btn" onclick="setAmt2(500)">500</button>
      <button class="quick-btn" onclick="setAmt2(1000)">1,000</button>
    </div>
    <div class="auto-row">
      <span>ऑटो कैशआउट (Auto x):</span>
      <input type="number" id="auto-val-2" value="2.00" step="0.1" min="1.1">
    </div>
    <button class="big-bet-btn" id="action-btn-2" onclick="handleBet(2)">BET (लगाएं)</button>
    <div id="live-profit-2" class="live-profit">लाइव जीत: ₹0</div>
    <div id="msg-2"></div>
  </div>

  <!-- Live Users Bets & Cashout List -->
  <div class="live-bets-box" id="live-bets-container">
    <div style="font-weight: bold; color: #00b4d8; margin-bottom: 4px; border-bottom: 1px solid #334155; padding-bottom: 2px; position: sticky; top: 0; background: #161f2e; z-index: 2;">🟢 लाइव प्लेयर्स (Bets & Cashouts)</div>
    <div id="live-bets-list"></div>
  </div>

  <button class="big-bet-btn" style="background: #333; color: #fff; margin-top: 5px;" onclick="window.location.href='index.html'">मुख्य होमपेज पर वापस जाएं</button>
</div>

<script>
// --- FIREBASE CONFIGURATION ---
const firebaseConfig = {
  databaseURL: "https://aviatorapp-9b1a6-default-rtdb.firebaseio.com/"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let walletBal = 90398;
let currentMult = 1.00;
let crashAt = 2.00;
let forcedCrash = null;
let gameInterval = null;
let timerInterval = null;
let gameState = "BETTING";
let timeLeft = 15;

let isPlaying1 = false, isPlaying2 = false;
let betAmt1 = 0, betAmt2 = 0;
let autoTarget1 = 2.00, autoTarget2 = 2.00;

let historyList = [2.03, 4.39, 3.73, 1.18, 1.12, 41.89];

// Unique ID for current player stored in localStorage so it stays persistent
let myUserId = localStorage.getItem('aviator_real_user_id');
if(!myUserId) {
  myUserId = "Player_" + Math.floor(Math.random() * 90000 + 10000);
  localStorage.setItem('aviator_real_user_id', myUserId);
}

// 7-Tap Secret Counter for Admin Panel
let tapCount = 0;
let tapTimer = null;

window.onload = function() {
  let saved = localStorage.getItem('mahakal_master_wallet');
  if(saved !== null) walletBal = parseFloat(saved);
  document.getElementById('av-bal').innerText = walletBal;
  renderHistory();
  startBettingTimer();

  // Listen to Server Realtime Updates for Crash Point
  db.ref("aviatorServer/crashPoint").on("value", (snapshot) => {
    let val = snapshot.val();
    if(val !== null) {
      forcedCrash = parseFloat(val);
    }
  });

  // Listen to Realtime Live Bets from Firebase across all users
  db.ref("aviatorServer/liveBets").on("value", (snapshot) => {
    let data = snapshot.val();
    renderLiveBetsList(data);
  });
};

function updateBal() {
  document.getElementById('av-bal').innerText = walletBal;
  localStorage.setItem('mahakal_master_wallet', walletBal);
}

function setAmt(v) { document.getElementById('bet-input-1').value = v; }
function setAmt2(v) { document.getElementById('bet-input-2').value = v; }

function checkSecretTap() {
  tapCount++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { tapCount = 0; }, 1200);

  if(tapCount >= 7) {
    tapCount = 0;
    openAdminPanel();
  }
}

function renderHistory() {
  let bar = document.getElementById('history-bar');
  bar.innerHTML = "";
  historyList.forEach(item => {
    let div = document.createElement('div');
    div.className = item >= 2.00 ? "hist-pill pill-red" : "hist-pill pill-blue";
    div.innerText = item.toFixed(2) + "x";
    bar.appendChild(div);
  });
}

function startBettingTimer() {
  gameState = "BETTING";
  timeLeft = 15;
  currentMult = 1.00;
  isPlaying1 = false;
  isPlaying2 = false;

  document.getElementById('av-mult').innerText = "1.00x";
  document.getElementById('av-mult').style.color = "#fff";
  document.getElementById('plane-graphic').style.display = "block";
  document.getElementById('plane-graphic').innerText = "✈️";

  document.getElementById('action-btn-1').innerText = "BET (लगाएं)";
  document.getElementById('action-btn-1').style.background = "#00c853";
  document.getElementById('live-profit-1').style.display = "none";
  document.getElementById('msg-1').innerText = "";

  document.getElementById('action-btn-2').innerText = "BET (लगाएं)";
  document.getElementById('action-btn-2').style.background = "#00c853";
  document.getElementById('live-profit-2').style.display = "none";
  document.getElementById('msg-2').innerText = "";

  // Clear previous round real bets on server if betting starts
  db.ref("aviatorServer/liveBets").set({});
  generateFakeLiveBets();

  if(timerInterval) clearInterval(timerInterval);

  timerInterval = setInterval(() => {
    if(timeLeft > 0) {
      document.getElementById('av-stat').innerText = `⏱️ अगला राउंड शुरू होने में: ${timeLeft} सेकण्ड`;
      timeLeft--;
    } else {
      clearInterval(timerInterval);
      startFlight();
    }
  }, 1000);
}

function startFlight() {
  gameState = "FLYING";
  if(forcedCrash !== null) {
    crashAt = forcedCrash;
    forcedCrash = null;
  } else {
    crashAt = parseFloat((Math.random() * 3.5 + 1.2).toFixed(2));
  }

  document.getElementById('av-stat').innerText = "✈️ प्लेन उड़ रहा है...";

  if(gameInterval) clearInterval(gameInterval);

  gameInterval = setInterval(() => {
    currentMult += 0.03;
    let mStr = currentMult.toFixed(2) + "x";
    document.getElementById('av-mult').innerText = mStr;

    updateFakeLiveCashouts(currentMult);

    if(isPlaying1) {
      let p1 = Math.floor(betAmt1 * currentMult);
      document.getElementById('live-profit-1').style.display = "block";
      document.getElementById('live-profit-1').innerText = `📈 लाइव जीत: ₹${p1}`;
      document.getElementById('action-btn-1').innerText = `CASHOUT (₹${p1})`;
      document.getElementById('action-btn-1').style.background = "#ff5252";

      if(currentMult >= autoTarget1) {
        walletBal += p1;
        updateBal();
        isPlaying1 = false;
        document.getElementById('action-btn-1').innerText = "BET (लगाएं)";
        document.getElementById('action-btn-1').style.background = "#00c853";
        document.getElementById('msg-1').className = "msg";
        document.getElementById('msg-1').innerText = `🎉 ऑटो कैशआउट! ₹${p1} जीत गए!`;
        document.getElementById('live-profit-1').style.display = "none";
        updateServerBetStatus(myUserId + "_1", "✅ " + currentMult.toFixed(2) + "x (₹" + p1 + ")");
      }
    }

    if(isPlaying2) {
      let p2 = Math.floor(betAmt2 * currentMult);
      document.getElementById('live-profit-2').style.display = "block";
      document.getElementById('live-profit-2').innerText = `📈 लाइव जीत: ₹${p2}`;
      document.getElementById('action-btn-2').innerText = `CASHOUT (₹${p2})`;
      document.getElementById('action-btn-2').style.background = "#ff5252";

      if(currentMult >= autoTarget2) {
        walletBal += p2;
        updateBal();
        isPlaying2 = false;
        document.getElementById('action-btn-2').innerText = "BET (लगाएं)";
        document.getElementById('action-btn-2').style.background = "#00c853";
        document.getElementById('msg-2').className = "msg";
        document.getElementById('msg-2').innerText = `🎉 ऑटो कैशआउट! ₹${p2} जीत गए!`;
        document.getElementById('live-profit-2').style.display = "none";
        updateServerBetStatus(myUserId + "_2", "✅ " + currentMult.toFixed(2) + "x (₹" + p2 + ")");
      }
    }

    if(currentMult >= crashAt) {
      clearInterval(gameInterval);
      gameState = "CRASHED";
      document.getElementById('plane-graphic').innerText = "💥";
      document.getElementById('av-mult').innerText = crashAt.toFixed(2) + "x";
      document.getElementById('av-mult').style.color = "#ff5252";
      document.getElementById('av-stat').innerText = "💥 क्रैश हो गया!";

      historyList.push(crashAt);
      if(historyList.length > 10) historyList.shift();
      renderHistory();

      markFakeLiveCrashed();

      if(isPlaying1) {
        document.getElementById('msg-1').className = "error";
        document.getElementById('msg-1').innerText = "❌ आप हार गए! (पैसे डूब गए)";
        isPlaying1 = false;
        document.getElementById('action-btn-1').innerText = "BET (लगाएं)";
        document.getElementById('action-btn-1').style.background = "#00c853";
        document.getElementById('live-profit-1').style.display = "none";
        updateServerBetStatus(myUserId + "_1", "❌ क्रैश");
      }
      if(isPlaying2) {
        document.getElementById('msg-2').className = "error";
        document.getElementById('msg-2').innerText = "❌ आप हार गए! (पैसे डूब गए)";
        isPlaying2 = false;
        document.getElementById('action-btn-2').innerText = "BET (लगाएं)";
        document.getElementById('action-btn-2').style.background = "#00c853";
        document.getElementById('live-profit-2').style.display = "none";
        updateServerBetStatus(myUserId + "_2", "❌ क्रैश");
      }

      setTimeout(startBettingTimer, 2500);
    }
  }, 100);
}

// Fake Users Generator Pool
let fakeUsersData = [];
function generateFakeLiveBets() {
  let firstNames = ["Aman", "Rohit", "Vikas", "Amit", "Pooja", "Neha", "Sachin", "Rahul", "Deepak", "Sunil", "Ankit", "Manish", "Karan", "Priya", "Kajal", "Vijay", "Ajay", "Sandeep", "Ravi", "Manoj"];
  let lastNames = ["Verma", "Singh", "Gupta", "Sharma", "Yadav", "Kumar", "Mishra", "Pandey", "Thakur", "Chauhan"];
  
  fakeUsersData = [];
  let count = Math.floor(Math.random() * 11) + 40; // 40 to 50 fake users
  for(let i = 0; i < count; i++) {
    let fName = firstNames[Math.floor(Math.random() * firstNames.length)];
    let lName = lastNames[Math.floor(Math.random() * lastNames.length)];
    let uName = `${fName}_${lName}`;
    let uAmt = (Math.floor(Math.random() * 20) + 1) * 50;
    let targetCash = parseFloat((Math.random() * 4.0 + 1.1).toFixed(2));

    fakeUsersData.push({ name: uName, amt: uAmt, statusText: "⏳ इंतज़ार", status: "playing", cashAt: targetCash });
  }
}

function updateFakeLiveCashouts(currM) {
  fakeUsersData.forEach((user) => {
    if(user.status === "playing" && currM >= user.cashAt) {
      user.status = "cashed";
      let winAmt = Math.floor(user.amt * user.cashAt);
      user.statusText = `✅ ${user.cashAt}x (₹${winAmt})`;
    }
  });
  triggerListRefresh();
}

function markFakeLiveCrashed() {
  fakeUsersData.forEach((user) => {
    if(user.status === "playing") {
      user.status = "lost";
      user.statusText = "❌ क्रैश";
    }
  });
  triggerListRefresh();
}

// Real User Firebase Sync
function pushRealUserBetToFirebase(betKey, amt) {
  db.ref("aviatorServer/liveBets/" + betKey).set({
    name: "👑 " + myUserId,
    amt: amt,
    statusText: "⏳ खेल रहे हैं",
    timestamp: Date.now()
  });
}

function updateServerBetStatus(betKey, statusStr) {
  db.ref("aviatorServer/liveBets/" + betKey).update({
    statusText: statusStr
  });
}

let latestRealBetsData = null;
function renderLiveBetsList(firebaseData) {
  latestRealBetsData = firebaseData;
  triggerListRefresh();
}

function triggerListRefresh() {
  let listEl = document.getElementById('live-bets-list');
  let headerHtml = `<div style="font-weight: bold; color: #00b4d8; margin-bottom: 4px; border-bottom: 1px solid #334155; padding-bottom: 2px; position: sticky; top: 0; background: #161f2e; z-index: 2;">🟢 लाइव प्लेयर्स (Bets & Cashouts)</div>`;
  listEl.innerHTML = headerHtml;

  let combinedList = [];
  let realCount = 0;

  // 1. Add Real Users First
  if(latestRealBetsData) {
    Object.keys(latestRealBetsData).forEach(key => {
      let rUser = latestRealBetsData[key];
      realCount++;
      combinedList.push({
        name: rUser.name,
        amt: rUser.amt,
        statusText: rUser.statusText,
        isReal: true
      });
    });
  }

  // Update admin panel real user counter if open
  let adminCounter = document.getElementById('admin-real-count');
  if(adminCounter) adminCounter.innerText = realCount;

  // 2. Fill remaining slots with fake users to maintain crowd look
  let maxDisplay = 50;
  let neededFakeCount = Math.max(0, maxDisplay - combinedList.length);

  for(let i = 0; i < Math.min(neededFakeCount, fakeUsersData.length); i++) {
    let fUser = fakeUsersData[i];
    combinedList.push({
      name: fUser.name,
      amt: fUser.amt,
      statusText: fUser.statusText,
      isReal: false
    });
  }

  // Render list
  combinedList.forEach(item => {
    let div = document.createElement('div');
    div.className = 'live-bet-item';
    if(item.isReal) {
      div.style.background = "#052614"; // Real user green highlight
    }
    div.innerHTML = `<span class="u-name">${item.name}</span> <span class="u-amt">₹${item.amt}</span> <span class="u-win" style="color:${item.statusText.includes('❌') ? '#ff5252' : (item.statusText.includes('✅') ? '#00e676' : '#ffab00')}">${item.statusText}</span>`;
    listEl.appendChild(div);
  });
}

function handleBet(panelNo) {
  let inpId = panelNo === 1 ? 'bet-input-1' : 'bet-input-2';
  let autoId = panelNo === 1 ? 'auto-val-1' : 'auto-val-2';
  let btnId = panelNo === 1 ? 'action-btn-1' : 'action-btn-2';
  let msgId = panelNo === 1 ? 'msg-1' : 'msg-2';
  let profitId = panelNo === 1 ? 'live-profit-1' : 'live-profit-2';
  let amt = parseInt(document.getElementById(inpId).value);
  let target = parseFloat(document.getElementById(autoId).value);

  if(isNaN(amt) || amt < 10) { alert("कम से कम ₹10 की बेट लगाएं!"); return; }
  if(walletBal < amt) { alert("पर्याप्त बैलेंस नहीं है!"); return; }

  if(gameState === "BETTING") {
    walletBal -= amt;
    updateBal();
    if(panelNo === 1) { 
      isPlaying1 = true; betAmt1 = amt; autoTarget1 = isNaN(target) ? 2.00 : target; 
    } else { 
      isPlaying2 = true; betAmt2 = amt; autoTarget2 = isNaN(target) ? 2.00 : target; 
    }
    
    // Send real bet to server so everyone and admin can see it
    pushRealUserBetToFirebase(myUserId + "_" + panelNo, amt);

    document.getElementById(btnId).innerText = "WAITING (इंतज़ार करें)";
    document.getElementById(btnId).style.background = "#ff9800";
    document.getElementById(msgId).className = "msg";
    document.getElementById(msgId).innerText = "✅ बेट लग गई!";
  } 
  else if(gameState === "FLYING") {
    let isP = panelNo === 1 ? isPlaying1 : isPlaying2;
    if(!isP) { alert("राउंड शुरू हो चुका है!"); return; }
    
    let win = Math.floor((panelNo === 1 ? betAmt1 : betAmt2) * currentMult);
    walletBal += win;
    updateBal();
    
    if(panelNo === 1) isPlaying1 = false; else isPlaying2 = false;
    document.getElementById(btnId).innerText = "BET (लगाएं)";
    document.getElementById(btnId).style.background = "#00c853";
    document.getElementById(msgId).className = "msg";
    document.getElementById(msgId).innerText = `🎉 मैनुअल कैशआउट! ₹${win} जीत गए!`;
    document.getElementById(profitId).style.display = "none";

    updateServerBetStatus(myUserId + "_" + panelNo, "✅ " + currentMult.toFixed(2) + "x (₹" + win + ")");
  }
}

function openAdminPanel() {
  let p = prompt("गुप्त एडमिन पासवर्ड दर्ज करें:");
  if(p !== null && p.trim() === "78699") {
    let box = document.getElementById('aviator-admin-box');
    box.style.display = "block";
    box.scrollIntoView({ behavior: 'smooth' });
  } else if(p !== null) {
    alert("❌ गलत पासवर्ड!");
  }
}

function closeAviatorAdmin() {
  document.getElementById('aviator-admin-box').style.display = "none";
}

function saveAdminCrash() {
  let val = parseFloat(document.getElementById('adm-crash-val').value);
  if(!isNaN(val) && val >= 1.05) {
    db.ref("aviatorServer").set({
      crashPoint: val,
      updatedAt: Date.now()
    }, (error) => {
      if(error) {
        alert("Server par save karne mein error aayi!");
      } else {
        forcedCrash = val;
        document.getElementById('adm-status-msg').innerText = `✅ क्रैश ${val}x पर सर्वर पर लॉक हो गया!`;
        setTimeout(() => {
          closeAviatorAdmin();
        }, 1500);
      }
    });
  } else {
    alert("कृपया सही वैल्यू (उदा. 2.00) डालें!");
  }
}
