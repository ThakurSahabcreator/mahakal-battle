<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>महाकाल लूडो - Secret Admin Controlled</title>

<style>
body {
background-color: #121212;
color: #ffffff;
font-family: Arial, sans-serif;
text-align: center;
margin: 0;
padding: 20px;
user-select: none;
}
.container {
max-width: 400px;
margin: auto;
background: #1e1e1e;
padding: 20px;
border-radius: 12px;
border: 2px solid #ff7b00;
box-shadow: 0 4px 15px rgba(255, 123, 0, 0.3);
position: relative;
}
h2 { color: #ffab00; margin-top: 10px; cursor: pointer; }

.banner-img {
width: 100%;
max-height: 180px;
object-fit: cover;
border-radius: 8px;
border: 1px solid #ffab00;
margin-bottom: 10px;
}

.btn {
background: linear-gradient(to right, #673ab7, #9c27b0);
color: white;
border: none;
padding: 12px;
width: 100%;
border-radius: 6px;
font-size: 16px;
font-weight: bold;
cursor: pointer;
margin-top: 10px;
}
.btn:hover { opacity: 0.9; }

input {
width: 90%;
padding: 10px;
margin: 10px 0;
background: #2a2a2a;
border: 1px solid #444;
color: white;
border-radius: 5px;
text-align: center;
font-size: 15px;
}

.unique-wallet-card {
background: linear-gradient(135deg, #2c1a00, #4d2600);
padding: 15px;
border-radius: 10px;
margin-bottom: 15px;
border: 2px solid #ffcc00;
}
.unique-wallet-card h3 {
margin: 0;
color: #ffe680;
font-size: 20px;
}

.game-card-box {
background: #2a1a2e;
border: 2px solid #9c27b0;
border-radius: 10px;
padding: 15px;
margin: 15px 0;
}
.dice-box {
font-size: 60px;
background: #1e1e1e;
border: 2px solid #ffab00;
border-radius: 10px;
width: 90px;
height: 90px;
margin: 15px auto;
display: flex;
align-items: center;
justify-content: center;
}

.admin-panel {
background: #2a1a1a;
border: 2px solid #ff5252;
padding: 15px;
border-radius: 8px;
margin-top: 15px;
text-align: left;
display: none;
}
.msg { color: #00e676; font-size: 14px; margin-top: 10px; font-weight: bold; }
.error { color: #ff5252; font-size: 14px; margin-top: 10px; font-weight: bold; }
</style>
</head>
<body>

<div class="container">

<h2 onclick="checkSecretAdminTap()">🔱 महाकाल लूडो ज़ोन 🔱</h2>

<img src="1792858963757.png" alt="Mahakal Banner" class="banner-img">

<div class="unique-wallet-card">
<h3>💰 मेरा वॉलेट: ₹<span id="balance">19</span></h3>
<p style="font-size: 11px; color: #00e676; margin: 3px 0;" id="ludo-user-phone"></p>
<p style="font-size: 12px; color: #ffab00; margin: 5px 0 0 0;">लगाई गई बाजी: ₹<span id="last-bet-view">0</span></p>
</div>

<div class="game-card-box">
<h3 style="color: #ffab00; margin-top: 0;">🎲 लूडो पासा बैटल</h3>
<p style="font-size: 12px; color: #ccc;">बाजी की राशि दर्ज करें (न्यूनतम ₹5):</p>
<input type="number" id="ludo-bet-amount" value="10" min="5">
<div class="dice-box" id="dice-display">🎲</div>
<p style="font-size: 13px; color: #aaa;">यदि **4, 5 या 6** आया तो पैसे डबल (2x) होंगे!</p>
<button class="btn" onclick="rollLudoDice()">🎲 पासा फेंको (Roll Dice)</button>
<div id="ludo-result"></div>
</div>

<div id="admin-panel-div" class="admin-panel">
<b style="color: #ff5252;">👑 सुपर एडमिन कंट्रोल पैनल:</b>
<p style="font-size: 11px; color: #aaa; margin: 5px 0;">यहाँ से आप गेम को गुप्त रूप से कंट्रोल करें:</p>

<div style="background: #121212; padding: 8px; border-radius: 5px; margin-bottom: 10px; font-size: 12px;">
📊 यूजर की ताजा बाजी: <span id="admin-live-bet" style="color: #00e676; font-weight: bold;">₹0</span><br>
💰 यूजर का वॉलेट बैलेंस: <span id="admin-live-wallet" style="color: #ffab00; font-weight: bold;">₹19</span>
</div>

<label style="font-size: 11px;">वॉलेट बैलेंस एडिट करें:</label>
<input type="number" id="admin-wallet-input" placeholder="नया बैलेंस दर्ज करें">
<button class="btn" style="padding: 6px; font-size: 13px; background: #00e676; color: #000;" onclick="adminUpdateWallet()">बैलेंस सेव करें</button>

<label style="font-size: 11px; margin-top: 10px; display: block;">गुप्त पासा फिक्स करें (0 = नॉर्मल रैंडम, 1 से 6 = पक्का नंबर):</label>
<input type="number" id="admin-dice-fix" placeholder="0 (Auto) या 1 से 6" min="0" max="6" value="0">
<button class="btn" style="padding: 6px; font-size: 13px; background: #ff9800; color: #000;" onclick="adminSetDice()">पासा फिक्स सेव करें</button>

<button class="btn" style="background: #555; padding: 5px; font-size: 12px; margin-top: 10px;" onclick="closeSecretAdmin()">एडमिन पैनल बंद करें</button>
</div>

</div>

<script>
let currentBetAmount = 0;
let forcedDice = 0;

function getCurrentUserPhone() {
    return localStorage.getItem('active_session_phone') || localStorage.getItem('logged_in_phone');
}

function getWalletBalance() {
    let user = getCurrentUserPhone();
    if(!user) return 19;
    let bal = localStorage.getItem('user_bal_' + user);
    if(bal === null) {
        bal = '19';
        localStorage.setItem('user_bal_' + user, bal);
    }
    return parseFloat(bal);
}

function setWalletBalance(amount) {
    let user = getCurrentUserPhone();
    if(user) {
        localStorage.setItem('user_bal_' + user, amount);
        updateBalanceDisplay();
    }
}

window.onload = function() {
    updateBalanceDisplay();
};

function updateBalanceDisplay() {
    let bal = getWalletBalance();
    document.getElementById('balance').innerText = bal;
    let adminLiveBal = document.getElementById('admin-live-wallet');
    if(adminLiveBal) adminLiveBal.innerText = "₹" + bal;
    
    let user = getCurrentUserPhone();
    let phoneDisp = document.getElementById('ludo-user-phone');
    if(phoneDisp && user) {
        phoneDisp.innerText = "📱 Logged in: " + user;
    }
}

let tapCount = 0;
let lastTapTime = 0;
function checkSecretAdminTap() {
    let currentTime = new Date().getTime();
    if (currentTime - lastTapTime < 600) {
        tapCount++;
    } else {
        tapCount = 1;
    }
    lastTapTime = currentTime;

    if (tapCount === 3) {
        tapCount = 0;
        let pass = prompt("गुप्त एडमिन पासवर्ड दर्ज करें:");
        if (pass === "78699") {
            document.getElementById('admin-panel-div').style.display = "block";
            alert("✅ एडमिन पैनल सफलतापूर्वक खुल गया है!");
        } else if (pass !== null) {
            alert("❌ गलत पासवर्ड!");
        }
    }
}

function closeSecretAdmin() {
    document.getElementById('admin-panel-div').style.display = "none";
}

function adminUpdateWallet() {
    let newAmt = parseFloat(document.getElementById('admin-wallet-input').value);
    if (!isNaN(newAmt)) {
        setWalletBalance(newAmt);
        alert("✅ वॉलेट बैलेंस अपडेट हो गया: ₹" + newAmt);
    }
}

function adminSetDice() {
    let val = parseInt(document.getElementById('admin-dice-fix').value);
    if (!isNaN(val) && val >= 0 && val <= 6) {
        forcedDice = val;
        alert("✅ अगला पासा गुप्त रूप से सेट कर दिया गया है: " + (val === 0 ? "Normal Random" : val));
    }
}

const diceFaces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

function rollLudoDice() {
    let betAmt = parseInt(document.getElementById('ludo-bet-amount').value);
    if (isNaN(betAmt) || betAmt < 5) {
        alert("❌ न्यूनतम ₹5 की बाजी लगाएं!");
        return;
    }
    
    let bal = getWalletBalance();
    if (bal < betAmt) {
        alert("❌ आपके वॉलेट में पर्याप्त बैलेंस नहीं है!");
        return;
    }

    currentBetAmount = betAmt;
    document.getElementById('last-bet-view').innerText = currentBetAmount;
    let liveBetEl = document.getElementById('admin-live-bet');
    if(liveBetEl) liveBetEl.innerText = "₹" + currentBetAmount;

    setWalletBalance(bal - betAmt);

    let diceDisplay = document.getElementById('dice-display');
    let resultDiv = document.getElementById('ludo-result');
    diceDisplay.innerText = "🌀";

    setTimeout(() => {
        let diceRoll = (forcedDice > 0) ? forcedDice : (Math.floor(Math.random() * 6) + 1);
        diceDisplay.innerText = diceFaces[diceRoll - 1];

        let currentBal = getWalletBalance();
        if (diceRoll >= 4) {
            let winAmt = betAmt * 2;
            setWalletBalance(currentBal + winAmt);
            resultDiv.className = "msg";
            resultDiv.innerText = `🎉 पासा आया [${diceRoll}] - आप ₹${winAmt} जीत गए!`;
        } else {
            resultDiv.className = "error";
            resultDiv.innerText = `❌ पासा आया [${diceRoll}] - आप हार गए।`;
        }
    }, 500);
}
</script>
</body>
</html>
