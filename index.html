<p style="font-size: 13px; color: #ccc;">₹50 se ₹100 tak jode</p>
<input type="number" id="deposit-amount" placeholder="Rashi darj kare (Uda. 50, 100)" min="50" max="100">

<img src="qrcode.jpg" alt="BharatPe QR" class="qr-img" id="secure-qr">
<p style="font-size: 11px; color: #aaa;">UPI ID: BHARATPE2G0F0C1Y8Q38903@unitype</p>

<a id="upi-pay-btn" href="#" target="_blank">
<button class="btn" style="background: linear-gradient(to right, #2979ff, #00b0ff);">📱 Seedhe GPay / PhonePe se bhugtan kare</button>
</a>

<input type="text" id="txn-id" placeholder="Bhugtan ke baad UPI Ref / Txn ID yahan dale">
<button class="btn" onclick="verifyDeposit()">Paise Jode (Verify)</button>
<button class="btn" style="background:#555;" onclick="backToDashboard()">Wapas jaye</button>
</div>

<!-- Withdraw Section -->
<div id="withdraw-section" style="display:none;">
<h3>Paise Nikale (Withdrawal)</h3>
<p style="font-size: 13px; color: #ccc;">Minimum nikasi: ₹120 (Shesh ₹20 wallet me safe rahenge)</p>
<input type="number" id="withdraw-amount" placeholder="Nikasi rashi darj kare">
<button class="btn" onclick="processWithdraw()">Withdrawal pura kare</button>
<button class="btn" style="background:#555;" onclick="backToDashboard()">Wapas jaye</button>
</div>

<!-- Login Section -->
<div id="login-section">
<p>Naya khata banaye & ₹10 bonus paye!</p>
<input type="tel" id="phone" placeholder="Apna mobile number darj kare">
<button class="btn" onclick="sendOtp()">OTP bheje</button>
<input type="text" id="otp" placeholder="OTP darj kare (Demo: 1234)">
<button class="btn" onclick="verifyOtp()">Registration pura kare</button>
</div>

<div id="message" class="msg"></div>
</div>

<script>
let walletBalance = 10;
let totalDepositedByUser = 0;
let lockTimer = null;
let puzzleTimerInterval = null;
let currentCorrectAnswer = 'B';
let currentPuzzleIndex = 0;

let totalAppUsers = localStorage.getItem('totalUsers') ? parseInt(localStorage.getItem('totalUsers')) : 1;
let platformTotalDeposit = localStorage.getItem('platformDeposit') ? parseInt(localStorage.getItem('platformDeposit')) : 0;

let advBoard = ['🔱', '🕉️', '🔔', '📿', '🔱', '🕉️', '🔔', '📿', '🕉️'];
let selectedTile = null;
let advScore = 0;
let advHighScore = localStorage.getItem('mahakal_secure_highscore') ? parseInt(localStorage.getItem('mahakal_secure_highscore')) : 0;

let puzzles = [
{
q: "Aisi kaun si cheez hai jo hamesha upar jati hai, kabhi niche nahi aati?",
options: { A: "Hawa", B: "Umr (Age)", C: "Pakshi", D: "Suraj" },
answer: "B"
},
{
q: "Aisi kaun si cheez hai jise aage se bhagwan ne banaya hai aur pichhe se insan ne?",
options: { A: "Gadi", B: "Bullock Cart", C: "Tala", D: "Kankal" },
answer: "B"
},
{
q: "Wah kaun si cheez hai jo pani peete hi mar jati hai?",
options: { A: "Ped", B: "Machhli", C: "Pyas", D: "Aag" },
answer: "C"
},
{
q: "Aisi kaun si cheez hai jo andhere me to aapke sath rahti hai, lekin ujale me gayab ho jati hai?",
options: { A: "Hawa", B: "Parchhai (Shadow)", C: "Andhera", D: "Dar" },
answer: "B"
}
];

function sendSupportMessage() {
let userText = document.getElementById('user-msg').value.trim();
let replyBox = document.getElementById('support-reply');

if(userText === "") {
alert("Kripya pehle apna message likhe.");
return;
}

replyBox.style.display = "block";
replyBox.innerHTML = "⏳ Message bhej diya gaya hai... Auto-reply check ho raha hai...";

setTimeout(function() {
let lowerText = userText.toLowerCase();
let botAnswer = "🤖 Auto-Reply: Aapka message mil gaya hai. Kripya niyam anusaar game khele aur aanand le.";

if(lowerText.includes("paisa") || lowerText.includes("deposit") || lowerText.includes("add")) {
botAnswer = "🤖 Auto-Reply: Paise jodne ke liye 'Paise Jode' button par click karke QR se payment kare aur UPI Txn ID darj kare.";
} else if(lowerText.includes("withdraw") || lowerText.includes("nikal") || lowerText.includes("paisa nahi")) {
botAnswer = "🤖 Auto-Reply: Minimum withdrawal ₹120 hai aur withdrawal ke baad wallet me ₹20 safe rehta hai.";
} else if(lowerText.includes("otp")) {
botAnswer = "🤖 Auto-Reply: Demo login ke liye OTP me '1234' darj kare.";
}

replyBox.innerHTML = botAnswer;
document.getElementById('user-msg').value = "";
}, 1000);
}

document.addEventListener("visibilitychange", function() {
if (document.hidden) {
triggerSecurityLock();
}
});

document.getElementById('secure-qr').addEventListener('contextmenu', function(e) {
e.preventDefault();
alert("Security Alert: QR Code save karna mana hai!");
});

function triggerSecurityLock() {
let alertBox = document.getElementById("security-alert");
let appBox = document.getElementById("main-container");
let countDisplay = document.getElementById("countdown");

alertBox.style.display = "flex";
appBox.classList.add("blur-screen");

let timeLeft = 15;
countDisplay.innerText = timeLeft;

if (lockTimer) clearInterval(lockTimer);

lockTimer = setInterval(function() {
timeLeft--;
countDisplay.innerText = timeLeft;
if (timeLeft <= 0) {
clearInterval(lockTimer);
alertBox.style.display = "none";
appBox.classList.remove("blur-screen");
}
}, 1000);
}

function speakPuzzle() {
if ('speechSynthesis' in window) {
window.speechSynthesis.cancel();
let p = puzzles[currentPuzzleIndex];
let textToSpeak = "Paheli hai: " + p.q + ". Options hain: A, " + p.options.A + ". B, " + p.options.B + ". C, " + p.options.C + ". D, " + p.options.D;
let utterance = new SpeechSynthesisUtterance(textToSpeak);
utterance.lang = 'hi-IN';
window.speechSynthesis.speak(utterance);
} else {
alert("Aapka browser voice feature support nahi karta.");
}
}

function startPuzzleTimer() {
let timeLeft = 15;
document.getElementById('puzzle-timer').innerText = timeLeft;

if (puzzleTimerInterval) clearInterval(puzzleTimerInterval);

puzzleTimerInterval = setInterval(function() {
timeLeft--;
document.getElementById('puzzle-timer').innerText = timeLeft;

if (timeLeft <= 0) {
clearInterval(puzzleTimerInterval);
walletBalance -= 5;
updateBalanceDisplay();
let resultDiv = document.getElementById('puzzle-result');
resultDiv.className = "error";
resultDiv.innerHTML = "⏳ Samay samapt! ❌ Aapka samay khatam ho gaya aur ₹5 kat gaye.";

document.getElementById('optA').disabled = true;
document.getElementById('optB').disabled = true;
document.getElementById('optC').disabled = true;
document.getElementById('optD').disabled = true;
}
}, 1000);
}

function loadNextPuzzle() {
if (puzzleTimerInterval) clearInterval(puzzleTimerInterval);
if ('speechSynthesis' in window) window.speechSynthesis.cancel();

currentPuzzleIndex = (currentPuzzleIndex + 1) % puzzles.length;
let p = puzzles[currentPuzzleIndex];

document.getElementById('puzzle-question').innerText = p.q;
document.getElementById('textA').innerText = p.options.A;
document.getElementById('textB').innerText = p.options.B;
document.getElementById('textC').innerText = p.options.C;
document.getElementById('textD').innerText = p.options.D;
currentCorrectAnswer = p.answer;

document.getElementById('puzzle-result').innerText = "";

document.getElementById('optA').disabled = false;
document.getElementById('optB').disabled = false;
document.getElementById('optC').disabled = false;
document.getElementById('optD').disabled = false;

startPuzzleTimer();
}

function initAdvancedGame() {
advScore = 0;
document.getElementById('adv-score').innerText = advScore;
document.getElementById('adv-highscore').innerText = advHighScore;
advBoard.sort(() => Math.random() - 0.5);
renderAdvBoard();
}

function renderAdvBoard() {
const container = document.getElementById('advBoardContainer');
container.innerHTML = '';
advBoard.forEach((icon, index) => {
const tile = document.createElement('div');
tile.className = 'adv-tile';
tile.innerText = icon;
tile.onclick = () => handleAdvTileClick(index, tile);
container.appendChild(tile);
});
}

function handleAdvTileClick(index, element) {
if (selectedTile === null) {
selectedTile = index;
element.classList.add('selected');
} else {
let prevElement = document.querySelectorAll('.adv-tile')[selectedTile];
if(prevElement) prevElement.classList.remove('selected');

let temp = advBoard[selectedTile];
advBoard[selectedTile] = advBoard[index];
advBoard[index] = temp;

advScore += 15;
document.getElementById('adv-score').innerText = advScore;
if(advScore > advHighScore) {
advHighScore = advScore;
localStorage.setItem('mahakal_secure_highscore', advHighScore);
document.getElementById('adv-highscore').innerText = advHighScore;
}
selectedTile = null;
renderAdvBoard();
}
}

function resetAdvancedGame() {
initAdvancedGame();
}

function sendOtp() {
let phone = document.getElementById('phone').value;
if(phone.length === 10) {
document.getElementById('message').innerText = "OTP bhej diya gaya hai! (Demo: 1234)";
} else {
document.getElementById('message').className = "error";
document.getElementById('message').innerText = "Kripya sahi 10 anko ka mobile number dale.";
}
}

function verifyOtp() {
let otp = document.getElementById('otp').value;
if(otp === "1234") {
totalAppUsers++;
localStorage.setItem('totalUsers', totalAppUsers);

document.getElementById('login-section').style.display = "none";
document.getElementById('dashboard').style.display = "block";
document.getElementById('message').innerText = "Safalpurvak login ho gaya!";
document.getElementById('message').className = "msg";
updateBalanceDisplay();
} else {
document.getElementById('message').className = "error";
document.getElementById('message').innerText = "Galat OTP! Kripya '1234' darj kare.";
}
}

function startPuzzle() {
document.getElementById('dashboard').style.display = "none";
document.getElementById('puzzle-section').style.display = "block";
loadNextPuzzle();
}

function startAdvancedGame() {
document.getElementById('dashboard').style.display = "none";
document.getElementById('tiles-section').style.display = "block";
initAdvancedGame();
}

function checkAnswer(selectedOption) {
if (puzzleTimerInterval) clearInterval(puzzleTimerInterval);
if ('speechSynthesis' in window) window.speechSynthesis.cancel();
let resultDiv = document.getElementById('puzzle-result');

if (walletBalance < 5) {
resultDiv.className = "error";
resultDiv.innerText = "⚠️ Paheli khelne ke liye wallet me kam se kam ₹5 hone chahiye!";
return;
}

if (selectedOption === currentCorrectAnswer) {
walletBalance += 5;
updateBalanceDisplay();
resultDiv.className = "msg";
resultDiv.innerHTML = "✅ Sahi jawab! ✔️ Aapke ₹5 ke ₹10 ho gaye hain!<br><span style='color:#ffab00; font-size:13px;'>Agli paheli load ho rahi hai...</span>";

setTimeout(function() {
loadNextPuzzle();
}, 2500);

} else {
walletBalance -= 5;
updateBalanceDisplay();
resultDiv.className = "error";
resultDiv.innerHTML = "❌ Galat jawab! ❌ Aapke ₹5 kat gaye.";
}
}

function showAddMoney() {
document.getElementById('dashboard').style.display = "none";
document.getElementById('add-money-section').style.display = "block";
document.getElementById('message').innerText = "";
updateUpiLink();
}

function updateUpiLink() {
let amt = document.getElementById('deposit-argument').value || "50";
let upiId = "BHARATPE2G0F0C1Y8Q38903@unitype";
let name = "Sandeep_Kumar";
let upiLink = `upi://pay?pa=${upiId}&pn=${name}&am=${amt}&cu=INR`;
document.getElementById('upi-pay-btn').href = upiLink;
}

document.getElementById('deposit-amount').addEventListener('input', updateUpiLink);

function verifyDeposit() {
let amt = parseInt(document.getElementById('deposit-amount').value);
let txnId = document.getElementById('txn-id').value;

if(amt >= 50 && amt <= 100) {
if(txnId.trim() !== "") {
walletBalance += amt;
totalDepositedByUser += amt;
platformTotalDeposit += amt;
localStorage.setItem('platformDeposit', platformTotalDeposit);

updateBalanceDisplay();
alert("Safalpurvak UPI Ref No darj ho gaya! Aapke wallet me ₹" + amt + " jod diye gaye hain.");
backToDashboard();
} else {
alert("Kripya bhugtan karne ke baad uski UPI Ref / Transaction ID zaroor dale.");
}
} else {
alert("Kripya ₹50 se ₹100 ke beech ki rashi hi darj kare.");
}
}

function showWithdraw() {
document.getElementById('dashboard').style.display = "none";
document.getElementById('withdraw-section').style.display = "block";
document.getElementById('message').innerText = "";
}

function processWithdraw() {
let withdrawAmt = parseInt(document.getElementById('withdraw-amount').value);
if(withdrawAmt >= 120) {
if(walletBalance - withdrawAmt >= 20) {
walletBalance -= withdrawAmt;
updateBalanceDisplay();
alert("Withdrawal request safal rahi! ₹" + withdrawAmt + " jald hi aapke khate me bhej diye jayenge.");
backToDashboard();
} else {
alert("Niyam ke anusaar withdrawal ke baad wallet me shesh ₹20 bachna zaroori hai.");
}
} else {
alert("Minimum nikasi rashi ₹120 hai.");
}
}

function backToDashboard() {
if (puzzleTimerInterval) clearInterval(puzzleTimerInterval);
if ('speechSynthesis' in window) window.speechSynthesis.cancel();

document.getElementById('puzzle-section').style.display = "none";
document.getElementById('tiles-section').style.display = "none";
document.getElementById('add-money-section').style.display = "none";
document.getElementById('withdraw-section').style.display = "none";
document.getElementById('dashboard').style.display = "block";
document.getElementById('message').innerText = "";
}

function updateBalanceDisplay() {
document.getElementById('balance').innerText = walletBalance;
document.getElementById('total-deposited').innerText = totalDepositedByUser;
document.getElementById('admin-total-users').innerText = totalAppUsers;
document.getElementById('admin-total-platform-deposit').innerText = platformTotalDeposit;
}
</script>
</body>
  </html>
