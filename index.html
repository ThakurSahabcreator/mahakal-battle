<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahakal Login</title>
<style>
body {
background-color: #121212;
color: #ffffff;
font-family: Arial, sans-serif;
text-align: center;
margin: 0;
padding: 20px;
}
.container {
max-width: 400px;
margin: auto;
background: #1e1e1e;
padding: 20px;
border-radius: 12px;
border: 2px solid #ff7b00;
box-shadow: 0 4px 15px rgba(255, 123, 0, 0.3);
}
h2 { color: #ffab00; margin-top: 10px; }
.banner-img {
width: 100%;
max-height: 180px;
object-fit: cover;
border-radius: 8px;
border: 1px solid #ffab00;
margin-bottom: 10px;
}
.btn {
background: linear-gradient(to right, #ff7b00, #ffaa00);
color: white;
border: none;
padding: 12px;
width: 100%;
border-radius: 6px;
font-size: 16px;
font-weight: bold;
cursor: pointer;
margin-top: 10px;
}
input {
width: 90%;
padding: 10px;
margin: 10px 0;
background: #2a2a2a;
border: 1px solid #444;
color: white;
border-radius: 5px;
text-align: center;
font-size: 15px;
}
.msg { color: #00e676; font-size: 14px; margin-top: 10px; font-weight: bold; }
.error { color: #ff5252; font-size: 14px; margin-top: 10px; font-weight: bold; }
</style>
</head>
<body>

<div class="container">
<img src="1792858963757.png" alt="Mahakal Banner" class="banner-img">
<h2>🔱 महाकाल गेमिंग ज़ोन 🔱</h2>

<div id="login-section">
<p>Naya khata banaye & ₹10 bonus paye!</p>
<input type="tel" id="phone" placeholder="Apna mobile number darj kare">
<button class="btn" onclick="sendOtp()">OTP bheje</button>
<input type="text" id="otp" placeholder="OTP darj kare (Demo: 1234)">
<button class="btn" onclick="verifyOtp()">Registration pura kare</button>
</div>

<div id="message" class="msg"></div>
</div>

<script>
function sendOtp() {
let phone = document.getElementById('phone').value;
if(phone.length === 10) {
document.getElementById('message').innerText = "OTP bhej diya gaya hai! (Demo: 1234)";
document.getElementById('message').className = "msg";
} else {
document.getElementById('message').className = "error";
document.getElementById('message').innerText = "Kripya sahi 10 anko ka mobile number dale.";
}
}

function verifyOtp() {
let otp = document.getElementById('otp').value;
if(otp === "1234") {
document.getElementById('message').innerText = "Safalpurvak login ho gaya! Game par ja rahe hain...";
document.getElementById('message').className = "msg";
setTimeout(function() {
window.location.href = 'game.html';
}, 1000);
} else {
document.getElementById('message').className = "error";
document.getElementById('message').innerText = "Galat OTP! Kripya '1234' darj kare.";
}
}
</script>
</body>
</html>
