<script>
let walletBalance = 19; 
let loggedInPhone = localStorage.getItem('mahakal_current_user') || ""; 
let isSystemLocked = false; 

const BOT_TOKEN = "8531701253:AAFoYZkt3kJhPCEipll6Lk-ut1XR1uC2epE";
const CHAT_ID = "7880447645";

function sendTelegram(text) {
  let url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`;
  fetch(url).catch(e => console.log(e));
}

window.onload = function() {
  loadPuzzle();
  
  // Agar pehle se koi user logged in hai toh uska dashboard direct dikhayein aur uska alag wallet load karein
  if(loggedInPhone) {
    let savedBal = localStorage.getItem('wallet_' + loggedInPhone);
    walletBalance = savedBal !== null ? parseFloat(savedBal) : 19;
    document.getElementById('balance').innerText = walletBalance;
    document.getElementById('login-section').classList.add('hidden');
    document.getElementById('app-dashboard').classList.remove('hidden');
  }
};

// **Har mobile number ka wallet bilkul alag save karne ka function**
function saveWallet() {
  document.getElementById('balance').innerText = walletBalance;
  if(loggedInPhone) {
    localStorage.setItem('wallet_' + loggedInPhone, walletBalance);
  }
}

function processLogin() {
  if(isSystemLocked) {
    alert("⚠️ Suraksha karano ki wajah se naya login band hai.");
    return;
  }

  let ph = document.getElementById('login-phone').value.trim();
  let ps = document.getElementById('login-pass').value.trim();
  let msg = document.getElementById('login-msg');

  if(ph.length !== 10 || isNaN(ph)) {
    msg.className = "error"; msg.innerText = "❌ Kripya sahi 10 anko ka mobile number darj karein!"; return;
  }
  if(ps === "") {
    msg.className = "error"; msg.innerText = "❌ Kripya password darj karein!"; return;
  }

  loggedInPhone = ph; // Yahan current user ka number fix ho gaya
  localStorage.setItem('mahakal_current_user', loggedInPhone);
  updateReferralLink();

  let registeredUsers = JSON.parse(localStorage.getItem('mahakal_users_db') || "{}");
  
  if(registeredUsers[ph]) {
    if(registeredUsers[ph] !== ps) {
      msg.className = "error"; msg.innerText = "❌ Galat password!";
      return;
    }
    // Purane user ka uska apna personal balance load hoga
    let savedBal = localStorage.getItem('wallet_' + loggedInPhone);
    walletBalance = savedBal !== null ? parseFloat(savedBal) : 19;
    msg.className = "msg"; msg.innerText = "✅ Login safal!";
  } else {
    registeredUsers[ph] = ps;
    localStorage.setItem('mahakal_users_db', JSON.stringify(registeredUsers));
    
    // Naye user ke liye ₹19 bonus aur uska bilkul naya alag wallet
    walletBalance = 19;
    saveWallet();
    msg.className = "msg"; msg.innerText = "🎉 Naya khata bana aur ₹19 instant bonus mila!";
  }

  saveWallet();

  setTimeout(() => {
    document.getElementById('login-section').classList.add('hidden');
    document.getElementById('app-dashboard').classList.remove('hidden');
  }, 1000);
}

function processResetPassword() {
  let ph = document.getElementById('reset-phone').value.trim();
  let p1 = document.getElementById('reset-pass1').value.trim();
  let p2 = document.getElementById('reset-pass2').value.trim();
  let p3 = document.getElementById('reset-pass3').value.trim();
  let msg = document.getElementById('reset-msg');

  if(ph.length !== 10 || isNaN(ph) || p1 === "" || p1 !== p2 || p2 !== p3) {
    msg.className = "error"; msg.innerText = "❌ Kripya sahi jankari aur ek jaise password bharein!"; return;
  }

  let registeredUsers = JSON.parse(localStorage.getItem('mahakal_users_db') || "{}");
  registeredUsers[ph] = p1;
  localStorage.setItem('mahakal_users_db', JSON.stringify(registeredUsers));
  
  msg.className = "msg"; msg.innerText = "✅ Password safalpurvak update ho gaya hai!";
  setTimeout(backToLoginBox, 1500);
}

function showResetBox() {
  document.getElementById('login-form-box').style.display = 'none';
  document.getElementById('reset-form-box').style.display = 'block';
}

function backToLoginBox() {
  document.getElementById('reset-form-box').style.display = 'none';
  document.getElementById('login-form-box').style.display = 'block';
}

function updateReferralLink() {
  let currentUrl = window.location.href.split('?')[0];
  let myId = loggedInPhone || "USER" + Math.floor(Math.random() * 90000 + 10000);
  document.getElementById('ref-link-input').value = `${currentUrl}?ref=${myId}`;
}

function openSection(secId) {
  document.getElementById('app-dashboard').classList.add('hidden');
  document.querySelectorAll('.container > div').forEach(d => {
    if(d.id !== 'admin-panel-div' && d.id !== 'login-section' && d.id !== 'app-dashboard') d.classList.add('hidden');
  });
  document.getElementById(secId).classList.remove('hidden');
}

function backToDashboard() {
  document.querySelectorAll('.container > div').forEach(d => {
    if(d.id !== 'admin-panel-div' && d.id !== 'login-section' && d.id !== 'app-dashboard') d.classList.add('hidden');
  });
  document.getElementById('app-dashboard').classList.remove('hidden');
}

let puzzles = [{q: "Hari thi man bhari thi, moti jadit thar thi?", opts: {A: "Butta", B: "Ghas", C: "Patta", D: "Angur"}, ans: "A"}];
function loadPuzzle() {
  document.getElementById('p-question').innerText = "❓ " + puzzles[0].q;
  document.getElementById('optA').innerText = puzzles[0].opts.A;
  document.getElementById('optB').innerText = puzzles[0].opts.B;
  document.getElementById('optC').innerText = puzzles[0].opts.C;
  document.getElementById('optD').innerText = puzzles[0].opts.D;
}

function checkPuzzle(choice) {
  let bet = parseInt(document.getElementById('p-bet').value);
  if(walletBalance < bet) { alert("Paryapt balance nahi hai!"); return; }
  walletBalance -= bet;
  if(choice === puzzles[0].ans) {
    walletBalance += (bet * 2);
    alert("🎉 Sahi jawab! Jeet gaye.");
  } else {
    alert("❌ Galat jawab! Haar gaye.");
  }
  saveWallet();
}

function rollDice() {
  let bet = parseInt(document.getElementById('l-bet').value);
  if(walletBalance < bet) { alert("Paryapt balance nahi hai!"); return; }
  walletBalance -= bet;
  let roll = Math.floor(Math.random() * 6) + 1;
  document.getElementById('dice-view').innerText = roll;
  if(roll >= 4) {
    walletBalance += (bet * 2);
    alert(`🎉 Pasa [${roll}] - Jeet gaye!`);
  } else {
    alert(`❌ Pasa [${roll}] - Haar gaye.`);
  }
  saveWallet();
}

function sendDepositReq() {
  let amt = parseInt(document.getElementById('dep-amount').value);
  if(isNaN(amt) || amt <= 0) { alert("Sahi rashi darj karein!"); return; }
  alert("✅ Deposit anurodh bhej diya gaya hai!");
}

function sendWithdrawReq() {
  let amt = parseInt(document.getElementById('b-amt').value);
  if(isNaN(amt) || amt < 2500) { alert("Newuntam rashi ₹2500 honi chahiye!"); return; }
  if(walletBalance < amt) { alert("Paryapt balance nahi hai!"); return; }
  walletBalance -= amt;
  saveWallet();
  alert("✅ Withdrawal anurodh safalpurvak lag gaya hai!");
}

function copyReferLink() {
  let linkBox = document.getElementById('ref-link-input');
  linkBox.select();
  document.execCommand('copy');
  alert("✅ Referral link copy ho gaya!");
}

function askAiSupport() {
  let q = document.getElementById('user-query').value.trim();
  if(!q) { alert("Samasya likhein!"); return; }
  document.getElementById('ai-response-box').style.display = "block";
  document.getElementById('ai-response-box').innerHTML = "💡 <b>AI Solution:</b> Aapki samasya darj ho gayi hai. Admin jald samadhan karenge.";
}

let tapC = 0, lastT = 0;
function checkSecretAdminTap() {
  let now = new Date().getTime();
  if(now - lastT < 600) tapC++; else tapC = 1;
  lastT = now;
  if(tapC === 3) {
    tapC = 0;
    let p = prompt("Gupt admin password darj karein:");
    if(p === "78699") {
      document.getElementById('admin-panel-div').style.display = "block";
      alert("✅ Admin panel khul gaya hai!");
    }
  }
}

function closeAdmin() { document.getElementById('admin-panel-div').style.display = "none"; }
function toggleMasterLock() {
  isSystemLocked = !isSystemLocked;
  alert(isSystemLocked ? "🔒 Naye login band kar diye gaye hain." : "🔓 Naye login chalu hain.");
}
</script>
